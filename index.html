/* La procédure complète, en quatre étapes. Le détail vit ici plutôt que dans le
   bandeau : sur un téléphone, un bandeau de dix lignes mange tout l'écran. */
function openMigration(){
  openSheet(T('Panier a déménagé'),c=>{
    const intro=el('div','hint');
    intro.innerHTML=T('Panier est désormais hébergé sur <b>{adresse}</b>. Cette adresse-ci continue de fonctionner quelque temps, puis cessera d’être mise à jour.<br><br><b>Tes données ne suivent pas toutes seules.</b> Un navigateur cloisonne le stockage par adresse : pour lui, les deux Panier n’ont aucun rapport. Il faut donc les transférer — c’est l’étape 1, et elle prend deux minutes.',{adresse:NEW_HOME.replace('https://','')});
    intro.style.marginBottom='14px';c.appendChild(intro);

    /* ---- Étape 1 : le transfert ---- */
    const s1=mstep(1,T('Transférer tes données'));
    const s1h=el('div','hint');
    s1h.innerHTML=T('Tes recettes, repas, courses et stock partent <b>chiffrés</b> par le relais de synchro : le serveur ne peut pas les lire, seul ton code de partage les déchiffre.');
    s1.appendChild(s1h);
    const s1status=el('div','hint');s1status.style.margin='10px 0 0';
    const s1out=el('div');s1out.style.marginTop='10px';
    const go=el('button','btn btn-primary btn-block');go.style.marginTop='10px';
    go.textContent=T('Préparer le transfert');
    go.onclick=async()=>{
      go.disabled=true;go.innerHTML='<span class="spin"></span> '+esc(T('Envoi en cours...'));
      s1status.textContent='';s1out.innerHTML='';
      try{
        const {secret,neuf}=await prepareMigration();
        const url=migrationUrl(secret);
        go.style.display='none';
        s1.classList.add('done');
        s1status.innerHTML='✅ '+esc(neuf?T('Données envoyées, un code de partage a été créé pour toi.'):T('Données envoyées.'));

        const box=el('div');
        box.style.cssText='background:#fff;padding:12px;border-radius:14px;display:grid;place-items:center;min-height:200px;margin:12px auto 8px;width:max-content;box-shadow:var(--shadow)';
        s1out.appendChild(box);
        const qrh=el('div','hint');qrh.style.textAlign='center';
        qrh.textContent=T('Génération du QR...');s1out.appendChild(qrh);
        renderQrInto(box,url).then(()=>{
          qrh.innerHTML=T('<b>Scanne ce code</b> avec l’appareil photo du téléphone : il ouvrira la nouvelle adresse et récupérera tout automatiquement.');
        }).catch(()=>{box.style.display='none';qrh.textContent='';});

        const ou=el('div','hint');ou.style.textAlign='center';ou.style.margin='6px 0';
        ou.textContent=T('— ou, sur ce téléphone même —');s1out.appendChild(ou);
        const ouvrir=el('a','btn btn-accent btn-block');
        ouvrir.href=url;ouvrir.target='_blank';ouvrir.rel='noopener';
        ouvrir.textContent=T('Ouvrir la nouvelle adresse');
        s1out.appendChild(ouvrir);
        const cp=el('button','btn btn-ghost btn-block','📋 '+T('Copier le lien'));
        cp.style.marginTop='8px';
        cp.onclick=async()=>{
          try{await navigator.clipboard.writeText(url);toast(T('Lien copié'));}
          catch(e){toast(T('Copie indisponible sur ce navigateur'));}
        };
        s1out.appendChild(cp);
        const garde=el('div','mwarn');
        garde.innerHTML=T('Ce lien contient ton <b>code de partage</b>. Ne le publie nulle part : qui l’a peut lire tes données.');
        s1out.appendChild(garde);
      }catch(err){
        go.disabled=false;go.textContent=T('Réessayer');
        s1status.innerHTML='❌ '+esc(err.message)+'<br>'+esc(T('Si le relais est injoignable, utilise la sauvegarde par fichier ci-dessous.'));
      }
    };
    s1.appendChild(go);s1.appendChild(s1status);s1.appendChild(s1out);
    const alt=el('button','btn btn-ghost btn-block','💾 '+T('Plutôt par fichier (sans passer par le relais)'));
    alt.style.marginTop='10px';
    alt.onclick=async()=>{
      try{
        await exportBackup();
        toast(T('Ouvre la nouvelle adresse, puis Réglages → Restaurer'));
      }catch(e){toast(T('Échec de la sauvegarde : {msg}',{msg:e.message}));}
    };
    s1.appendChild(alt);
    const alth=el('div','hint');alth.style.marginTop='6px';
    alth.innerHTML=T('Le fichier emporte <b>tout</b>, réglages compris. Sur la nouvelle adresse : <b>Réglages → Restaurer une sauvegarde</b>.');
    s1.appendChild(alth);
    c.appendChild(s1);

    /* ---- Étape 2 : installer ---- */
    const s2=mstep(2,T('Installer la nouvelle application'));
    const ordre=PLATEFORMES.slice().sort((a,b)=>
      (b.id===(IS_IOS?'ios':IS_ANDROID?'android':'pc'))-(a.id===(IS_IOS?'ios':IS_ANDROID?'android':'pc')));
    ordre.forEach((p,i)=>{
      const d=el('details');d.open=i===0;d.style.marginTop=i?'8px':'4px';
      const sum=el('summary',null,T(p.nom));
      sum.style.cssText='cursor:pointer;font-weight:600;padding:4px 0';
      d.appendChild(sum);d.appendChild(listeOl(p.install));
      s2.appendChild(d);
    });
    c.appendChild(s2);

    /* ---- Étape 3 : vérifier AVANT de désinstaller ---- */
    const s3=mstep(3,T('Vérifier que tout est bien arrivé'));
    const s3h=el('div','hint');
    s3h.innerHTML=T('Ouvre la nouvelle application et regarde tes <b>recettes</b>, tes <b>repas</b> et ta <b>liste de courses</b>. Compare avec ce que tu as ici.');
    s3.appendChild(s3h);
    const s3w=el('div','mwarn');
    s3w.innerHTML='⚠️ '+T('<b>Ne désinstalle rien tant que tu n’as pas vérifié.</b> Désinstaller l’ancienne application efface définitivement ses données et si le transfert avait échoué, il n’y aurait plus rien à récupérer.');
    s3.appendChild(s3w);
    c.appendChild(s3);

    /* ---- Étape 4 : désinstaller ---- */
    const s4=mstep(4,T('Désinstaller l’ancienne application'));
    const s4h=el('div','hint');
    s4h.innerHTML=T('Une fois la vérification faite, et <b>seulement à ce moment-là</b> :');
    s4.appendChild(s4h);
    ordre.forEach((p,i)=>{
      const d=el('details');d.open=i===0;d.style.marginTop='8px';
      const sum=el('summary',null,T(p.nom));
      sum.style.cssText='cursor:pointer;font-weight:600;padding:4px 0';
      d.appendChild(sum);d.appendChild(listeOl(p.desinstall));
      s4.appendChild(d);
    });
    const s4h2=el('div','hint');s4h2.style.marginTop='10px';
    s4h2.innerHTML=T('Si tes proches utilisent Panier, transmets-leur la nouvelle adresse : chaque appareil doit faire la manœuvre de son côté.');
    s4.appendChild(s4h2);
    c.appendChild(s4);
  });
}

/* Le bandeau. Il n'apparaît QUE sur l'ancien hébergement — même fichier des deux côtés,
   c'est l'adresse d'ouverture qui tranche. Court volontairement : il annonce et renvoie
   vers la procédure, qui elle a la place de tout expliquer. */
const MOVE_SNOOZE_MS=7*24*3600*1000;
function initMoveBanner(){
  if(!isLegacyHost())return;
  if(Date.now()<(settings.moveSnoozeUntil||0))return;
  const bar=$('#movebar');if(!bar)return;
  bar.innerHTML='';
  const tx=el('div','mb-txt');
  tx.appendChild(el('b',null,T('Panier a déménagé')));
  tx.appendChild(el('span',null,T('Cette adresse ne sera plus mise à jour. Transfère tes données.')));
  const go=el('button','mb-go',null);go.textContent=T('Procédure');
  go.onclick=openMigration;
  const x=el('button','mb-x',null);x.textContent='×';
  x.setAttribute('aria-label',T('Masquer pendant une semaine'));
  x.onclick=async()=>{
    settings.moveSnoozeUntil=Date.now()+MOVE_SNOOZE_MS;settings.id='app';
    await dbPut('settings',settings).catch(()=>{});
    bar.hidden=true;document.body.classList.remove('has-movebar');
    toast(T('Rappel masqué une semaine'));
  };
  bar.appendChild(tx);bar.appendChild(go);bar.appendChild(x);
  bar.hidden=false;document.body.classList.add('has-movebar');
}

/* Signaler un bug / proposer une idée
   Envoi automatique et silencieux via le relais (Resend). Si le relais
   n'est pas configuré ou injoignable, repli sur l'appli mail du téléphone (mailto:).
   Version et appareil joints automatiquement dans les deux cas, pour faciliter le diagnostic. */
const FEEDBACK_EMAIL='panier.repas.courses@gmail.com';
function openFeedback(){
  let kind='bug';
  openSheet(T('Signaler un bug ou proposer une idée'),c=>{
    const hint=el('div','hint');
    hint.textContent=T('Quelques infos techniques (version, appareil) seront jointes automatiquement pour aider au diagnostic.');
    hint.style.marginBottom='12px';c.appendChild(hint);

    const chips=el('div','fchips');chips.style.marginBottom='12px';
    const bugChip=el('button','fchip');bugChip.innerHTML='<span>🐛</span>'+esc(T('Bug'));
    const ideaChip=el('button','fchip');ideaChip.innerHTML='<span>💡</span>'+esc(T('Amélioration'));
    chips.appendChild(bugChip);chips.appendChild(ideaChip);c.appendChild(chips);

    const f=el('div','field');f.innerHTML='<label>'+esc(T('Ton message'))+'</label>';
    const ta=el('textarea');
    f.appendChild(ta);c.appendChild(f);

    const sync=()=>{
      bugChip.classList.toggle('on',kind==='bug');
      ideaChip.classList.toggle('on',kind==='idea');
      ta.placeholder=kind==='bug'?T('Que s’est-il passé ? Que faisais-tu juste avant ?'):T('Quelle amélioration aimerais-tu voir ?');
    };
    bugChip.onclick=()=>{kind='bug';sync();};
    ideaChip.onclick=()=>{kind='idea';sync();};
    sync();

    const send=el('button','btn btn-accent btn-block',T('Envoyer'));
    send.onclick=async()=>{
      const msg=ta.value.trim();
      if(!msg){toast(T('Écris un message d’abord'));return;}
      send.disabled=true;send.innerHTML='<span class="spin"></span> '+esc(T('Envoi...'));
      // Envoi automatique via le relais (Resend) si configuré ; sinon, repli sur l'appli
      // mail du téléphone, le message n'est jamais perdu, juste moins automatique.
      try{
        const r=await fetch(relayBase()+'/feedback',{
          method:'POST',headers:{'Content-Type':'application/json'},
          body:JSON.stringify({kind,message:msg,version:APP_VERSION,userAgent:navigator.userAgent})
        });
        if(!r.ok)throw new Error('relais indisponible');
        closeSheet();toast(T('Message envoyé, merci !'));
        return;
      }catch(e){
        const subject='[Panier] '+(kind==='bug'?'Bug signalé':'Suggestion');
        const infos='\n\n—\nVersion: '+APP_VERSION+'\n'+T('Appareil')+': '+navigator.userAgent+'\n'+T('Date')+': '+new Date().toLocaleString(locale())+'\n'+T('Langue')+': '+LANG;
        location.href='mailto:'+FEEDBACK_EMAIL+'?subject='+encodeURIComponent(subject)+'&body='+encodeURIComponent(msg+infos);
      }finally{
        send.disabled=false;send.textContent=T('Envoyer');
      }
    };
    c.appendChild(send);
  });
}

/* Partage sélectif de recettes
   Contenu objectif uniquement, navigator.share avec fichier si dispo sinon téléchargement
   Même repli que pour le partage d'une recette individuelle. */
async function shareRecipesAsFile(list){
  if(!list.length){toast(T('Choisis au moins une recette'));return;}
  const payload={_kind:'panier-recipes',_v:1,_date:new Date().toISOString(),
    recipes:list.map(r=>({
      name:r.name,image:r.image||'',servings:r.servings||null,
      cook:r.cook||null,prep:r.prep||null,
      source:r.source||'',sourceType:r.sourceType||'manual',
      ingredients:(r.ingredients||[]).map(i=>({qty:i.qty,unit:i.unit,name:i.name})),
      steps:(r.steps||[]).slice()
    }))};
  const json=JSON.stringify(payload,null,2);
  const filename='panier-recettes-'+list.length+'.json';
  const n=list.length;
  // navigator.canShare peut lever une exception plutôt que renvoyer false selon les
  // navigateurs : tout est protégé, avec repli systématique sur le téléchargement.
  try{
    const file=new File([json],filename,{type:'application/json'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      await navigator.share({files:[file],title:T('Mes recettes Panier')});
      return;
    }
  }catch(e){
    if(e&&e.name==='AbortError')return; // partage annulé par l’utilisateur : rien à faire
  }
  const blob=new Blob([json],{type:'application/json'});
  const a=el('a');a.href=URL.createObjectURL(blob);a.download=filename;a.click();
  toast(TP(n,'{n} recette exportée — fichier téléchargé','{n} recettes exportées — fichier téléchargé'));
}
function openRecipeShareSelect(){
  if(!recipes.length){toast(T('Aucune recette à partager'));return;}
  const selected=new Set(recipes.map(r=>r.id));
  const sorted=recipes.slice().sort((a,b)=>a.name.localeCompare(b.name,locale()));
  openSheet(T('Choisir les recettes à partager'),c=>{
    const se=el('div','fsearch');se.style.marginBottom='10px';
    se.innerHTML='<svg class="mag" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>';
    const inp=el('input');inp.type='search';inp.placeholder=T('Filtrer par nom...');inp.autocomplete='off';
    se.appendChild(inp);c.appendChild(se);

    const bar=el('div');bar.style.cssText='display:flex;justify-content:space-between;align-items:center;margin:0 2px 8px';
    const countEl=el('div','hint');
    const allBtn=el('button');allBtn.style.cssText='color:var(--pine);font-weight:700;font-size:13px';
    bar.appendChild(countEl);bar.appendChild(allBtn);c.appendChild(bar);

    const list=el('div');c.appendChild(list);
    const shareBtn=el('button','btn btn-accent btn-block');shareBtn.style.marginTop='14px';
    shareBtn.onclick=()=>{closeSheet();shareRecipesAsFile(recipes.filter(r=>selected.has(r.id)));};

    function syncBar(){
      const n=selected.size;
      countEl.textContent=TP(n,'{n} recette sélectionnée','{n} recettes sélectionnées');
      allBtn.textContent=n>=recipes.length?T('Tout désélectionner'):T('Tout sélectionner');
      shareBtn.textContent=T('Partager')+(n?' ('+n+')':'');
      shareBtn.disabled=n===0;
    }
    allBtn.onclick=()=>{
      if(selected.size>=recipes.length)selected.clear();
      else recipes.forEach(r=>selected.add(r.id));
      draw();
    };

    function draw(){
      list.innerHTML='';
      const q=normIng(inp.value);
      const shown=q?sorted.filter(r=>normIng(r.name).includes(q)):sorted;
      shown.forEach(r=>{
        const row=el('div','srow'+(selected.has(r.id)?' on':''));
        const chk=el('div','chk');chk.innerHTML='<svg viewBox="0 0 24 24"><path d="M5 12l5 5L19 7"/></svg>';
        row.appendChild(chk);row.appendChild(el('div','t',r.name));
        row.onclick=()=>{
          if(selected.has(r.id))selected.delete(r.id);else selected.add(r.id);
          row.classList.toggle('on',selected.has(r.id));
          syncBar();
        };
        list.appendChild(row);
      });
      if(!shown.length)list.appendChild(el('div','hint',T('Aucune recette ne correspond.')));
      syncBar();
    }
    inp.oninput=draw;
    draw();
    c.appendChild(shareBtn);
  });
}

/* Réglages */
function openSettings(){
  openSheet(T('Réglages'),c=>{
    // Langue en premier : c'est le réglage qui commande la lecture de tous les autres.
    c.appendChild(sectionEyebrow(T('Langue'),LANGS.find(l=>l.id===LANG).label));
    const langRow=el('div','fchips');langRow.style.marginBottom='10px';
    LANGS.forEach(l=>{
      const b=el('button','fchip'+(l.id===LANG?' on':''));
      b.innerHTML='<span>'+l.flag+'</span>'+esc(l.label);
      b.onclick=async()=>{
        if(l.id===LANG)return;
        await setLang(l.id);
        openSettings();   // simplement redessinée, pour se relire dans la nouvelle langue
      };
      langRow.appendChild(b);
    });
    c.appendChild(langRow);
    c.appendChild(el('div','hint',T('Ne change que l’affichage : tes recettes, notes et articles restent tels que tu les as écrits.')));

    c.appendChild(sectionEyebrow(T('Foyer'),settings.household?T('{n} pers.',{n:settings.household}):T('non défini')));
    const hf=el('div','field');hf.innerHTML='<label>'+esc(T('Nombre de personnes dans le foyer'))+'</label>';
    const hi=el('input');hi.type='text';hi.inputMode='numeric';hi.placeholder=T('ex. 4');
    hi.value=settings.household?String(settings.household):'';
    hf.appendChild(hi);
    hf.appendChild(el('div','hint',T('Proposé par défaut comme nombre de personnes lorsque tu ajoutes une recette aux repas.')));
    c.appendChild(hf);
    const hSave=el('button','btn btn-primary btn-block',T('Enregistrer'));
    hSave.style.marginBottom='8px';
    hSave.onclick=async()=>{
      const n=parseInt(hi.value);
      settings.household=(n>0)?Math.min(50,n):null;
      settings.id='app';await dbPut('settings',settings);
      toast(T('Réglages enregistrés'));
    };
    c.appendChild(hSave);

    const nOv=Object.keys(settings.shelfOverrides||{}).length;
    c.appendChild(sectionEyebrow(T('Péremption'),nOv?TP(nOv,'{n} modifiée','{n} modifiées'):T('valeurs par défaut')));
    const shelfBtn=el('button','btn btn-ghost btn-block',T('Modifier les durées de péremption'));
    shelfBtn.style.marginBottom='8px';
    shelfBtn.onclick=()=>openShelfLifeSettings();
    c.appendChild(shelfBtn);

    // Synchronisation entre appareils
    c.appendChild(sectionEyebrow(T('Synchro entre appareils'),syncEnabled()?T('active'):T('inactive')));
    // Code herite d'avant le durcissement : on previent sans rien casser.
    if(settings.syncSecret&&syncSecretBits(settings.syncSecret)<SYNC_MIN_BITS){
      const warn=el('div','hint');
      warn.innerHTML='⚠️ '+T('<b>Ton code de partage actuel est devinable.</b>Génère un nouveau code ci-dessous, puis rescanne le QR sur ton second téléphone.');
      warn.style.cssText='margin:0 0 12px;padding:10px 12px;background:#fbeadf;border-radius:10px;color:#834209';
      c.appendChild(warn);
    }
    // Pré-rempli avec le relais par défaut : sans intérêt pour un usage normal, donc masqué.
    const su=el('div','field');su.style.display='none';su.innerHTML='<label>'+esc(T('URL du serveur de synchro'))+'</label>';
    const suI=el('input');suI.type='url';suI.inputMode='url';suI.autocomplete='off';
    suI.value=settings.syncUrl||relayBase();suI.placeholder=DEFAULT_RELAY;
    su.appendChild(suI);c.appendChild(su);

    const sk=el('div','field');sk.innerHTML='<label>'+esc(T('Code de partage (secret)'))+'</label>';
    const skI=el('input');skI.type='text';skI.autocomplete='off';skI.autocapitalize='characters';
    skI.spellcheck=false;skI.style.cssText='font-family:ui-monospace,Consolas,monospace;letter-spacing:.04em';
    // Aucun code encore configure : on en tire un tout de suite plutot que de laisser
    // l'utilisateur en inventer un — c'est le fond de PAN-2.
    skI.value=settings.syncSecret||generateSyncSecret();
    skI.placeholder='XXXXX-XXXXX-XXXXX-XXXXX-XXXXX';
    sk.appendChild(skI);

    // Indicateur de solidite, mis a jour a chaque frappe.
    const strength=el('div','hint');strength.style.marginTop='6px';
    const syncStrength=()=>{
      const bits=syncSecretBits(skI.value);
      if(!skI.value.trim()){strength.textContent=T('Sans code, la synchro reste désactivée.');strength.style.color='';return;}
      if(bits>=100){strength.textContent='✅ '+T('Code solide (~{bits} bits) et indevinable.',{bits});strength.style.color='var(--accent,inherit)';}
      else if(bits>=SYNC_MIN_BITS){strength.textContent='⚠️ '+T('Code acceptable (~{bits} bits), mais un code généré serait bien plus sûr.',{bits});strength.style.color='';}
      else{strength.textContent='❌ '+T('Code trop faible (~{bits} bits) : devinable hors ligne. Génère un code.',{bits});strength.style.color='var(--danger,#b3261e)';}
    };
    skI.addEventListener('input',syncStrength);
    sk.appendChild(strength);

    const gen=el('button','btn btn-ghost btn-block','🎲 '+T('Générer un nouveau code'));
    gen.style.marginTop='8px';
    gen.onclick=()=>{
      skI.value=generateSyncSecret();syncStrength();
      toast(T('Code tiré au sort. Partage-le par QR code'));
    };
    sk.appendChild(gen);
    const cp=el('button','btn btn-ghost btn-block','📋 '+T('Copier le code'));
    cp.style.marginTop='8px';
    cp.onclick=async()=>{
      try{await navigator.clipboard.writeText(skI.value.trim());toast(T('Code copié'));}
      catch(e){toast(T('Copie indisponible, recopie-le à la main'));}
    };
    sk.appendChild(cp);
    const qrBtn=el('button','btn btn-ghost btn-block','📷 '+T('Partager par QR code'));
    qrBtn.style.marginTop='8px';
    qrBtn.onclick=()=>openSyncQr(skI.value.trim());
    sk.appendChild(qrBtn);
    const skh=el('div','hint');
    skh.innerHTML=T('Ce code chiffre tes données <b>avant</b> l’envoi : le serveur ne peut pas les lire, et personne ne peut y accéder sans lui. <b>Ne l’invente pas</b> — la sécurité de la synchro tient entièrement à son caractère imprévisible. Fais-le générer ici, puis scanne le QR code depuis l’autre téléphone. Si tu le perds, les données déjà envoyées deviennent illisibles.');
    sk.appendChild(skh);c.appendChild(sk);
    syncStrength();

    const sSave=el('button','btn btn-primary btn-block',T('Enregistrer et synchroniser'));
    sSave.style.marginBottom='8px';
    sSave.onclick=async()=>{
      const typed=skI.value.trim();
      // Un code trop faible n'est pas enregistre : c'est le seul verrou qui tienne,
      // puisque tout le reste de la chaine en depend.
      if(typed&&syncSecretBits(typed)<SYNC_MIN_BITS){
        toast(T('Code trop faible! Utilise « Générer un nouveau code »'));
        skI.focus();return;
      }
      const changedSecret=(settings.syncSecret||'')!==typed;
      settings.syncUrl=suI.value.trim();
      settings.syncSecret=typed;
      if(changedSecret){settings.syncCursor=0;settings.syncPushedAt=0;_sync.key=null;}
      settings.id='app';await dbPut('settings',settings);
      closeSheet();
      if(syncEnabled())syncRun(true);else toast(T('Synchro désactivée'));
    };
    c.appendChild(sSave);
    if(syncEnabled()){
      const now=el('button','btn btn-ghost btn-block',T('Synchroniser maintenant'));
      now.style.marginBottom='8px';
      now.onclick=()=>{closeSheet();syncRun(true);};

    // Sauvegarde : indispensable sur la nouvelle adresse pour recevoir un fichier de
    // migration, et utile en soi partout ailleurs.
    c.appendChild(sectionEyebrow(T('Sauvegarde'),T('{n} magasins',{n:STORES.length})));

    const bim=el('button','btn btn-ghost btn-block','📥 '+T('Restaurer une sauvegarde'));

      try{
        const n=await restoreBackup(f);
        closeSheet();toast(TP(n,'{n} élément restauré','{n} éléments restaurés'));
      }catch(e){toast(T('Échec : {msg}',{msg:e.message}));}

    const bh=el('div','hint');bh.style.marginBottom='4px';
    bh.innerHTML=T('La sauvegarde contient <b>tout</b> : recettes, repas, courses, stock et réglages. Elle sert aussi à déménager d’une adresse à l’autre.');
    c.appendChild(bh);

    // Rappel de migration, sur l'ancienne adresse uniquement.
    if(isLegacyHost()){
      const bmig=el('button','btn btn-accent btn-block','🚚 '+T('Migrer vers la nouvelle adresse'));
      bmig.style.margin='10px 0 8px';
      bmig.onclick=()=>{closeSheet();openMigration();};

    }

    c.appendChild(sectionEyebrow(T('Application'),'v'+APP_VERSION));
    const upd=el('button','btn btn-ghost btn-block',T('Rechercher une mise à jour'));
    upd.style.marginBottom='8px';
    upd.onclick=()=>{closeSheet();checkForUpdate(true);};
    c.appendChild(upd);
    const uh=el('div','hint');
    uh.textContent=T('L’app se met à jour toute seule au lancement quand tu es connecté. Ce bouton force la vérification.');
    uh.style.marginBottom='12px';

    const fb=el('button','btn btn-ghost btn-block','🐛 '+T('Signaler un bug / proposer une idée'));
    fb.style.marginBottom='8px';

    c.appendChild(fb);

    c.appendChild(sectionEyebrow(T('Données'),recipes.length+meals.length+shopping.length+stock.length));
    const stat=el('div','hint');
    stat.textContent=T('{r} recettes · {m} repas · {a} articles · {s} en stock. Tout est stocké sur cet appareil.',
      {r:recipes.length,m:meals.length,a:shopping.length,s:stock.length});
    stat.style.marginBottom='12px';c.appendChild(stat);

    const exp=el('button','btn btn-ghost btn-block',T('Exporter (sauvegarde JSON)'));exp.style.marginBottom='8px';
    exp.onclick=()=>{
      // Construit à partir de SYNCED_STORES plutôt que listé à la main, pour ne pas oublier
      // un store si un autre est ajouté un jour (c'est ce qui manquait pour "stock").
      const state={recipes,meals,shopping,stock};
      const dump={settings,_v:1,_date:new Date().toISOString()};
      for(const st of SYNCED_STORES)dump[st]=state[st];
      const blob=new Blob([JSON.stringify(dump,null,2)],{type:'application/json'});
      const a=el('a');a.href=URL.createObjectURL(blob);a.download='panier-sauvegarde.json';a.click();
    };
    c.appendChild(exp);

    const impLbl=el('label','btn btn-ghost btn-block');impLbl.textContent=T('Importer une sauvegarde');impLbl.style.marginBottom='8px';
    const fi=el('input');fi.type='file';fi.accept='application/json';fi.style.display='none';
    fi.onchange=async()=>{
      const file=fi.files&&fi.files[0];if(!file)return;
      try{
        const d=JSON.parse(await file.text());
        if(!d||typeof d!=='object')throw new Error('structure');
        if(!confirm(T('Remplacer les données actuelles par la sauvegarde ?')))return;
        // On écrit d'abord, on retire ensuite : à aucun moment les données ne sont
        // détruites avant que la sauvegarde ne soit effectivement en place.
        const keep={};for(const st of SYNCED_STORES)keep[st]=new Set();
        for(const st of SYNCED_STORES){
          for(const rec of (d[st]||[])){
            if(!rec||!rec.id)continue;
            keep[st].add(rec.id);
            await save(st,rec);
          }
        }
        for(const st of SYNCED_STORES){
          for(const rec of await dbGetAll(st)){
            if(!rec.deleted&&!keep[st].has(rec.id))await softDelete(st,rec.id);
          }
        }
        if(d.settings){d.settings.id='app';await dbPut('settings',d.settings);}
        await loadAll();closeSheet();renderAll();toast(T('Sauvegarde importée'));
      }catch(e){toast(T('Fichier invalide'));}
    };
    impLbl.appendChild(fi);c.appendChild(impLbl);

    c.appendChild(sectionEyebrow(T('Partager des recettes'),TP(recipes.length,'{n} recette','{n} recettes')));
    const shareHint=el('div','hint');
    shareHint.textContent=T('Choisis les recettes à envoyer à quelqu’un d’autre. Contrairement à la sauvegarde ci-dessus, l’import qui suit AJOUTE les recettes reçues aux siennes sans rien remplacer ni supprimer.');
    shareHint.style.marginBottom='10px';c.appendChild(shareHint);

    const shareBtn=el('button','btn btn-ghost btn-block',T('Partager mes recettes'));
    shareBtn.style.marginBottom='8px';
    shareBtn.onclick=()=>{closeSheet();openRecipeShareSelect();};
    c.appendChild(shareBtn);

    const impRecLbl=el('label','btn btn-ghost btn-block');impRecLbl.textContent=T('Importer des recettes partagées');impRecLbl.style.marginBottom='8px';
    const fiRec=el('input');fiRec.type='file';fiRec.accept='application/json';fiRec.style.display='none';
    fiRec.onchange=async()=>{
      const file=fiRec.files&&fiRec.files[0];if(!file)return;
      try{
        const d=JSON.parse(await file.text());
        const incoming=Array.isArray(d)?d:(Array.isArray(d&&d.recipes)?d.recipes:null);
        if(!incoming)throw new Error('structure');
        // Ajout pur : aucune suppression, et on évite les doublons par nom plutôt que par id,
        // puisque les id n'ont aucun sens d'un appareil à l'autre.
        const existingNames=new Set(recipes.map(r=>normIng(r.name)));
        let added=0,skipped=0;
        for(const rec of incoming){
          const name=rec&&rec.name?String(rec.name).trim():'';
          if(!name)continue;
          const key=normIng(name);
          if(existingNames.has(key)){skipped++;continue;}
          const nr={
            id:uid(),name,image:rec.image||'',servings:rec.servings||null,
            cook:rec.cook||null,prep:rec.prep||null,
            source:rec.source||'',sourceType:rec.sourceType||'manual',
            ingredients:(rec.ingredients||[]).map(i=>({qty:i&&i.qty!=null?i.qty:null,unit:(i&&i.unit)||null,name:(i&&i.name)||''})).filter(i=>i.name.trim()),
            steps:(rec.steps||[]).filter(s=>typeof s==='string'&&s.trim()),
            createdAt:Date.now(),favorite:false,notes:''
          };
          recipes.push(nr);await save('recipes',nr);
          existingNames.add(key);added++;
        }
        fiRec.value='';
        closeSheet();renderRecettes();
        toast(TP(added,'{n} recette ajoutée','{n} recettes ajoutées')
          +(skipped?' — '+TP(skipped,'{n} déjà présente, ignorée','{n} déjà présentes, ignorées'):''));
      }catch(e){toast(T('Fichier invalide'));}
    };
    impRecLbl.appendChild(fiRec);c.appendChild(impRecLbl);

    const clr=el('button','btn btn-danger btn-block',T('Tout effacer'));
    clr.onclick=async()=>{
      if(!confirm(T('Effacer toutes les recettes, repas, stock et courses ? Action irréversible.')))return;
      for(const st of SYNCED_STORES)await tombstoneAll(st);
      recipes=[];meals=[];shopping=[];stock=[];closeSheet();renderAll();toast(T('Données effacées'));
    };
    c.appendChild(clr);
  });
}

let _tourIdx=0,_tourCleanup=null;

function openTutorial(){
  _tourIdx=0;
  $('#tour').classList.add('show');
  document.body.style.overflow='hidden';
  renderTourStep();
}
function hideTourOverlay(){
  $('#tour-bg').style.display='none';$('#tour-hole').style.display='none';
  ['t','b','l','r'].forEach(k=>{$('#tour-mask-'+k).style.display='none';});
}
function endTutorial(){
  if(_tourCleanup){_tourCleanup();_tourCleanup=null;}
  $('#tour').classList.remove('show');
  hideTourOverlay();
  document.body.style.overflow='';
  if(!settings.tutorialSeen){
    settings.tutorialSeen=true;settings.id='app';
    dbPut('settings',settings);
  }
}
function nextTourStep(){
  if(_tourCleanup){_tourCleanup();_tourCleanup=null;}
  if(_tourIdx>=TOUR_STEPS.length-1){endTutorial();return;}
  _tourIdx++;
  const step=TOUR_STEPS[_tourIdx];
  if(step.tab)setTab(step.tab);
  requestAnimationFrame(renderTourStep);
}
// Le tutoriel s'efface pendant qu'une vraie feuille (Importer, Réglages...) déclenchée par
// l'utilisateur est ouverte, pour ne pas la recouvrir — et reprend dès qu'elle se ferme.
function waitForSheetClose(cb){
  const sheetEl=$('#sheet');
  if(!sheetEl.classList.contains('show')){cb();return;}
  const mo=new MutationObserver(()=>{
    if(!sheetEl.classList.contains('show')){mo.disconnect();cb();}
  });
  mo.observe(sheetEl,{attributes:true,attributeFilter:['class']});
}
function positionTourHole(target){
  const r=target.getBoundingClientRect(),pad=6;
  const hx=r.left-pad,hy=r.top-pad,hw=r.width+pad*2,hh=r.height+pad*2;
  const hole=$('#tour-hole');
  hole.style.display='block';
  hole.style.left=hx+'px';hole.style.top=hy+'px';
  hole.style.width=hw+'px';hole.style.height=hh+'px';

  // Le halo n'est que visuel (pointer-events:none) : ces 4 bandes bloquent réellement les
  // clics partout SAUF sur le bouton encadré, qui reste seul cliquable dans cette zone.
  const vw=window.innerWidth,vh=window.innerHeight;
  const mt=$('#tour-mask-t'),mb=$('#tour-mask-b'),ml=$('#tour-mask-l'),mr=$('#tour-mask-r');
  mt.style.cssText='display:block;left:0;top:0;width:'+vw+'px;height:'+Math.max(0,hy)+'px';
  mb.style.cssText='display:block;left:0;top:'+(hy+hh)+'px;width:'+vw+'px;height:'+Math.max(0,vh-(hy+hh))+'px';
  ml.style.cssText='display:block;left:0;top:'+hy+'px;width:'+Math.max(0,hx)+'px;height:'+hh+'px';
  mr.style.cssText='display:block;left:'+(hx+hw)+'px;top:'+hy+'px;width:'+Math.max(0,vw-(hx+hw))+'px;height:'+hh+'px';
}
function positionTourCard(card,target){
  const r=target.getBoundingClientRect();
  const vw=window.innerWidth,vh=window.innerHeight;
  const w=Math.min(300,vw-32);
  card.style.width=w+'px';
  card.style.left=Math.min(Math.max(16,r.left+r.width/2-w/2),vw-w-16)+'px';
  if(r.bottom+160<vh){card.style.top=(r.bottom+16)+'px';card.style.bottom='';}
  else{card.style.bottom=(vh-r.top+16)+'px';card.style.top='';}
}
function renderTourStep(){
  const step=TOUR_STEPS[_tourIdx];
  const bg=$('#tour-bg'),hole=$('#tour-hole'),card=$('#tour-card');
  const target=step.kind==='tap'?document.querySelector(step.sel):null;
  card.innerHTML='';

  const dots=el('div','tour-dots');
  TOUR_STEPS.forEach((_,i)=>dots.appendChild(el('span','tour-dot'+(i===_tourIdx?' on':''))));

  const isLast=_tourIdx===TOUR_STEPS.length-1;
  const spotlight=!!target;
  if(spotlight){
    bg.style.display='none';
    positionTourHole(target);
    card.className='tour-card';
    positionTourCard(card,target);
  }else{
    // Étape « center », ou cible introuvable (tutoriel rappelé sur un état différent) :
    // repli sur une carte centrée, sans bloquer la progression.
    bg.style.display='block';
    ['t','b','l','r'].forEach(k=>{$('#tour-mask-'+k).style.display='none';});
    hole.style.display='none';
    card.className='tour-card center';
    card.style.width=Math.min(320,window.innerWidth-48)+'px';
  }

  if(step.icon)card.appendChild(el('div','ic',step.icon));
  card.appendChild(el('h3',null,T(step.title)));
  card.appendChild(el('p',null,T(step.text)));
  card.appendChild(dots);

  const foot=el('div','tour-foot');
  const skip=el('button','tour-skip',T('Passer le tutoriel'));skip.onclick=endTutorial;
  foot.appendChild(skip);
  if(spotlight){
    foot.appendChild(el('div','tour-hint','👉 '+T('Tape le bouton en surbrillance')));
  }else{
    const next=el('button','btn btn-accent',isLast?T('C’est parti'):T('Suivant'));
    next.onclick=isLast?endTutorial:nextTourStep;
    foot.appendChild(next);
  }
  card.appendChild(foot);

  if(spotlight){
    const onTap=()=>{
      hideTourOverlay();card.style.display='none';
      const resume=()=>{card.style.display='';nextTourStep();};
      if(step.after==='sheet')waitForSheetClose(resume);
      else setTimeout(resume,180);
    };
    target.addEventListener('click',onTap,{once:true});
    _tourCleanup=()=>target.removeEventListener('click',onTap);
  }
}

function compareVersions(a,b){
  const pa=String(a||'0').split('.').map(Number),pb=String(b||'0').split('.').map(Number);
  for(let i=0;i<Math.max(pa.length,pb.length);i++){
    const d=(pa[i]||0)-(pb[i]||0);
    if(d)return d;
  }
  return 0;
}
function openChangelog(prevVersion){
  const entries=CHANGELOG.filter(e=>compareVersions(e.version,prevVersion)>0);
  if(!entries.length)return;
  openSheet(T('Nouveautés'),c=>{
    entries.forEach(e=>{
      c.appendChild(sectionEyebrow(T('Version {v}',{v:e.version}),e.date||''));
      const ul=el('ul','changelog-list');
      e.items.forEach(t=>ul.appendChild(el('li',null,T(t))));
      c.appendChild(ul);
    });
    const ok=el('button','btn btn-accent btn-block',T('Compris'));
    ok.onclick=closeSheet;
    c.appendChild(ok);
  });
}

/* Mises à jour de l'application */
const APP_VERSION='3.1.0';
let _swReg=null,_reloading=false;

function showUpdateBanner(worker){
  // Le bandeau (élément .toast, z-index élevé) passerait au-dessus d'une feuille ouverte
  // (ex. les Nouveautés au lancement) et en cacherait le bas. On attend qu'elle se ferme.
  if($('#sheet').classList.contains('show')){
    waitForSheetClose(()=>showUpdateBanner(worker));
    return;
  }
  const t=$('#toast');
  t.textContent=T('Nouvelle version. Appuyer pour recharger');
  t.style.pointerEvents='auto';
  t.classList.add('show');
  clearTimeout(toast._t);
  t.onclick=()=>{
    t.onclick=null;t.style.pointerEvents='';t.classList.remove('show');
    if(worker)worker.postMessage('SKIP_WAITING');
    setTimeout(()=>{if(!_reloading){_reloading=true;location.reload();}},400);
  };
  // Le bandeau reste 5 s, puis s'efface : la mise à jour s'appliquera au prochain lancement.
  toast._t=setTimeout(()=>{t.onclick=null;t.style.pointerEvents='';t.classList.remove('show');},5000);
}

function watchForUpdate(reg){
  if(!reg)return;
  if(reg.waiting)showUpdateBanner(reg.waiting);
  reg.addEventListener('updatefound',()=>{
    const nw=reg.installing;
    if(!nw)return;
    nw.addEventListener('statechange',()=>{
      // "installed" avec un contrôleur déjà en place = mise à jour en attente
      if(nw.state==='installed'&&navigator.serviceWorker.controller)showUpdateBanner(nw);
    });
  });
}

async function checkForUpdate(manual){
  if(!('serviceWorker'in navigator)){if(manual)toast(T('Non pris en charge par ce navigateur'));return;}
  try{
    const reg=_swReg||await navigator.serviceWorker.getRegistration();
    if(!reg){if(manual)toast(T('Application non installée en local'));return;}
    await reg.update();
    if(manual){
      if(reg.waiting)showUpdateBanner(reg.waiting);
      else toast(T('Tu es déjà à jour (v{v})',{v:APP_VERSION}));
    }
  }catch(e){ if(manual)toast(T('Vérification impossible, es-tu hors-ligne ?')); }
}

function initServiceWorker(){
  if(!('serviceWorker'in navigator))return;
  // updateViaCache:'none' => sw.js n'est jamais servi depuis le cache HTTP,
  // sans quoi le navigateur peut garder l'ancien pendant des heures.
  navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(reg=>{
    _swReg=reg;
    watchForUpdate(reg);
    // Vérification au lancement, puis toutes les heures si l'app reste ouverte.
    checkForUpdate(false);
    setInterval(()=>checkForUpdate(false),60*60*1000);
  }).catch(()=>{});
  // Quand l'app revient au premier plan, on revérifie.
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkForUpdate(false);});
  navigator.serviceWorker.addEventListener('controllerchange',()=>{
    if(_reloading)return;_reloading=true;location.reload();
  });
}

/* Réception d'un code de synchro scanné en QR. */
async function applySyncCodeFromUrl(q){
  const secret=cleanText(q.get('syncSecret'),200);
  const url=safeUrl(q.get('syncUrl'));
  if(syncSecretBits(secret)<SYNC_MIN_BITS){
    toast(T('Code de synchro refusé : trop faible pour être sûr'));
    history.replaceState(null,'',location.pathname);return;
  }
  // Un lien peut aussi transporter un serveur de synchro. L'appliquer en silence
  // laisserait un tiers detourner tout le trafic de l'appli vers sa machine : on demande.
  if(url&&url.replace(/\/+$/,'')!==relayBase()){
    if(!confirm(T('Ce lien veut aussi changer le serveur de synchro pour :\n\n{url}\n\nNe l’accepte que si tu l’as généré toi-même. Continuer ?',{url})))return;
    settings.syncUrl=url;
  }
  settings.syncSecret=secret;
  settings.syncCursor=0;settings.syncPushedAt=0;_sync.key=null;
  // Qui arrive par un lien de synchro connaît déjà l'application : ni tutoriel, ni
  // fenêtre de nouveautés par-dessus la récupération de ses données.
  settings.tutorialSeen=true;
  settings.id='app';
  await dbPut('settings',settings);
  history.replaceState(null,'',location.pathname);
  toast(T('Code de synchro reçu, synchronisation...'));
  syncRun(true);
}

  'Amélioration : les quantités abrégées « 2 c. à s. », « 1 c. à c. » et « 1 branche de thym » sont maintenant reconnues à l’import.':'Improved: the shorthand quantities “2 c. à s.”, “1 c. à c.” and “1 branche de thym” are now recognised on import.',
};
/* Les mots-clés de péremption tirent leur libellé anglais de leur premier alias : inutile
   de répéter ici les 150 lignes de SHELF_ALIASES. */
for(const k in SHELF_ALIASES){if(EN[k]===undefined)EN[k]=SHELF_ALIASES[k][0];}

async function boot(){
  await openDB();await loadAll();
  // La langue est connue avant le premier rendu : sinon l'app clignoterait en français.
  LANG=isLang(settings.lang)?settings.lang:detectLang();
  applyStaticI18n();
  renderAll();
  $('#bar-title').textContent=T(TITLES[_curTab]);
  const q=new URLSearchParams(location.search);
  const t=q.get('tab');if(t&&TITLES[t])setTab(t);

  // Suivi de version pour les Nouveautés : mis à jour immédiatement, indépendamment de
  // l'affichage de la fenêtre (décidé plus bas, en concurrence avec les autres écrans
  // d'accueil). Absent (première installation) => pas de fenêtre, juste une référence posée.
  const prevVersion=settings.lastSeenVersion;
  if(prevVersion!==APP_VERSION){
    settings.lastSeenVersion=APP_VERSION;settings.id='app';
    dbPut('settings',settings).catch(()=>{});
  }

  // Partage entrant (share_target) : une URL partagée ouvre l'import pré-rempli.
  const shared=q.get('shared')||q.get('text')||'';
  const m=shared.match(/https?:\/\/\S+/);
  if(m){setTab('recettes');openImportLink(m[0]);}
  else if(q.get('action')==='import'){setTab('recettes');openImport();}
  else if(q.get('syncSecret')){await applySyncCodeFromUrl(q);}
  // Tout premier lancement : la langue d'abord, le tutoriel ensuite (dans cette langue).
  else if(!settings.lang){openLanguagePicker(()=>{if(!settings.tutorialSeen)openTutorial();});}
  else if(!settings.tutorialSeen){openTutorial();}
  else if(prevVersion&&compareVersions(APP_VERSION,prevVersion)>0){openChangelog(prevVersion);}
  initMoveBanner();
  initServiceWorker();
  purgeTombstones().catch(()=>{});
  if(syncEnabled()){
    syncRun(false);
    document.addEventListener('visibilitychange',()=>{if(!document.hidden)syncRun(false);});
    setInterval(()=>syncRun(false),5*60*1000);
  }
}
boot();
</script>

/* Réalignement des clés déjà enregistrées
   Les clés de réserve et de courses sont recalculées avec ingKey() : « gousses d'ail » et
   « poireaux » retombent sur « ail » et « poireau », donc les recettes y puisent enfin. Deux
   articles qui se retrouvent sur la même clé sont fusionnés — sans quoi le second deviendrait
   invisible pour la déduction. Idempotent : sans changement, rien n'est réécrit. */
async function migrateKeys(){
  const seen=new Map();
  for(const it of stock.slice()){
    const k=stockKey(it.name);
    const dup=seen.get(k);
    if(dup){
      // Mêmes règles de cumul que stockSet() : une quantité inconnue rend le total inconnu.
      if(dup.base==null||it.base==null)dup.base=null;
      else if(dup.cls===it.cls)dup.base+=it.base;
      else dup.base=null;
      stock=stock.filter(x=>x.id!==it.id);
      await softDelete('stock',it.id);
      await save('stock',dup);
      continue;
    }
    seen.set(k,it);
    if(it.key!==k){it.key=k;await save('stock',it);}
  }
  const seenItems=new Map();
  for(const it of shopping.slice()){
    const k=aggKey(it.name,it.unit);
    const gk=k+'#'+(it.checked?1:0);
    const dup=seenItems.get(gk);
    if(dup){
      dup.sources=(dup.sources||[]).concat(it.sources||[]);
      if(it.manual){
        dup.manual=true;
        dup.manualBase=(dup.manualBase!=null||it.manualBase!=null)?((dup.manualBase||0)+(it.manualBase||0)):null;
      }
      shopping=shopping.filter(x=>x.id!==it.id);
      await softDelete('shopping',it.id);
      await save('shopping',dup);
      continue;
    }
    seenItems.set(gk,it);
    if(it.key!==k){it.key=k;await save('shopping',it);}
  }
}

/* Agrégation courses */
function findItemByKey(key){return shopping.find(i=>i.key===key&&!i.checked);}
function itemEffectiveBase(it){let sum=it.manual?(it.manualBase||0):0,has=it.manual&&it.manualBase!=null;for(const s of it.sources){if(s.base!=null){sum+=s.base;has=true;}}return has?sum:null;}
async function addIngredientToShopping(ing,scale,mealId,recipeName){
  const name=ing.name,unit=ing.unit||null,cls=unitClass(unit);
  const base=ing.qty!=null?toBase(ing.qty*scale,unit):null;
  const key=aggKey(name,unit);let it=findItemByKey(key);
  if(!it){it={id:uid(),key,name,unit,cls,category:categorize(name),checked:false,manual:false,manualBase:null,sources:[]};shopping.push(it);}
  it.sources.push({mealId,recipeName,base});await save('shopping',it);
}
async function removeMealContributions(mealId){
  for(const it of shopping.slice()){
    const before=it.sources.length;
    it.sources=it.sources.filter(s=>s.mealId!==mealId);
    if(it.sources.length===before)continue;
    if(it.sources.length===0&&!it.manual){shopping=shopping.filter(x=>x.id!==it.id);await softDelete('shopping',it.id);}
    else await save('shopping',it);
  }
}
/* Un repas est d'abord planifié : rien ne part dans les courses tant que la semaine n'est
   pas validée, puisque le stock peut déjà couvrir une partie des besoins. */
async function addMeal(recipe,servings){
  const meal={id:uid(),recipeId:recipe.id,recipeName:recipe.name,servings,
    base:recipe.servings||servings,createdAt:Date.now(),status:'planned'};
  meals.push(meal);await save('meals',meal);
  return (recipe.ingredients||[]).length;
}
async function removeMeal(mealId){
  const m=meals.find(x=>x.id===mealId);
  // Repas validé : ce qui avait été prélevé dans le stock y retourne.
  if(m&&m.consumed&&m.consumed.length)await stockRestore(m.consumed);
  meals=meals.filter(x=>x.id!==mealId);
  await softDelete('meals',mealId);
  await removeMealContributions(mealId);
}
/* Repas effectivement cuisiné : on le retire SANS restituer le stock consommé, puisqu'il a
   vraiment été mangé contrairement à removeMeal. */
async function finishMeal(mealId){
  meals=meals.filter(x=>x.id!==mealId);
  await softDelete('meals',mealId);
  await removeMealContributions(mealId);
}

/* 
   Import par lien
*/
/* PAN-1 — Frontière de confiance.
   Tout ce qui entre depuis un site tiers (Marmiton, Jow, CuisineAZ, 750g, TheMealDB,
   Wikimedia) ou depuis une lecture OCR est traité comme hostile. Avant de toucher
   l'application, chaque champ est ramené de force à du texte simple, à un nombre borné,
   ou à une URL http(s). Un titre piégé (« <img src=x onerror=...> ») redevient alors du
   texte affiché, jamais du HTML interprété — et ce quel que soit le point d'affichage. */
const TXT_MAX=200,STEP_MAX=1000,ING_MAX=120,URL_MAX=2000;
const SOURCE_TYPES=['marmiton','jow','cuisineaz','750g','mealdb','web','photo','manual'];
/* Texte : caractères de contrôle retirés, espaces normalisés, longueur bornée. */
function cleanText(v,max){
  if(v==null)return'';
  return String(v).replace(/[\u0000-\u001F\u007F\u2028\u2029]/g,' ')
                  .replace(/\s+/g,' ').trim().slice(0,max||TXT_MAX);
}
/* Nombre : 4 et '4 personnes' passent. Une chaine qui ne *commence* pas par un nombre
   est rejetee, pour ne pas transformer '<svg onload=alert(1)>' en une cuisson d'1 min. */
function cleanInt(v,min,max){
  let n;
  if(typeof v==='number')n=v;
  else{const m=cleanText(v,40).match(/^-?\d+/);n=m?parseInt(m[0],10):NaN;}
  if(!isFinite(n))return null;
  const r=Math.round(n);
  return(r<min||r>max)?null:r;
}
/* URL : seuls http(s) survivent. javascript:, data: et les URL malformées deviennent ''. */
function safeUrl(v){
  const t=cleanText(v,URL_MAX);
  if(!t)return'';
  try{const u=new URL(t,location.href);return(u.protocol==='http:'||u.protocol==='https:')?u.href:'';}
  catch(e){return'';}
}
/* URL destinée à une propriété CSS : on neutralise en plus tout ce qui pourrait refermer
   le url('...'), plutôt que de s'en remettre à la tolérance de l'analyseur CSS. */
function cssUrl(v){
  const u=safeUrl(v);
  return u?"url('"+u.replace(/['"()\\\s]/g,c=>'%'+c.charCodeAt(0).toString(16).padStart(2,'0'))+"')":'';
}
/* Applique la frontière à une fiche recette entière, quelle que soit sa provenance.
   Tous les normaliseurs d'import passent par ici : c'est le seul endroit à tenir à jour
   si un nouveau champ importé apparaît. */
function sanitizeRecipe(r){
  r=r||{};
  const st=cleanText(r.sourceType,20).toLowerCase();
  return{
    name:cleanText(r.name,TXT_MAX)||'Recette',
    image:safeUrl(r.image),
    source:safeUrl(r.source),
    sourceType:SOURCE_TYPES.includes(st)?st:'web',
    servings:cleanInt(r.servings,1,200),
    prep:cleanInt(r.prep,0,6000),
    cook:cleanInt(r.cook,0,6000),
    ingredients:(Array.isArray(r.ingredients)?r.ingredients:[]).slice(0,200).map(i=>({
      qty:(typeof(i&&i.qty)==='number'&&isFinite(i.qty))?i.qty:null,
      unit:(i&&i.unit!=null)?(cleanText(i.unit,20)||null):null,
      name:cleanText(i&&i.name,ING_MAX)
    })).filter(i=>i.name),
    steps:(Array.isArray(r.steps)?r.steps:[]).slice(0,60).map(x=>cleanText(x,STEP_MAX)).filter(Boolean),
    partial:!!r.partial
  };
}
function iso8601ToMin(d){if(!d||typeof d!=='string')return null;const m=d.match(/PT(?:(\d+)H)?(?:(\d+)M)?/);if(!m)return null;return (parseInt(m[1]||0)*60)+parseInt(m[2]||0);}
function firstStr(v){if(typeof v==='string')return v;if(Array.isArray(v))return firstStr(v[0]);if(v&&typeof v==='object')return v.url||v.name||v['@id']||null;return null;}
function yieldToNum(v){const s=firstStr(v);if(!s)return null;const m=(''+s).match(/\d+/);return m?parseInt(m[0]):null;}
function instrToSteps(v){const out=[];const walk=x=>{if(!x)return;if(typeof x==='string'){x.split(/\r?\n/).forEach(t=>{t=t.trim();if(t)out.push(t);});return;}if(Array.isArray(x)){x.forEach(walk);return;}if(typeof x==='object'){if(x['@type']==='HowToSection'&&(x.itemListElement||x.steps)){walk(x.itemListElement||x.steps);return;}const t=(x.text||x.name||'').toString().trim();if(t)out.push(t);}};walk(v);return out.map(s=>s.replace(/\s+/g,' ').trim()).filter(Boolean);}
function findRecipeNode(data){const seen=[];const isR=o=>o&&typeof o==='object'&&(o['@type']==='Recipe'||(Array.isArray(o['@type'])&&o['@type'].includes('Recipe')));const walk=o=>{if(!o||typeof o!=='object')return;if(isR(o)){seen.push(o);return;}if(Array.isArray(o)){o.forEach(walk);return;}if(o['@graph'])walk(o['@graph']);for(const k in o){if(k!=='@graph'&&typeof o[k]==='object')walk(o[k]);}};walk(data);return seen[0]||null;}
function extractRecipeFromHTML(html){
  const doc=new DOMParser().parseFromString(html,'text/html');
  const scripts=[...doc.querySelectorAll('script[type="application/ld+json"]')];
  let node=null;
  for(const sc of scripts){
    let data;try{data=JSON.parse(sc.textContent);}catch(e){try{data=JSON.parse(sc.textContent.replace(/[\u0000-\u001F]+/g,' '));}catch(e2){continue;}}
    node=findRecipeNode(data);if(node)break;
  }
  if(!node){
    const t=(doc.querySelector('meta[property="og:title"]')||{}).content||doc.title||'Recette';
    return sanitizeRecipe({name:t.trim(),image:(doc.querySelector('meta[property="og:image"]')||{}).content||'',servings:null,ingredients:[],steps:[],partial:true});
  }
  const raw=Array.isArray(node.recipeIngredient)?node.recipeIngredient:(node.recipeIngredient?[node.recipeIngredient]:[]);
  const ingredients=raw.map(x=>parseIngredient(typeof x==='string'?x:firstStr(x))).filter(Boolean);
  return sanitizeRecipe({name:(firstStr(node.name)||'Recette').trim(),image:firstStr(node.image)||'',servings:yieldToNum(node.recipeYield),prep:iso8601ToMin(node.prepTime),cook:iso8601ToMin(node.cookTime),ingredients,steps:instrToSteps(node.recipeInstructions),partial:ingredients.length===0});
}
function sourceType(url){const u=(url||'').toLowerCase();if(u.includes('marmiton'))return'marmiton';if(u.includes('jow'))return'jow';if(u.includes('cuisineaz'))return'cuisineaz';if(u.includes('750g'))return'750g';return'web';}
function isJowUrl(url){try{return /(^|\.)jow\.(fr|com)$/i.test(new URL(url).hostname);}catch(e){return false;}}
function extractJowId(url){
  try{
    const u=new URL(url);
    if(!isJowUrl(url))return null;
    const q=u.searchParams.get('recipeId');if(q)return q;
    const hex=u.pathname.match(/[a-f0-9]{24}/i);if(hex)return hex[0];
    const m=u.pathname.match(/\/recipes\/(.+)$/i);
    if(m){
      const last=m[1].replace(/\/+$/,'').split('-').pop();
      if(last&&last.length>=12&&/^[a-z0-9]+$/i.test(last))return last;
    }
  }catch(e){}
  return null;
}

/* Normalisation d'une recette Jow
   Structure réelle de l'API : la quantité est dans constituents[].ingredient.quantityPerCover,
   le nombre de couverts est roundedCoversCount, et l'unité se résout en croisant unit.id
   avec naturalUnit ou alternativeUnits de l'ingrédient. */
function normalizeUnitName(u){
  if(u==null)return null;
  const raw=String(u).trim();if(!raw)return null;
  if(PIECE.test(raw))return null;
  const low=raw.toLowerCase();
  for(const[k,v]of UNIT_MAP){if(k===low)return v;}
  const sing=low.replace(/\(s\)$/,'').replace(/s$/,'');
  if(PIECE.test(sing))return null;
  for(const[k,v]of UNIT_MAP){if(k===sing)return v;}
  return raw;
}
function jowUnit(c){
  const uid=c.unit&&(c.unit.id||c.unit._id);
  const ing=c.ingredient||{};
  const nat=ing.naturalUnit;
  if(nat&&uid&&(nat._id===uid||nat.id===uid))return normalizeUnitName(nat.name);
  for(const a of (ing.alternativeUnits||[])){
    const u=a.unit||a;
    if(u&&uid&&(u._id===uid||u.id===uid))return normalizeUnitName(u.name);
  }
  if(c.unit&&c.unit.name)return normalizeUnitName(c.unit.name);
  if(nat&&nat.name)return normalizeUnitName(nat.name);
  return null;
}
function jowQty(c){
  const ing=c.ingredient||{};
  for(const v of [ing.quantityPerCover,c.quantityPerCover,c.quantity]){
    if(typeof v==='number'&&isFinite(v))return v;
  }
  return null;
}
function normalizeJowRecipe(d){
  if(!d||typeof d!=='object')throw new Error(T('Réponse Jow inattendue.'));
  const covers=d.roundedCoversCount||d.coversCount||d.covers||2;
  const cons=Array.isArray(d.constituents)?d.constituents:[];
  const ingredients=cons.map(c=>{
    const ing=c.ingredient||{};
    const name=(ing.name||c.name||'').trim();
    const per=jowQty(c);
    return{qty:per!=null?Math.round(per*covers*100)/100:null,unit:jowUnit(c),name};
  }).filter(i=>i.name);
  let img=d.imageUrl||'';
  if(img&&!/^https?:/i.test(img))img='https://static.jow.fr/'+String(img).replace(/^\/+/,'');
  return sanitizeRecipe({name:(d.title||d.name||'Recette Jow').trim(),image:img,servings:covers,
    cook:d.cookingTime||null,prep:d.preparationTime||null,ingredients,steps:[],
    partial:ingredients.length===0});
}
function unwrapJow(d){
  if(Array.isArray(d))return d[0];
  if(d&&d.data)return Array.isArray(d.data)?d.data[0]:d.data;
  if(d&&d.recipe)return d.recipe;
  return d;
}

/* Recherche Jow (endpoint vérifié : POST /public/recipe/quicksearch) */
const JOW_SEARCH='https://api.jow.fr/public/recipe/quicksearch';
async function jowSearch(query,limit){
  const qs='?start=0&availabilityZoneId=FR&limit='+(limit||20)+'&query='+encodeURIComponent(query);
  const target=JOW_SEARCH+qs;
  const res=await fetch(viaProxy(target),{
    method:'POST',
    headers:{'Accept':'application/json','Content-Type':'application/json','Accept-Language':'fr','x-jow-withmeta':'1'},
    body:'{}'
  });
  if(!res.ok)throw new Error(await errMsg(res));
  const j=await res.json();
  return Array.isArray(j.data)?j.data:(Array.isArray(j)?j:[]);
}
/* Relais par défaut, intégré au code : l'app fonctionne sans configuration.
   Un réglage saisi à la main reste prioritaire. */
const DEFAULT_RELAY='https://panier-relay.bocquet-remi98.workers.dev';

/* Déménagement d'hébergement (2026).
   Panier était servi par GitHub Pages ; il l'est désormais depuis panier.remibocquet.fr.
   Les deux adresses servent EXACTEMENT le même fichier : rien ici ne peut donc reposer
   sur une version différente du code, seulement sur l'adresse d'où la page est ouverte.

   Pourquoi un transfert est nécessaire : IndexedDB est cloisonné par origine. Les données
   de remibocquet.github.io sont, pour le navigateur, sans aucun rapport avec celles de
   panier.remibocquet.fr — et aucune page ne peut lire le stockage de l'autre (les iframes
   tierces sont elles-mêmes cloisonnées par les navigateurs récents). Les données doivent
   donc VOYAGER : par la synchro chiffrée, ou par un fichier de sauvegarde. */
const NEW_HOME='https://panier.remibocquet.fr';
const LEGACY_HOSTS=['remibocquet.github.io'];
function isLegacyHost(){return LEGACY_HOSTS.includes(location.hostname);}
// Relais et synchro sont le même Worker : si un seul champ est rempli, on réutilise l'autre.
function relayBase(){
  const v=(settings.proxy||'').trim()||(settings.syncUrl||'').trim()||DEFAULT_RELAY;
  return v.replace(/\/+$/,'');
}
function viaProxy(t){
  const b=relayBase();
  return b?b+'?url='+encodeURIComponent(t):t;
}

/* Recherche TheMealDB, API officielle, gratuite, CORS ouvert.
   Clé de test publique "1" (celle documentée par TheMealDB pour un usage non-commercial) :
   pas d'inscription, mais catalogue anglophone. */
const MEALDB_BASE='https://www.themealdb.com/api/json/v1/1';
async function mealDbFetch(path){
  const r=await fetch(MEALDB_BASE+path,{headers:{'Accept':'application/json'}});
  if(!r.ok)throw new Error(T('TheMealDB indisponible ({code}).',{code:r.status}));
  return r.json();
}
async function mealDbSearchByName(q){
  const d=await mealDbFetch('/search.php?s='+encodeURIComponent(q));
  return d.meals||[];
}
async function mealDbSearchByIngredient(q){
  const d=await mealDbFetch('/filter.php?i='+encodeURIComponent(q.trim().replace(/\s+/g,'_')));
  return d.meals||[];
}
async function mealDbLookup(id){
  const d=await mealDbFetch('/lookup.php?i='+encodeURIComponent(id));
  return (d.meals||[])[0]||null;
}
/* Ingrédients TheMealDB : 20 paires strIngredientN/strMeasureN, souvent vides.
   La mesure ("3/4 cup", "1 tbsp"...) est repassée dans parseIngredient() qui sait déjà
   reconnaître les unités anglaises (UNIT_MAP les mappe vers leurs équivalents affichés). */
function normalizeMealDbRecipe(m){
  if(!m)throw new Error(T('Recette introuvable.'));
  const ingredients=[];
  for(let i=1;i<=20;i++){
    const name=(m['strIngredient'+i]||'').trim();
    if(!name)continue;
    const measure=(m['strMeasure'+i]||'').trim();
    const p=parseIngredient(measure?measure+' '+name:name);
    ingredients.push(p?{qty:p.qty,unit:p.unit,name:p.name}:{qty:null,unit:null,name});
  }
  return sanitizeRecipe({
    name:(m.strMeal||'Recette').trim(),
    image:m.strMealThumb||'',
    servings:null,prep:null,cook:null,
    ingredients,
    steps:instrToSteps(m.strInstructions),
    partial:ingredients.length===0
  });
}

/* Lecture d'une page recette jow.com
*/
function splitJowAnchor(t){
  t=(t||'').replace(/\s+/g,' ').trim();
  if(!t)return null;
  for(let len=Math.floor(t.length/2);len>=1;len--){
    const p=t.slice(0,len);
    if(t.endsWith(p)){
      const mid=t.slice(len,t.length-len).trim();
      if(mid)return{name:p.trim(),qty:mid};
    }
  }
  return{name:t,qty:''};
}
function parseJowPage(html,url){
  const doc=new DOMParser().parseFromString(html,'text/html');
  const meta=n=>{const e=doc.querySelector('meta[property="'+n+'"]');return e?e.content:'';};
  let name=meta('og:title')||doc.title||'';
  name=name.replace(/^\s*(recipe|recette)\s*:\s*/i,'').replace(/\s*[|—-]\s*Jow\s*$/i,'').trim();

  const seen=new Set(),ingredients=[];
  doc.querySelectorAll('a[href*="/ingredients/"]').forEach(a=>{
    const part=splitJowAnchor(a.textContent||'');
    if(!part||!part.name)return;
    const k=stripAccents(part.name.toLowerCase());
    if(seen.has(k))return;seen.add(k);
    const parsed=parseIngredient(part.qty?(part.qty+' '+part.name):part.name);
    if(parsed)ingredients.push({qty:parsed.qty,unit:parsed.unit,name:part.name});
  });

  let servings=null;
  try{const c=new URL(url).searchParams.get('coversCount');if(c)servings=parseInt(c)||null;}catch(e){}
  if(!servings){
    const m=(doc.body?doc.body.textContent:'').match(/pour\s+(\d+)\s+personne/i);
    if(m)servings=parseInt(m[1]);
  }

  // Étapes : blocs "Step N" / "Étape N"
  const steps=[];
  doc.querySelectorAll('p,li,div').forEach(el=>{
    const t=(el.textContent||'').replace(/\s+/g,' ').trim();
    if(!t||t.length<12||t.length>400)return;
    if(/^(step|étape)\s*\d+\s*[:.]?\s*$/i.test(t))return;
    const m=t.match(/^(?:step|étape)\s*\d+\s*[:.]?\s*(.+)$/i);
    if(m&&m[1].length>10&&steps.length<25&&!steps.includes(m[1]))steps.push(m[1]);
  });

  return sanitizeRecipe({name:name||'Recette Jow',image:meta('og:image')||'',servings:servings||null,
    ingredients,steps,partial:ingredients.length===0});
}

/* Récupération d'une recette Jow depuis un lien de partage.
   Aucun endpoint public "GET par identifiant" n'est documenté : on tente les candidats
   plausibles, puis on retombe sur la recherche par titre (endpoint vérifié). */
async function fetchJowPage(target){
  const r=await fetch(viaProxy(target),{headers:{'Accept':'text/html'}});
  if(!r.ok)throw new Error(await errMsg(r));
  return parseJowPage(await r.text(),target);
}
async function fetchJowById(id,url){
  // 1. La page publique Jow : source la plus fiable.
  const pages=[];
  if(/\/recipes\//i.test(url))pages.push(url);
  if(id&&!/\/recipes\//i.test(url))pages.push('https://jow.com/recipes/'+encodeURIComponent(id));
  for(const pg of pages){
    try{const rec=await fetchJowPage(pg);if(rec.ingredients.length)return rec;}catch(e){}
  }
  // 2. Anciennes API (conservées au cas où, mais le domaine a changé).
  for(const ep of ['https://api.jow.fr/public/recipe/'+encodeURIComponent(id),
                   'https://api.jow.fr/public/recipes/'+encodeURIComponent(id)]){
    try{
      const r=await fetch(viaProxy(ep),{headers:{'Accept':'application/json'}});
      if(!r.ok)continue;
      const rec=normalizeJowRecipe(unwrapJow(await r.json()));
      if(rec.ingredients.length)return rec;
    }catch(e){}
  }
  // Repli : lire le titre de la page partagée, puis chercher ce titre sur Jow.
  let title=null;
  try{
    const r=await fetch(viaProxy(url),{headers:{'Accept':'text/html'}});
    if(r.ok){
      const doc=new DOMParser().parseFromString(await r.text(),'text/html');
      const og=doc.querySelector('meta[property="og:title"]');
      title=(og&&og.content)||doc.title||null;
      if(title)title=title.replace(/\s*[|·—-]\s*Jow.*$/i,'').trim();
    }
  }catch(e){}
  if(title){
    try{
      const hits=await jowSearch(title,20);
      const exact=hits.find(h=>h._id===id||h.id===id);
      const chosen=exact||hits[0];
      if(chosen){
        const rec=normalizeJowRecipe(chosen);
        if(rec.ingredients.length){rec.approx=!exact;return rec;}
      }
    }catch(e){}
  }
  if(!relayBase()){
    const e2=new Error(T('Le service d’import est injoignable : Jow et Marmiton ne sont pas accessibles directement depuis le navigateur.'));
    e2.noRelay=true;throw e2;
  }
  const err=new Error(T('Jow ne renvoie pas cette recette par lien. Ouvre la recette sur jow.com et copie le lien de la page (jow.com/recipes/...).'));
  err.jowFallback=title||'';
  throw err;
}

async function fetchRecipe(url){
  // Sans relais, le navigateur ne peut joindre ni Jow ni Marmiton (CORS) : l'échec serait un
  // « Failed to fetch » opaque. On le dit clairement avant même de tenter la requête.
  if(!relayBase()){
    const e=new Error(T('Le service d’import est indisponible : l’import par lien ne peut pas aboutir. Réessaie plus tard, ou importe la recette par photo.'));
    e.noRelay=true;throw e;
  }
  if(isJowUrl(url))return fetchJowById(extractJowId(url),url);
  const res=await fetch(viaProxy(url),{headers:{'Accept':'text/html'}});
  if(!res.ok)throw new Error(await errMsg(res));
  return extractRecipeFromHTML(await res.text());
}
async function errMsg(res){let m=T('Erreur {code}',{code:res.status});try{const j=await res.json();if(j&&j.error)m=j.error;}catch(e){}return m;}

/*
   Import par photo (OCR)
*/
/* PAN-3 — Le moteur OCR est entièrement servi par l'application : plus aucun tiers.
   Les cinq fichiers vivent dans vendor/tesseract/ (voir le README qui s'y trouve pour
   les versions exactes et la commande de mise à jour) :
     tesseract.min.js                        66 Ko   pilote, thread principal
     worker.min.js                          124 Ko   pilote, dans le Web Worker
     core/tesseract-core-simd-lstm.wasm.js  3,9 Mo   cœur de reconnaissance (SIMD)
     core/tesseract-core-lstm.wasm.js       3,9 Mo   même chose, navigateurs sans SIMD
     lang/fra.traineddata.gz                707 Ko   dictionnaire français

   Il n'y a plus rien à vérifier par empreinte : ces fichiers viennent du même serveur
   que l'application, sous le même contrôle qu'elle. C'est aussi ce qui permettra à une
   politique de contenu de se limiter à script-src 'self'. */
const TESS_BASE=new URL('./vendor/tesseract/',document.baseURI).href;
const TESS_SRC=TESS_BASE+'tesseract.min.js';
let _tessLoading=null;
function loadTesseract(){
  if(window.Tesseract)return Promise.resolve(window.Tesseract);
  if(_tessLoading)return _tessLoading;
  _tessLoading=new Promise((res,rej)=>{
    const s=document.createElement('script');
    s.src=TESS_SRC;
    s.onload=()=>window.Tesseract?res(window.Tesseract):rej(new Error(T('Tesseract non chargé')));
    s.onerror=()=>rej(new Error(T('Moteur OCR introuvable (vendor/tesseract/ manquant sur le serveur ?).')));
    document.head.appendChild(s);
  });
  return _tessLoading;
}
// Prétraitement : redimensionner + niveaux de gris + contraste => OCR nettement meilleur.
function preprocessImage(file){
  return new Promise((res,rej)=>{
    const img=new Image();
    img.onload=()=>{
      const MAXW=1600,MINW=1000;
      let w=img.naturalWidth,h=img.naturalHeight;
      let scale=1;
      if(w>MAXW)scale=MAXW/w; else if(w<MINW)scale=Math.min(2,MINW/w);
      w=Math.round(w*scale);h=Math.round(h*scale);
      const cv=document.createElement('canvas');cv.width=w;cv.height=h;
      const ctx=cv.getContext('2d',{willReadFrequently:true});
      ctx.drawImage(img,0,0,w,h);
      const d=ctx.getImageData(0,0,w,h),p=d.data;
      // gris + contraste doux (évite d'écraser le texte clair sur fond coloré)
      for(let i=0;i<p.length;i+=4){
        let g=0.299*p[i]+0.587*p[i+1]+0.114*p[i+2];
        g=(g-128)*1.35+128;
        g=g<0?0:g>255?255:g;
        p[i]=p[i+1]=p[i+2]=g;
      }
      ctx.putImageData(d,0,0);
      URL.revokeObjectURL(img.src);
      cv.toBlob(b=>b?res(b):rej(new Error(T('Échec du traitement image'))),'image/png');
    };
    img.onerror=()=>rej(new Error(T('Image illisible')));
    img.src=URL.createObjectURL(file);
  });
}
/* Dictionnaire OCR : « fra » est le seul livré dans vendor/. En anglais on utilise
   « eng » s'il a été déposé à côté, sinon on reste sur « fra » — le français lit
   correctement l'alphabet latin, seule la correction orthographique y perd. Déposer
   vendor/tesseract/lang/eng.traineddata.gz suffit à activer l'anglais, sans toucher au code. */
let _ocrLangCache=null;
async function ocrLang(){
  if(LANG!=='en')return'fra';
  if(_ocrLangCache!==null)return _ocrLangCache;
  try{
    const r=await fetch(TESS_BASE+'lang/eng.traineddata.gz',{method:'HEAD'});
    _ocrLangCache=r.ok?'eng':'fra';
  }catch(e){_ocrLangCache='fra';}
  return _ocrLangCache;
}
async function ocrImage(file,onProgress){
  const T=await loadTesseract();
  const blob=await preprocessImage(file);
  const worker=await T.createWorker(await ocrLang(),1,{
    // Chemins ABSOLUS, et non relatifs : corePath et langPath sont résolus À L'INTÉRIEUR
    // du worker, dont l'URL de base est un blob: — une adresse relative n'y voudrait rien
    // dire. Et si l'une des trois options manque, tesseract.js retombe SANS RIEN DIRE sur
    // ses adresses jsdelivr par défaut : c'est précisément ce qu'on veut supprimer.
    workerPath:TESS_BASE+'worker.min.js',
    corePath:TESS_BASE+'core',   // le fichier -simd- ou non y est choisi par tesseract.js
    langPath:TESS_BASE+'lang',   // -> lang/<langue>.traineddata.gz (gzip actif par défaut)
    logger:m=>{ if(m.status==='recognizing text'&&onProgress)onProgress(0.35+0.65*(m.progress||0)); }
  });
  try{
    if(onProgress)onProgress(0.35);
    const {data}=await worker.recognize(blob);
    return data.text||'';
  } finally { await worker.terminate(); }
}

/* Nettoyage du texte OCR */
/* Les deux langues cohabitent dans ces motifs : une capture d'écran anglaise doit être
   lue aussi bien qu'une française, quelle que soit la langue réglée dans l'app. */
const OCR_NOISE=/^(ingr[ée]dients?|pr[ée]paration|pr[ée]parations?|recette|[ée]tapes?|instructions?|ustensiles?|mat[ée]riel|nombre de personnes|personnes?|portions?|difficult[ée]|co[ûu]t|budget|calories|note|avis|commentaires?|partager|imprimer|ajouter|voir la recette|publicit[ée]|abonnez|newsletter|connexion|menu|accueil|rechercher|favoris|panier|directions?|methods?|equipments?|utensils?|servings?|serves|yields?|difficulty|cost|nutrition|ratings?|reviews?|comments?|share|print|add to|view recipe|advertisement|subscribe|sign in|log in|home|search|favou?rites?|basket|cart|shopping list)\b/i;
const OCR_META=/^(pr[ée]p\.?|cuisson|repos|total|temps de|\d+\s*(min|h|hrs?|heures?|minutes?|hours?)\b|pour\s+\d+\s+personnes?|\d+\s*pers|prep\b|cook\s*(time)?\b|rest\b|total\s*time|serves?\s+\d+|makes\s+\d+|ready in)/i;
const HDR_START=/^ingr[ée]dients?\b/i;
const HDR_END=/^(pr[ée]paration|[ée]tapes?|instructions?|r[ée]alisation|ustensiles?|mat[ée]riel|directions?|methods?|steps?|equipments?|utensils?|how to)\b/i;
const PIECE=/^(pi[eè]ces?|pce|pcs|unit[ée]s?|units?)$/i;

function cleanOcrLine(line){
  let s=(line||'')
    .replace(/[|¦]/g,' ')
    .replace(/^[\s•·\-–—*>▪●○◦□■✓\u2022]+/,'')
    .replace(/\s+/g,' ').trim();
  s=s.replace(/(\d)\s*[gq]\b/gi,'$1 g')
     .replace(/(\d)\s*mi\b/gi,'$1 ml')
     .replace(/(\d)\s*ci\b/gi,'$1 cl')
     .replace(/\bO(\d)/g,'0$1')
     .replace(/(\d)[.](\d)/g,'$1,$2');
  return s.trim();
}
function isPlausibleIngredient(s){
  if(!s)return false;const t=s.trim();
  if(t.length<2||t.length>90)return false;
  if(OCR_NOISE.test(t)||OCR_META.test(t))return false;
  if(!/[a-zA-ZÀ-ÿ]/.test(t))return false;
  const letters=(t.match(/[a-zA-ZÀ-ÿ]/g)||[]).length;
  if(letters/t.length<0.4)return false;
  if(/^[\d\s.,:%€/-]+$/.test(t))return false;
  const words=t.split(/\s+/).length;
  if(words>12)return false;
  if(/^(m[ée]langer|verser|ajouter|cuire|faire|pr[ée]chauffer|battre|incorporer|laisser|d[ée]poser|couper|[ée]plucher|servir|enfourner|remuer|saler|poivrer|mix|stir|pour|add|cook|bake|preheat|whisk|beat|fold|let|place|cut|peel|serve|heat|season|drain|combine|remove|transfer|bring|simmer|roast|garnish)\b/i.test(t)&&words>4)return false;
  return true;
}
// Si un en-tête "Ingrédients" existe, ne garder que sa section.
function scopeToIngredients(lines){
  let start=-1;
  for(let i=0;i<lines.length;i++){if(HDR_START.test(lines[i].trim())){start=i+1;break;}}
  if(start<0)return lines;
  let end=lines.length;
  for(let i=start;i<lines.length;i++){if(HDR_END.test(lines[i].trim())){end=i;break;}}
  const sl=lines.slice(start,end);
  return sl.length?sl:lines;
}
// Ligne ne contenant qu'une quantité (mise en page Jow : nom puis quantité dessous).
function pureQuantity(line){
  const s=(line||'').trim();if(!s)return null;
  const m=s.match(/^((?:\d+\s+)?\d+\s*\/\s*\d+|[½⅓⅔¼¾⅕⅛]|\d+[.,]?\d*)\s*(.*)$/);
  if(!m)return null;
  const qty=numTok(m[1]);if(qty===null)return null;
  let rest=(m[2]||'').trim();
  if(!rest)return{qty,unit:null};
  if(PIECE.test(rest))return{qty,unit:null};
  for(const[k,v]of UNIT_MAP){if(rest.toLowerCase()===k)return{qty,unit:v};}
  return null;
}
function parseOcrText(text){
  const raw=(text||'').split(/\r?\n/).map(cleanOcrLine);
  const kept=scopeToIngredients(raw).filter(l=>pureQuantity(l)||isPlausibleIngredient(l));
  const merged=[];
  for(const cur of kept){
    const q=pureQuantity(cur);
    if(q){const prev=merged[merged.length-1];if(prev&&prev.qty==null){prev.qty=q.qty;prev.unit=q.unit;}continue;}
    const p=parseIngredient(cur);
    if(!p||!p.name)continue;
    if(p.unit&&PIECE.test(p.unit))p.unit=null;
    merged.push(p);
  }
  let title=null;
  if(merged.length>1&&merged[0].qty==null&&merged.some(x=>x.qty!=null)){
    const first=merged[0].name;
    if(/\s/.test(first)&&!/^(sel|poivre|huile|beurre|sucre|farine)\b/i.test(first)){title=first;merged.shift();}
  }
  const out=[];const seen=new Set();
  for(const p of merged){
    const k=stripAccents(p.name.toLowerCase())+'|'+(p.unit||'')+'|'+(p.qty??'');
    if(seen.has(k))continue;seen.add(k);out.push(p);
  }
  return{title,ingredients:out};
}

/* 
   Synchronisation entre appareils (optionnelle, désactivée par défaut)
   */
const SYNC_ITER=150000;
/* PAN-2 — Le secret de synchro est tire au sort, pas choisi.
   Toute la securite de la synchro repose sur lui : il derive a la fois la cle AES et
   l'identifiant du salon. Une phrase devinable (« cuisine », un prenom, une date)
   permet a un tiers de recalculer l'identifiant, de reperer le salon sur le Worker,
   puis d'attaquer le contenu chiffre hors ligne a son rythme — les 150 000 tours de
   PBKDF2 ralentissent l'operation, ils ne l'empechent pas.

   Un secret tire au sort sur 125 bits rend ces deux etapes hors d'atteinte, et rend
   du meme coup la question du sel sans objet : un sel fixe n'est genant que s'il
   existe un dictionnaire a precalculer. Contre un secret aleatoire, il n'y en a pas.
   (Un sel derive du secret n'apporterait rien : l'attaquant le recalculerait pour
   chaque candidat, au meme cout.) */
const SYNC_ALPHABET='ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; // ni I, O, 0, 1 : recopiable sans ambiguite
const SYNC_SECRET_LEN=25;   // 25 x 5 bits = 125 bits
const SYNC_MIN_BITS=64;     // plancher en dessous duquel on refuse d'enregistrer
function generateSyncSecret(){
  const buf=new Uint8Array(SYNC_SECRET_LEN);
  crypto.getRandomValues(buf);
  // 256 est un multiple de 32 : le modulo ne favorise aucun caractere.
  let out='';
  for(let i=0;i<SYNC_SECRET_LEN;i++)out+=SYNC_ALPHABET[buf[i]%32];
  return out.replace(/(.{5})(?=.)/g,'$1-');
}
/* Forme canonique d'un code genere : majuscules, tirets ignores, pour que la saisie
   manuelle sur le second appareil aboutisse exactement au meme secret.
   Un secret d'un autre format (ancienne phrase libre) est rendu tel quel, au caractere
   pres : le normaliser changerait sa derivation et rendrait illisible un salon existant. */
function syncSecretCanonical(v){
  const raw=String(v==null?'':v).trim();
  const up=raw.toUpperCase().replace(/-/g,'');
  if(up.length!==SYNC_SECRET_LEN)return raw;
  for(const ch of up)if(!SYNC_ALPHABET.includes(ch))return raw;
  return up;
}
/* Entropie approximative, bornee par le HAUT (taille de l'alphabet employe x longueur).
   Une vraie phrase humaine vaut bien moins que cette borne ; si meme elle est basse,
   le secret est indefendable. Un code genere ressort a 125 bits. */
function syncSecretBits(v){
  const t=syncSecretCanonical(v);
  if(!t)return 0;
  // Un code genere par l'appli : on connait sa valeur exacte (25 x 5 bits), inutile
  // de l'estimer — et l'estimation generique l'aurait surevalue a 129 bits.
  if(t.length===SYNC_SECRET_LEN&&[...t].every(ch=>SYNC_ALPHABET.includes(ch)))
    return SYNC_SECRET_LEN*5;
  let classes=0;
  if(/[a-z]/.test(t))classes+=26;
  if(/[A-Z]/.test(t))classes+=26;
  if(/[0-9]/.test(t))classes+=10;
  if(/[^A-Za-z0-9]/.test(t))classes+=20;
  // « aaaaaaaaaaaa » ne vaut pas sa longueur : on plafonne par la variete reelle.
  const eff=Math.min(t.length,new Set(t).size*2);
  return Math.round(eff*Math.log2(Math.max(classes,2)));
}
const b64=u8=>btoa(String.fromCharCode.apply(null,u8));
const unb64=str=>Uint8Array.from(atob(str),c=>c.charCodeAt(0));

async function deriveSync(secret){
  const enc=new TextEncoder();
  // Canonique : « abcde-fghij... » saisi a la main donne le meme salon que le QR code.
  const base=await crypto.subtle.importKey('raw',enc.encode(syncSecretCanonical(secret)),'PBKDF2',false,['deriveBits','deriveKey']);
  const key=await crypto.subtle.deriveKey(
    {name:'PBKDF2',salt:enc.encode('panier-cle-v1'),iterations:SYNC_ITER,hash:'SHA-256'},
    base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
  const bits=await crypto.subtle.deriveBits(
    {name:'PBKDF2',salt:enc.encode('panier-salon-v1'),iterations:SYNC_ITER,hash:'SHA-256'},base,256);
  const room=[...new Uint8Array(bits)].map(b=>b.toString(16).padStart(2,'0')).join('').slice(0,32);
  return{key,room};
}
async function encJSON(key,obj){
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(JSON.stringify(obj)));
  return b64(iv)+'.'+b64(new Uint8Array(ct));
}
async function decJSON(key,str){
  const [a,b]=String(str).split('.');
  if(!a||!b)throw new Error('format');
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(a)},key,unb64(b));
  return JSON.parse(new TextDecoder().decode(pt));
}

let _sync={key:null,room:null,busy:false,timer:null};
function syncEnabled(){return !!(relayBase()&&settings.syncSecret);}
async function syncPrepare(){
  if(_sync.key&&_sync.secretUsed===settings.syncSecret)return _sync;
  const d=await deriveSync(settings.syncSecret);
  _sync.key=d.key;_sync.room=d.room;_sync.secretUsed=settings.syncSecret;
  return _sync;
}
function syncEndpoint(){
  return relayBase()+'/sync';
}

/* Applique les enregistrements distants : on n'écrase que si l'heure distante est
   strictement plus récente, donc une modification locale postérieure est préservée. */
async function syncApplyRemote(items,key){
  let applied=0;
  for(const it of items){
    if(!it||!it.id||!SYNCED_STORES.includes(it.store))continue;
    const local=await dbGet(it.store,it.id);
    if(local&&(local.updatedAt||0)>=it.updatedAt)continue;
    let rec;
    if(it.deleted){rec={id:it.id,deleted:true,updatedAt:it.updatedAt};}
    else{
      try{rec=await decJSON(key,it.payload);}catch(e){continue;} // code différent : on ignore
      rec.id=it.id;rec.updatedAt=it.updatedAt;delete rec.deleted;
    }
    await dbPut(it.store,rec);
    applied++;
  }
  return applied;
}

/* opts.rethrow : la migration a besoin de SAVOIR si l'envoi a réussi, alors que la
   synchro de fond, elle, doit rester silencieuse en cas de coupure réseau. */
async function syncRun(manual,opts){
  const rethrow=!!(opts&&opts.rethrow);
  if(!syncEnabled()){
    if(manual)toast(T('Synchro non configurée'));
    if(rethrow)throw new Error(T('Synchro non configurée.'));
    return;
  }
  if(_sync.busy){
    if(rethrow)throw new Error(T('Une synchronisation est déjà en cours.'));
    return;
  }
  _sync.busy=true;
  try{
    const {key,room}=await syncPrepare();
    const url=syncEndpoint();

    // 1. Récupérer ce qui a changé sur le serveur depuis notre dernier passage.
    let since=settings.syncCursor||0,applied=0,cursor=since,guard=0;
    while(guard++<20){
      const pull=await fetch(url+'?room='+room+'&since='+cursor,{headers:{'Accept':'application/json'}});
      if(!pull.ok)throw new Error(await errMsg(pull));
      const remote=await pull.json();
      applied+=await syncApplyRemote(remote.items||[],key);
      const next=remote.now||cursor;
      if(!remote.more||next===cursor)  {cursor=next;break;}
      cursor=next;
    }

    // 2. Envoyer nos modifications locales postérieures au dernier envoi
    const lastPush=settings.syncPushedAt||0;
    const out=[];let maxTs=lastPush;
    for(const store of SYNCED_STORES){
      for(const r of await dbGetAll(store)){
        const ts=r.updatedAt||0;
        if(ts<lastPush)continue;
        if(ts>maxTs)maxTs=ts;
        const it={id:r.id,store,updatedAt:ts,deleted:!!r.deleted};
        if(!r.deleted){const c=Object.assign({},r);delete c.updatedAt;it.payload=await encJSON(key,c);}
        out.push(it);
      }
    }
    const pushedAt=maxTs;
    // Le Worker refuse une requête de plus de 500 éléments (413). Tant qu'on n'envoyait
    // que les modifications récentes, le cas ne se présentait pas ; une première synchro
    // — ou le transfert de migration, qui repousse TOUT — le dépasse facilement.
    const PUSH_CHUNK=400;
    for(let i=0;i<out.length;i+=PUSH_CHUNK){
      const res=await fetch(url+'?room='+room,{
        method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({items:out.slice(i,i+PUSH_CHUNK)})});
      if(!res.ok)throw new Error(await errMsg(res));
    }

    settings.syncCursor=cursor;
    settings.syncPushedAt=pushedAt;
    settings.syncLastOk=Date.now();
    settings.id='app';await dbPut('settings',settings);

    if(applied){await loadAll();renderAll();}
    if(manual)toast(applied?TP(applied,'{n} élément reçu','{n} éléments reçus'):(T('Déjà à jour')+(out.length?' — '+TP(out.length,'{n} envoyé','{n} envoyés'):'')));
  }catch(e){
    if(manual&&!rethrow)toast(T('Échec de synchro : {msg}',{msg:e.message}));
    if(rethrow)throw e;
  }finally{_sync.busy=false;}
}

// Déclenchement groupé : évite d'appeler le serveur à chaque case cochée.
function syncSoon(){
  if(!syncEnabled())return;
  clearTimeout(_sync.timer);
  _sync.timer=setTimeout(()=>syncRun(false),4000);
}

function itemRow(it){
  const row=el('div','item'+(it.checked?' done':''));
  const chk=el('button','check');chk.innerHTML='<svg viewBox="0 0 24 24"><path d="M5 12l5 5L19 7"/></svg>';
  chk.onclick=async()=>{
    it.checked=!it.checked;
    if(it.checked)it.checkedAt=Date.now();else delete it.checkedAt;
    row.classList.toggle('done',it.checked);
    await save('shopping',it);
    setTimeout(()=>{renderCourses();updateBadges();renderRepas();},220);
  };
  const body=el('div','body');
  body.appendChild(el('div','name',it.name.charAt(0).toUpperCase()+it.name.slice(1)));
  const src=[...new Set(it.sources.map(s=>s.recipeName).filter(Boolean))];
  if(src.length)body.appendChild(el('div','sub',src.join(' · ')));
  else if(it.manual)body.appendChild(el('div','sub',T('Ajouté à la main')));
  row.appendChild(chk);row.appendChild(body);
  const q=fmtQty(itemEffectiveBase(it),it.cls,it.unit);
  if(q)row.appendChild(el('span','qty',q));
  const del=el('button','del');del.innerHTML='<svg viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg>';
  del.onclick=async()=>{shopping=shopping.filter(x=>x.id!==it.id);await softDelete('shopping',it.id);renderCourses();updateBadges();};
  row.appendChild(del);
  return row;
}
async function quickAdd(){
  const inp=$('#qa-input');const val=inp.value.trim();if(!val)return;
  const ing=parseIngredient(val);const key=aggKey(ing.name,ing.unit);
  let it=findItemByKey(key);const base=ing.qty!=null?toBase(ing.qty,ing.unit):null;
  if(it){it.manual=true;it.manualBase=(it.manualBase||0)+(base||0);}
  else{it={id:uid(),key,name:ing.name,unit:ing.unit||null,cls:unitClass(ing.unit),category:categorize(ing.name),checked:false,manual:true,manualBase:base,sources:[]};shopping.push(it);}
  await save('shopping',it);inp.value='';renderCourses();updateBadges();inp.focus();
}

function mealCard(m,dl){
  const r=recipes.find(x=>x.id===m.recipeId);
  const lvl=dl?urgencyLevel(daysUntil(dl.ts)):null;
  const card=el('div','mcard'+(lvl&&lvl!=='ok'?' '+lvl:''));
  const th=el('div','thumb');
  const bg=cssUrl(r&&r.image);
  if(bg)th.style.backgroundImage=bg;else th.textContent=(m.recipeName||'?').charAt(0).toUpperCase();
  const b=el('div','body');
  b.appendChild(el('div','title',m.recipeName));
  b.appendChild(el('div','sub',T('{n} pers.',{n:m.servings||'?'})+(r?' · '+TP(r.ingredients?r.ingredients.length:0,'{n} ingrédient','{n} ingrédients'):'')));
  if(dl){
    const n=daysUntil(dl.ts);
    const badge=el('div','dl '+lvl);
    badge.textContent=(n<0?'⚠️ ':(n<=1?'⏰ ':'🕒 '))+deadlineLabel(n);
    b.appendChild(badge);
    b.appendChild(el('div','dl-why',T('à cause de : {ing}',{ing:dl.ingredient})));
  }
  let done=null;
  if(mealStatus(m)==='validated'){
    done=el('button','del');done.title=T('Marquer comme fait');
    done.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="17" r="5"/><path d="M9 3c0 1.5 1.5 1.5 1.5 3S9 7.5 9 9"/><path d="M13.5 3c0 1.5 1.5 1.5 1.5 3s-1.5 1.5-1.5 3"/></svg>';
    done.style.cssText='flex:none;color:var(--leaf);width:34px;height:34px;border-radius:9px;display:grid;place-items:center';
    done.onclick=async()=>{
      if(!confirm(T('Retirer ce repas maintenant qu’il est cuisiné ? Le stock déjà prélevé ne sera pas restitué.')))return;
      await finishMeal(m.id);renderRepas();renderCourses();updateBadges();toast(T('Repas terminé'));
    };
  }
  const del=el('button','del');del.innerHTML='<svg viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg>';
  del.style.cssText='flex:none;color:var(--muted);width:34px;height:34px;border-radius:9px;display:grid;place-items:center';
  del.onclick=async()=>{
    const msg=mealStatus(m)==='validated'
      ? T('Retirer ce repas ? Les quantités déjà prélevées sur le stock y retourneront, et sa contribution aux courses sera retirée.')
      : T('Retirer ce repas planifié ?');
    if(!confirm(msg))return;
    await removeMeal(m.id);renderRepas();renderCourses();updateBadges();toast(T('Repas retiré — courses mises à jour'));
  };
  card.appendChild(th);card.appendChild(b);
  if(done)card.appendChild(done);
  card.appendChild(del);
  card.onclick=e=>{if(e.target.closest('.del'))return;if(r)openRecipeDetail(r);};
  return card;
}

function renderRepas(){
  const body=$('#repas-body');body.innerHTML='';
  if(meals.length===0){body.appendChild(emptyState('🍽️',T('Aucun repas planifié'),T('Choisis une recette : elle rejoint cette liste et ses ingrédients partent dans les courses.'),{label:T('Planifier un repas'),fn:openMealPicker}));updateBadges();return;}
  const planned=meals.filter(m=>mealStatus(m)==='planned');
  const done=meals.filter(m=>mealStatus(m)!=='planned');
  const sorted=sortMealsByPriority(done);
  const withDl=[],without=[];
  for(const m of sorted){const d=mealDeadline(m);(d?withDl:without).push({m,d});}

  if(planned.length){
    const res=planNeeds(planned);
    const box=el('div','planbox');
    // Le <b> fait partie du message traduit : sa place change d'une langue à l'autre.
    box.innerHTML='<h4>'+TP(planned.length,'{n} repas à valider','{n} repas à valider')+'</h4><p>'
      +(res.covered.length?TP(res.covered.length,'<b>{n}</b> ingrédient déjà dans ton stock','<b>{n}</b> ingrédients déjà dans ton stock')+' · ':'')
      +T('<b>{n}</b> à acheter',{n:res.toBuy.length})+'</p>';
    const go=el('button','btn btn-accent btn-block');go.style.marginTop='12px';
    go.innerHTML='<svg viewBox="0 0 24 24"><path d="M9 11l3 3 8-8"/><path d="M20 12v6a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h9"/></svg>'+esc(T('Valider la semaine'));
    go.onclick=openValidatePlan;
    box.appendChild(go);
    body.appendChild(box);

    const eb=el('div','section-eyebrow');
    eb.innerHTML='📝 '+esc(T('En attente de validation'))+' <span class="count">· '+planned.length+'</span>';
    body.appendChild(eb);
    const list=el('div','list');
    planned.slice().sort((a,b)=>b.createdAt-a.createdAt).forEach(m=>{
      const card=mealCard(m,null);
      card.classList.add('planned');
      const b=card.querySelector('.body');
      if(b)b.appendChild(el('div','pill',T('planifié')));
      list.appendChild(card);
    });
    body.appendChild(list);
  }
  if(withDl.length){
    const n=daysUntil(withDl[0].d.ts);
    if(n<=1){
      const box=el('div','alertbox'+(n<0?'':' soon'));
      const txt=n<0
        ? T('À cuisiner sans attendre : {recette} ({ing} acheté il y a plus de {j} jours).',{recette:withDl[0].m.recipeName,ing:withDl[0].d.ingredient,j:withDl[0].d.days})
        : (n===0?T('À cuisiner aujourd’hui : {recette} - {ing}.',{recette:withDl[0].m.recipeName,ing:withDl[0].d.ingredient})
                :T('À cuisiner demain : {recette} - {ing}.',{recette:withDl[0].m.recipeName,ing:withDl[0].d.ingredient}));
      box.innerHTML='<span class="ic">'+(n<0?'⚠️':'⏰')+'</span><span>'+esc(txt)+'</span>';
      body.appendChild(box);
    }
  }

  if(withDl.length){
    const eb=el('div','section-eyebrow');
    eb.innerHTML='⏱ '+esc(T('En priorité'))+' <span class="count">· '+withDl.length+'</span>';
    body.appendChild(eb);
    const list=el('div','list');
    withDl.forEach(x=>list.appendChild(mealCard(x.m,x.d)));
    body.appendChild(list);
  }
  if(without.length){
    const eb=el('div','section-eyebrow');
    eb.innerHTML=esc(withDl.length?T('Quand tu veux'):T('À cuisiner'))+' <span class="count">· '+without.length+'</span>';
    body.appendChild(eb);
    const list=el('div','list');
    without.forEach(x=>list.appendChild(mealCard(x.m,null)));
    body.appendChild(list);
  }
  const row=el('div','btn-row');const add=el('button','btn btn-primary btn-block');
  add.innerHTML='<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>'+esc(T('Planifier un repas'));add.onclick=openMealPicker;
  row.appendChild(add);body.appendChild(row);
  const clr=el('button','btn btn-danger btn-block',T('Vider les repas'));clr.style.marginTop='4px';
  clr.onclick=async()=>{if(!confirm(T('Retirer tous les repas ? Les articles issus des recettes seront retirés des courses.')))return;for(const m of meals.slice())await removeMeal(m.id);renderRepas();renderCourses();updateBadges();};
  body.appendChild(clr);updateBadges();
}

/* Remplissage par photo
*/
function stockVocabulary(){
  const v=new Map();
  const add=n=>{const k=normIng(n);if(k.length>=3&&!v.has(k))v.set(k,n);};
  for(const grp of RAYONS)grp[3].forEach(add);
  for(const r of recipes)for(const i of (r.ingredients||[]))add(i.name);
  for(const it of stock)add(it.name);
  for(const e of SHELF_MAP)if(e.m)add(e.m);
  return [...v.entries()].sort((a,b)=>b[0].length-a[0].length);
}
/* Rapprochement mot à mot, et pas par sous-chaine. */
function matchVocab(n,vocab){
  const sing=n.replace(/s\b/g,'').replace(/\s+/g,' ').trim();
  let best=null;
  for(const pair of vocab){
    const k=pair[0];
    const re=new RegExp('(?:^|\\s)'+k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'(?:\\s|$)');
    let pos=-1;
    const m1=n.match(re);if(m1)pos=m1.index;
    if(pos<0){const m2=sing.match(re);if(m2)pos=m2.index;}
    if(pos<0)continue;
    if(!best||pos<best.pos||(pos===best.pos&&k.length>best.k.length))best={k,label:pair[1],pos};
  }
  return best;
}
const RECEIPT_NOISE=/^(total|sous total|subtotal|tva|vat|tax|carte|cb |card|especes|cash|monnaie|change|rendu|merci|thank|ticket|receipt|caisse|siret|magasin|store|client|customer|remise|discount|avantage|fidelite|loyalty|qte|qty|prix|price|eur|gbp|usd|balance|payment|visa|mastercard|amount due)/i;

function extractStockCandidates(text){
  const vocab=stockVocabulary();
  const out=[];const seen=new Set();
  for(const raw of String(text||'').split(/\r?\n/)){
    let line=cleanOcrLine(raw);
    if(!line)continue;
    if(RECEIPT_NOISE.test(normIng(line)))continue;
    line=line.replace(/\b\d+[.,]\d{2}\s*(\u20ac|eur)\b/gi,' ').replace(/\bx\s*\d+\b/gi,' ').replace(/\s+/g,' ').trim();
    const n=normIng(line);
    if(n.length<3)continue;
    const hit=matchVocab(n,vocab);
    if(!hit)continue;
    if(seen.has(hit.k))continue;
    seen.add(hit.k);
    let qty=null,unit=null;
    const m=line.match(/(\d+[.,]?\d*)\s*(kg|g|ml|cl|dl|l)\b/i);
    if(m){qty=parseFloat(m[1].replace(',','.'));unit=m[2].toLowerCase();}
    out.push({name:hit.label,qty,unit,line});
  }
  return out;
}

    const status=el('div','hint');c.appendChild(status);
    const buttons=[cam,pick];
    const handle=async file=>{
      if(!file)return;
      prev.src=URL.createObjectURL(file);prev.style.display='block';
      buttons.forEach(b=>b.style.display='none');prog.style.display='block';
      status.textContent=T('Chargement du moteur OCR...');bar.style.width='8%';
      try{
        const text=await ocrImage(file,pr=>{bar.style.width=Math.round(pr*100)+'%';if(pr>.34)status.textContent=T('Lecture du texte...');});

        if(!cands.length){

/* Bascule de langue : on réécrit le HTML statique, puis on reconstruit tout le reste.
   Rien n'est traduit dans la base : seul l'affichage change. */
async function setLang(l,opts){
  if(!isLang(l))return;
  LANG=l;
  settings.lang=l;settings.id='app';
  if(!(opts&&opts.skipSave))await dbPut('settings',settings).catch(()=>{});
  applyStaticI18n();
  renderAll();
  $('#bar-title').textContent=T(TITLES[_curTab]);
}

/* Premier démarrage : on demande la langue avant tout le reste, en montrant les deux
   possibilités dans leur propre langue — un anglophone doit pouvoir se reconnaître sans
   avoir à lire le français. Fermer la feuille vaut acceptation de la langue proposée. */
function openLanguagePicker(onDone){
  let chosen=false;
  const finish=async l=>{
    if(chosen)return;chosen=true;
    await setLang(l);
    closeSheet();
    if(onDone)setTimeout(onDone,120);
  };
  const prevClose=$('#sheet-close').onclick,prevScrim=$('#scrim').onclick;
  const restore=()=>{$('#sheet-close').onclick=prevClose;$('#scrim').onclick=prevScrim;};
  // Écran volontairement bilingue : à ce stade, aucune langue n'a encore été choisie.
  openSheet('Langue / Language', c => {
    const h=el('div','hint');
    h.textContent='Tu pourras en changer à tout moment dans les Réglages. / You can change this at any time in Settings.';
    h.style.marginBottom='14px';c.appendChild(h);
    LANGS.forEach(l=>{
      const b=el('button','opt');
      b.innerHTML='<span class="ic" style="font-size:22px">'+l.flag+'</span><span class="tx"><b>'+esc(l.label)+'</b><span>'
        +esc(l.id==='fr'?'Recettes, courses et repas en français':'Recipes, shopping and meals in English')+'</span></span>';
      b.onclick=()=>{restore();finish(l.id);};
      c.appendChild(b);
    });
  });
  const dismiss=()=>{restore();finish(LANG);};
  $('#sheet-close').onclick=dismiss;$('#scrim').onclick=dismiss;
}

function openServingsStep(recipe){
  const base=recipe.servings||2;
  const dflt=settings.household||base;
  openSheet(recipe.name,c=>{
    const f=el('div','field');f.innerHTML='<label>'+esc(T('Nombre de personnes'))+'</label>';
    const st=el('div','stepper');
    const minus=el('button',null,'−');const val=el('input');val.type='text';val.inputMode='numeric';val.value=dflt;const plus=el('button',null,'+');
    const clamp=()=>{let n=parseInt(val.value)||1;val.value=Math.max(1,Math.min(50,n));};
    minus.onclick=()=>{val.value=Math.max(1,(parseInt(val.value)||1)-1);};
    plus.onclick=()=>{val.value=Math.min(50,(parseInt(val.value)||1)+1);};
    val.onblur=clamp;
    st.appendChild(minus);st.appendChild(val);st.appendChild(plus);f.appendChild(st);
    if(recipe.servings)f.appendChild(el('div','hint',T('Recette prévue pour {n} pers. Les quantités sont ajustées automatiquement.',{n:recipe.servings})));

    btn.onclick=async()=>{clamp();await addMeal(recipe,parseInt(val.value)||dflt);closeSheet();renderCourses();renderRepas();renderRecettes();updateBadges();toast(T('Ajouté aux repas de la semaine'));};
    c.appendChild(btn);
  });
}
/* ---------- Partage d'une recette en texte ----------
   Pour envoyer une recette à quelqu'un qui n'a pas l'app (SMS, WhatsApp, mail...). Utilise
   le partage natif du téléphone quand il existe, sinon copie dans le presse-papiers. */
function recipeShareText(r){
  const lines=[r.name];
  if(r.servings)lines.push(TP(r.servings,'Pour {n} personne','Pour {n} personnes'));
  lines.push('',T('Ingrédients :'));
  (r.ingredients||[]).forEach(ing=>{
    const q=ing.qty!=null?fmtQty(toBase(ing.qty,ing.unit),unitClass(ing.unit),ing.unit):'';
    lines.push('- '+[q,ing.name].filter(Boolean).join(' '));
  });
  if((r.steps||[]).length){
    lines.push('',T('Préparation :'));
    r.steps.forEach((s,i)=>lines.push((i+1)+'. '+s));
  }
  lines.push('',T('Envoyé depuis Panier'));
  return lines.join('\n');
}
async function shareRecipe(r){
  const text=recipeShareText(r);
  if(navigator.share){
    try{await navigator.share({title:r.name,text});}
    catch(e){/* annulé par l'utilisateur : rien à faire */}
    return;
  }
  try{await navigator.clipboard.writeText(text);toast(T('Recette copiée dans le presse-papiers'));}
  catch(e){toast(T('Partage indisponible sur ce navigateur'));}
}

/* Note personnelle sur une recette : astuces, ajustements, avis... Distincte du contenu de
   la recette elle-même (ingrédients/étapes) — éditable uniquement depuis cette mini-feuille,
   pas dans le formulaire "Modifier", pour ne pas mélanger contenu de la recette et annotation
   perso. Comme pour "favorite", le champ est tout de même préservé par openRecipeForm quand
   on modifie la recette par ailleurs (sans quoi il serait silencieusement effacé). */
function openNoteEditor(r,onSaved){
  openSheet(T('Note personnelle'),c=>{
    const f=el('div','field');
    f.innerHTML='<label>'+esc(T('Astuces, ajustements, avis...'))+'</label>';
    const ta=el('textarea');ta.value=r.notes||'';ta.style.minHeight='140px';
    ta.placeholder=T('ex. Mettre moitié moins de sel. Les enfants ont adoré.');
    f.appendChild(ta);c.appendChild(f);
    const saveBtn=el('button','btn btn-primary btn-block',T('Enregistrer'));
    saveBtn.onclick=async()=>{
      r.notes=ta.value.trim();
      await save('recipes',r);
      const ix=recipes.findIndex(x=>x.id===r.id);if(ix>=0)recipes[ix]=r;
      closeSheet();onSaved();
    };
    c.appendChild(saveBtn);
    if(r.notes){
      const rm=el('button','btn btn-danger btn-block',T('Supprimer la note'));rm.style.marginTop='8px';
      rm.onclick=async()=>{
        r.notes='';await save('recipes',r);
        const ix=recipes.findIndex(x=>x.id===r.id);if(ix>=0)recipes[ix]=r;
        closeSheet();onSaved();
      };
      c.appendChild(rm);
    }
  });
}

/* Catalogue de recettes

   Le Pi héberge une base de recettes moissonnée sur Marmiton, Jow, CuisineAZ et
   750g (tools/scrape-recipes.py), interrogée par un petit service de recherche
   (tools/recipe-server.py). L'application ne télécharge jamais cette base : elle
   envoie une requête, reçoit une vingtaine de lignes, et ne demande la fiche
   complète qu'au moment où l'utilisateur la choisit.

   Ce catalogue reste une source TIERCE du point de vue de PAN-1 : son contenu
   vient de sites externes. Tout ce qui en sort repasse donc par sanitizeRecipe(),
   exactement comme un import par lien. */
const DEFAULT_CATALOG='https://panier.remibocquet.fr/api/recipes';
function catalogBase(){
  return ((settings.catalogUrl||'').trim()||DEFAULT_CATALOG).replace(/\/+$/,'');
}
async function catalogSearch(q,limit){
  const u=catalogBase()+'/search?q='+encodeURIComponent(q)+'&limit='+(limit||20);
  const r=await fetch(u,{headers:{'Accept':'application/json'}});
  if(r.status===429)throw new Error(T('Trop de recherches d’affilée, réessaie dans un instant.'));
  if(!r.ok)throw new Error(T('Catalogue indisponible ({code}).',{code:r.status}));
  const j=await r.json();
  return Array.isArray(j.results)?j.results:[];
}
/* Le jeton vient de la recherche : le catalogue ne délivre une fiche complète
   que sur présentation de celui-ci. C'est ce qui empêche de parcourir la base
   au compteur, de 1 à 180 000, sans jamais passer par une recherche. */
async function catalogRecipe(id,token){
  const r=await fetch(catalogBase()+'/recipe?id='+encodeURIComponent(id)
                      +'&t='+encodeURIComponent(token||''),
                      {headers:{'Accept':'application/json'}});
  if(!r.ok)throw new Error(T('Catalogue indisponible ({code}).',{code:r.status}));
  const j=await r.json();
  if(!j||!j.recipe)throw new Error(T('Recette introuvable dans le catalogue.'));
  return sanitizeRecipe(j.recipe);
}
/* Ajout direct à la bibliothèque, sans passer par le formulaire : la fiche du
   catalogue est déjà complète, et l'intérêt de cet écran est d'en ajouter
   plusieurs d'affilée. Le dédoublonnage se fait par nom, comme pour l'import de
   recettes partagées — un identifiant de catalogue n'aurait aucun sens ici. */
async function addCatalogRecipe(rec){
  const name=(rec.name||'').trim();
  if(!name)return null;
  const key=normIng(name);
  if(recipes.some(r=>normIng(r.name)===key))return null;
  const nr={id:uid(),name,image:rec.image||'',servings:rec.servings||null,
    cook:rec.cook||null,prep:rec.prep||null,
    source:rec.source||'',sourceType:rec.sourceType||'web',
    ingredients:(rec.ingredients||[]).slice(),steps:(rec.steps||[]).slice(),
    createdAt:Date.now(),favorite:false,notes:''};
  recipes.push(nr);await save('recipes',nr);
  return nr;
}
function openCatalogSearch(prefill){
  openSheet(T('Rechercher une recette'),c=>{
    const hint=el('div','hint');
    hint.innerHTML=T('🔎 Cherche par nom dans le catalogue (Marmiton, Jow, CuisineAZ, 750g). Tape sur un résultat pour l’ajouter directement à tes recettes.');
    hint.style.marginBottom='10px';c.appendChild(hint);

    const f=el('div','field');f.innerHTML='<label>'+esc(T('Nom de la recette'))+'</label>';
    const inp=el('input');inp.type='search';inp.placeholder=T('quiche lorraine, poulet curry...');
    inp.autocomplete='off';inp.enterKeyHint='search';
    if(prefill)inp.value=prefill;
    f.appendChild(inp);c.appendChild(f);

    const btn=el('button','btn btn-primary btn-block');
    const lbl='<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>'+esc(T('Rechercher'));

      btn.disabled=true;btn.innerHTML='<span class="spin"></span> '+esc(T('Recherche...'));
      status.textContent='';results.innerHTML='';
      try{
        const hits=await catalogSearch(q,20);
        if(!hits.length)status.textContent=T('Aucun résultat pour « {q} ».',{q});
        else{
          results.appendChild(sectionEyebrow(T('Résultats'),hits.length));
          hits.forEach(h=>results.appendChild(catalogRow(h)));
        }
      }catch(err){
        status.innerHTML='❌ '+esc(err.message)+'<br><br>'
          +T('Le catalogue est hébergé sur le serveur de l’application : il faut être en ligne pour y chercher. L’import par lien, lui, reste disponible.');
      }
      btn.disabled=false;btn.innerHTML=lbl;
    }
    btn.onclick=run;
    inp.addEventListener('keydown',e=>{if(e.key==='Enter')run();});

/* Une ligne de résultat. La feuille reste ouverte après un ajout : on peut en
   piocher plusieurs de suite, et chaque ligne garde la trace de son sort. */
function catalogRow(h){
  const row=el('div','pickrow');
  const th=el('div','thumb');
  const bg=cssUrl(h.image);
  if(bg)th.style.backgroundImage=bg;
  else th.textContent=(h.name||'?').charAt(0).toUpperCase();
  const t=el('div','t');
  t.appendChild(el('div',null,h.name));
  const sub=el('div','sub');sub.style.cssText='font-size:12.5px;color:var(--muted)';
  const bits=[TP(h.ingredients||0,'{n} ingrédient','{n} ingrédients')];
  if(h.servings)bits.push(T('{n} pers.',{n:h.servings}));
  if(h.prep||h.cook)bits.push(T('{n} min',{n:(h.prep||0)+(h.cook||0)}));
  sub.innerHTML='<span class="tagsrc '+esc(h.site||'web')+'">'+esc(sourceLabel(h.site))+'</span> &nbsp;'
    +esc(bits.join(' · '));
  t.appendChild(sub);
  const go=el('div','go');
  go.innerHTML='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>';
  row.appendChild(th);row.appendChild(t);row.appendChild(go);

  let done=false;
  row.onclick=async()=>{
    if(done)return;
    done=true;go.innerHTML='<span class="spin"></span>';
    try{
      const rec=await catalogRecipe(h.id,h.token);
      const added=await addCatalogRecipe(rec);
      if(added){
        go.textContent='✓';go.style.color='var(--leaf)';
        row.style.opacity='.65';
        renderRecettes();
        toast(T('« {n} » ajoutée',{n:added.name}));
      }else{
        go.textContent='=';go.style.color='var(--muted)';
        row.style.opacity='.65';
        toast(T('« {n} » est déjà dans tes recettes',{n:rec.name}));
      }
    }catch(err){
      done=false;
      go.innerHTML='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>';
      toast('❌ '+err.message);
    }
  };
  return row;
}

/* Recherche d'images libres de droits (Wikimedia Commons) */
const COMMONS_IMG_EXT=/\.(jpe?g|png|gif|webp)(?:\?.*)?$/i;
function stripHtml(h){return String(h||'').replace(/<[^>]+>/g,'').trim();}
async function commonsImageSearch(query){
  const qs='?action=query&generator=search&gsrnamespace=6&gsrsearch='+encodeURIComponent(query)
    +'&gsrlimit=30&prop=imageinfo&iiprop=url%7Cextmetadata&iiurlwidth=320&format=json&origin=*';
  const r=await fetch('https://commons.wikimedia.org/w/api.php'+qs,{headers:{'Accept':'application/json'}});
  if(!r.ok)throw new Error(T('Wikimedia Commons indisponible ({code}).',{code:r.status}));
  const d=await r.json();
  const pages=Object.values((d.query&&d.query.pages)||{});
  const out=[];
  for(const p of pages){
    const info=(p.imageinfo||[])[0];
    if(!info||!info.url||!COMMONS_IMG_EXT.test(info.url))continue;
    const meta=info.extmetadata||{};
    const url=safeUrl(info.url);
    if(!url)continue;

    });

}

function openImagePicker(initialQuery,onPick,onClose){
  const prevCloseClick=$('#sheet-close').onclick,prevScrimClick=$('#scrim').onclick;
  const back=()=>{
    $('#sheet-close').onclick=prevCloseClick;$('#scrim').onclick=prevScrimClick;
    (onClose||closeSheet)();
  };
  $('#sheet-close').onclick=back;$('#scrim').onclick=back;
  openSheet(T('Choisir une image'),c=>{
    const se=el('div','fsearch');se.style.marginBottom='10px';
    se.innerHTML='<svg class="mag" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>';
    const inp=el('input');inp.type='search';inp.placeholder=T('ex. poulet basquaise');inp.autocomplete='off';
    inp.value=initialQuery||'';
    se.appendChild(inp);c.appendChild(se);

    const hint=el('div','hint');
    hint.innerHTML=T('Images sous licence libre (Creative Commons / domaine public), via <b>Wikimedia Commons</b>. Certaines demandent de créditer l’auteur affiché sous la vignette si tu republies la recette ailleurs.');
    hint.style.marginBottom='10px';c.appendChild(hint);

    const status=el('div','hint');status.style.margin='0 2px 8px';c.appendChild(status);
    const grid=el('div');grid.style.cssText='display:grid;grid-template-columns:repeat(3,1fr);gap:8px';
    c.appendChild(grid);

    let seq=0;
    async function run(q){
      const my=++seq;
      grid.innerHTML='';
      if(!q.trim()){status.textContent='';return;}
      status.textContent=T('Recherche...');
      try{
        const results=await commonsImageSearch(q.trim());
        if(my!==seq)return;
        status.textContent=results.length?'':T('Aucun résultat. Essaie un autre mot-clé.');
        results.forEach(r=>{
          const cell=el('button');
          cell.style.cssText='padding:0;border:none;border-radius:10px;overflow:hidden;aspect-ratio:1;background:#eee;cursor:pointer;position:relative';
          const img=el('img');img.src=safeUrl(r.thumb);img.loading='lazy';img.alt='';
          img.style.cssText='width:100%;height:100%;object-fit:cover;display:block';
          cell.appendChild(img);
          const credit=[r.creator,r.license].filter(Boolean).join(' · ');
          if(credit){
            const cr=el('div',null,credit);
            cr.style.cssText='position:absolute;left:0;right:0;bottom:0;font-size:9.5px;color:#fff;background:rgba(0,0,0,.55);padding:2px 4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap';
            cell.appendChild(cr);
          }
          cell.onclick=()=>{
            $('#sheet-close').onclick=prevCloseClick;$('#scrim').onclick=prevScrimClick;
            onPick(r.url);
          };
          grid.appendChild(cell);
        });
      }catch(e){
        if(my!==seq)return;
        status.textContent='❌ '+e.message;
      }
    }
    let deb;
    inp.oninput=()=>{clearTimeout(deb);deb=setTimeout(()=>run(inp.value),400);};
    if(inp.value)run(inp.value);
  });
}

/*
   Sauvegarde complète (tous les magasins, réglages compris)

   Sert de repli hors-ligne à la migration, pour qui préfère ne rien faire transiter
   par le relais — et de sauvegarde tout court. À la différence de la synchro, qui ne
   transporte que recipes/meals/shopping/stock, ce fichier emporte AUSSI les réglages :
   taille du foyer, durées de péremption, code de synchro.
*/
const BACKUP_KIND='panier-backup';
async function buildBackup(){
  const data={_kind:BACKUP_KIND,_v:1,_date:new Date().toISOString(),_app:APP_VERSION,
    _from:location.origin,stores:{}};
  for(const st of STORES)data.stores[st]=await dbGetAll(st);
  return data;
}
async function exportBackup(){
  const data=await buildBackup();
  const n=STORES.reduce((t,st)=>t+data.stores[st].length,0);
  const json=JSON.stringify(data);
  const nom='panier-sauvegarde-'+new Date().toISOString().slice(0,10)+'.json';
  try{
    const f=new File([json],nom,{type:'application/json'});
    if(navigator.canShare&&navigator.canShare({files:[f]})){
      await navigator.share({files:[f],title:T('Sauvegarde Panier')});return;
    }
  }catch(e){
    if(e&&e.name==='AbortError')return; // partage annulé : rien à faire
  }
  const a=el('a');a.href=URL.createObjectURL(new Blob([json],{type:'application/json'}));
  a.download=nom;a.click();
  toast(TP(n,'{n} élément sauvegardé','{n} éléments sauvegardés'));
}
/* Restauration : on écrase enregistrement par enregistrement, sans rien effacer
   d'autre. Un identifiant déjà présent est remplacé ; le reste est conservé. */
async function restoreBackup(file){
  let d;
  try{d=JSON.parse(await file.text());}
  catch(e){throw new Error(T('Fichier illisible, ce n’est pas un JSON valide.'));}
  if(!d||d._kind!==BACKUP_KIND||!d.stores)
    throw new Error(T('Ce fichier n’est pas une sauvegarde Panier.'));
  let n=0;
  for(const st of STORES){
    const items=Array.isArray(d.stores[st])?d.stores[st]:[];
    for(const o of items){
      if(!o||typeof o.id!=='string')continue;
      if(st==='settings')o.id='app';   // un seul enregistrement de réglages, toujours
      await dbPut(st,o);n++;
    }
  }
  await loadAll();renderAll();
  _sync.key=null;   // le code de synchro vient peut-être de changer
  return n;
}

/* Partage du code de synchro par QR code
   PAN-3 — qrcode-generator 1.4.4 (MIT, Kazuhiko Arase) est servi depuis le dépôt
   (vendor/qrcode.js) et non plus depuis un CDN : 56 Ko, aucune dépendance, aucune
   raison de faire confiance à un tiers pour l'éternité. Bonus : marche hors-ligne
   dès la première ouverture, et ne s'oppose pas à une CSP en script-src 'self'. */
const QR_SRC='./vendor/qrcode.js';
let _qrLoading=null;
function loadQr(){
  if(window.qrcode)return Promise.resolve(window.qrcode);
  if(_qrLoading)return _qrLoading;
  _qrLoading=new Promise((res,rej)=>{
    const s=document.createElement('script');
    s.src=QR_SRC;
    s.onload=()=>window.qrcode?res(window.qrcode):rej(new Error(T('Générateur de QR non chargé')));
    s.onerror=()=>rej(new Error(T('Générateur de QR introuvable (vendor/qrcode.js manquant ?).')));
    document.head.appendChild(s);
  });
  return _qrLoading;
}
function syncShareUrl(secret){
  const u=new URL(location.href);
  u.search='';u.hash='';
  u.searchParams.set('syncSecret',secret);
  const custom=(settings.syncUrl||'').trim();
  if(custom&&custom!==relayBase())u.searchParams.set('syncUrl',custom);
  return u.toString();
}
/* Dessine un QR dans `box`. Utilisé par l'appairage de synchro et par la migration :
   un seul endroit à corriger si le rendu doit changer. */
function renderQrInto(box,url){
  return loadQr().then(qrcode=>{
    const qr=qrcode(0,'M');qr.addData(url);qr.make();
    const n=qr.getModuleCount(),cell=6,size=n*cell;
    const cv=el('canvas');cv.width=size;cv.height=size;
    const ctx=cv.getContext('2d');
    ctx.fillStyle='#fff';ctx.fillRect(0,0,size,size);
    ctx.fillStyle='#000';
    for(let r=0;r<n;r++)for(let cIdx=0;cIdx<n;cIdx++){
      if(qr.isDark(r,cIdx))ctx.fillRect(cIdx*cell,r*cell,cell,cell);
    }
    cv.style.cssText='display:block;width:220px;height:220px;image-rendering:pixelated';
    box.innerHTML='';box.appendChild(cv);
    return cv;
  });
}
function openSyncQr(secret){
  if(!secret){toast(T('Renseigne ou génère un code d’abord'));return;}
  openSheet(T('Code de synchro QR'),c=>{
    const wrap=el('div');wrap.style.cssText='display:flex;flex-direction:column;align-items:center;gap:14px;padding:6px 0 4px';
    const box=el('div');box.style.cssText='background:#fff;padding:14px;border-radius:16px;box-shadow:var(--shadow);min-height:220px;min-width:220px;display:grid;place-items:center';
    const status=el('div','hint');status.style.textAlign='center';
    wrap.appendChild(box);wrap.appendChild(status);c.appendChild(wrap);

      status.innerHTML=T('Scanne ce code avec l’appareil photo de <b>l’autre téléphone</b> : il proposera d’ouvrir Panier, et la synchro se configure toute seule.');
    }).catch(e=>{
      status.textContent='❌ '+e.message;
    });
  });

/*
   Migration d'hébergement : préparer le transfert des données

   On réutilise la synchro chiffrée de bout en bout plutôt que d'inventer un canal :
   elle est déjà en place et éprouvée. Trois choses à faire, dans cet ordre :
     1. disposer d'un code de synchro solide (on garde celui en place s'il l'est déjà,
        pour ne pas dissocier un second téléphone déjà appairé) ;
     2. remettre le curseur d'envoi à zéro, sinon seules les modifications récentes
        partiraient — or le salon d'arrivée est vide, il faut TOUT renvoyer ;
     3. pousser, et savoir si ça a marché (d'où le rethrow).
*/
async function prepareMigration(){
  let secret=(settings.syncSecret||'').trim();
  const neuf=syncSecretBits(secret)<SYNC_MIN_BITS;
  if(neuf)secret=generateSyncSecret();
  settings.syncSecret=secret;
  settings.syncPushedAt=0;settings.syncCursor=0;
  settings.id='app';_sync.key=null;
  await dbPut('settings',settings);
  await syncRun(false,{rethrow:true});
  return{secret,neuf};
}
/* L'adresse d'arrivée : la nouvelle origine, pas la courante. */
function migrationUrl(secret){
  const u=new URL(NEW_HOME);
  u.searchParams.set('syncSecret',secret);
  return u.toString();
}

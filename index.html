<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<meta name="theme-color" content="#235347" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Panier" />
<title>Panier — repas & courses</title>
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<link rel="icon" href="favicon-64.png" />
<style>
:root{
  --pine:#235347; --pine-d:#1a3f36; --pine-l:#2f6b58;
  --paper:#faf6ee; --card:#ffffff;
  --ink:#221e1a; --muted:#8a8272; --hair:#e8e0d2;
  --saffron:#e0912f; --saffron-d:#c67c1f;
  --leaf:#6b8e4e; --tomato:#c24b3a;
  --shadow:0 1px 2px rgba(34,30,26,.06), 0 6px 18px rgba(34,30,26,.06);
  --shadow-lg:0 8px 40px rgba(34,30,26,.18);
  --r:16px; --r-sm:11px; --nav-h:64px; --bar-h:56px;
  --ff-ui:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --ff-display:Georgia,"Iowan Old Style","Times New Roman",serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--paper)}
body{font-family:var(--ff-ui);color:var(--ink);background:var(--paper);line-height:1.45;overscroll-behavior-y:none;-webkit-font-smoothing:antialiased}
button{font-family:inherit;color:inherit;cursor:pointer;border:none;background:none}
input,textarea,select{font-family:inherit;font-size:16px}
::placeholder{color:var(--muted)}
.appbar{position:sticky;top:0;z-index:40;height:calc(var(--bar-h) + env(safe-area-inset-top));padding-top:env(safe-area-inset-top);background:var(--pine);color:#fff;display:flex;align-items:center;gap:10px;padding-left:18px;padding-right:12px;box-shadow:0 1px 0 rgba(0,0,0,.08)}
.appbar h1{font-family:var(--ff-display);font-weight:700;font-size:21px;letter-spacing:.2px;margin:0;flex:1;display:flex;align-items:center;gap:9px}
.appbar .leafmark{width:11px;height:18px;background:var(--saffron);border-radius:50% 50% 50% 50%/60% 60% 40% 40%;transform:rotate(18deg);display:inline-block}
.iconbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:#fff}
.iconbtn:active{background:rgba(255,255,255,.14)}
.iconbtn svg{width:22px;height:22px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
main{padding:16px 16px calc(var(--nav-h) + env(safe-area-inset-bottom) + 24px);max-width:640px;margin:0 auto}
.tab{display:none;animation:fade .18s ease}
.tab.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.section-eyebrow{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:22px 4px 10px;display:flex;align-items:center;gap:8px}
.section-eyebrow .count{color:var(--pine)}
.section-eyebrow:first-child{margin-top:6px}
.list{display:flex;flex-direction:column;gap:10px}
.item{display:flex;align-items:center;gap:13px;padding:14px 15px;background:var(--card);border-radius:var(--r-sm);box-shadow:var(--shadow);transition:opacity .25s}
.item .check{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--hair);display:grid;place-items:center;transition:.15s}
.item .check svg{width:16px;height:16px;stroke:#fff;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round;opacity:0;transform:scale(.4);transition:.15s}
.item.done{opacity:.5}
.item.done .check{background:var(--leaf);border-color:var(--leaf)}
.item.done .check svg{opacity:1;transform:none}
.item.done .name{text-decoration:line-through;text-decoration-color:var(--muted)}
.item .body{flex:1;min-width:0}
.item .name{font-weight:600;font-size:15.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .sub{font-size:12.5px;color:var(--muted);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .qty{flex:none;font-variant-numeric:tabular-nums;font-weight:700;color:var(--pine);font-size:14.5px;background:#eef3ef;padding:3px 9px;border-radius:8px}
.item .del{flex:none;color:var(--muted);width:30px;height:30px;border-radius:8px;display:grid;place-items:center}
.item .del:active{background:#f2ede2;color:var(--tomato)}
.item .del svg{width:17px;height:17px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round}
.rayon{font-size:20px;line-height:1}
.mcard,.rcard{display:flex;align-items:center;gap:13px;padding:14px 15px;background:var(--card);border-radius:var(--r-sm);box-shadow:var(--shadow)}
.mcard .thumb,.rcard .thumb{flex:none;width:46px;height:46px;border-radius:11px;background:var(--pine);color:#fff;display:grid;place-items:center;font-family:var(--ff-display);font-size:20px;font-weight:700;background-size:cover;background-position:center;overflow:hidden}
.mcard .body,.rcard .body{flex:1;min-width:0}
.mcard .title,.rcard .title{font-family:var(--ff-display);font-weight:700;font-size:16.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mcard .sub,.rcard .sub{font-size:12.5px;color:var(--muted);margin-top:2px}
.tagsrc{font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:2px 7px;border-radius:6px;background:#f2ede2;color:var(--muted)}
.tagsrc.marmiton{background:#fdeede;color:var(--saffron-d)}
.tagsrc.jow{background:#eaf0f6;color:#3a6ea5}
.tagsrc.photo{background:#e9f1e5;color:var(--leaf)}
.tagsrc.cuisineaz{background:#f1e6f5;color:#7d4a91}
.tagsrc.\37 50g{background:#fbe6ea;color:#b23a5e}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;padding:7px 11px;border-radius:999px;background:#eef3ef;color:var(--pine);font-weight:700;font-size:13px}
.chip svg{width:16px;height:16px;stroke:currentColor;stroke-width:2.2;fill:none;stroke-linecap:round}
.quickadd{display:flex;gap:9px;margin-bottom:6px}
.quickadd input{flex:1;border:1.5px solid var(--hair);background:var(--card);border-radius:12px;padding:13px 14px;outline:none;transition:.15s}
.quickadd input:focus{border-color:var(--pine-l);box-shadow:0 0 0 3px rgba(47,107,88,.12)}
.btn-add{flex:none;background:var(--saffron);color:#fff;border-radius:12px;width:50px;display:grid;place-items:center;box-shadow:0 2px 8px rgba(224,145,47,.35)}
.btn-add:active{background:var(--saffron-d)}
.btn-add svg{width:24px;height:24px;stroke:currentColor;stroke-width:2.4;fill:none;stroke-linecap:round}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 18px;border-radius:13px;font-weight:700;font-size:15px;transition:.12s}
.btn svg{width:19px;height:19px;stroke:currentColor;stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.btn-primary{background:var(--pine);color:#fff;box-shadow:0 2px 10px rgba(35,83,71,.28)}
.btn-primary:active{background:var(--pine-d)}
.btn-accent{background:var(--saffron);color:#fff;box-shadow:0 2px 10px rgba(224,145,47,.3)}
.btn-accent:active{background:var(--saffron-d)}
.btn-ghost{background:var(--card);color:var(--pine);box-shadow:var(--shadow)}
.btn-ghost:active{background:#f4efe5}
.btn-danger{background:none;color:var(--tomato)}
.btn-block{width:100%}
.btn[disabled]{opacity:.6}
.btn-row{display:flex;gap:10px;margin-top:14px}
.empty{text-align:center;padding:46px 24px;color:var(--muted)}
.empty .glyph{font-size:44px;margin-bottom:10px}
.empty h3{font-family:var(--ff-display);color:var(--ink);font-size:19px;margin:0 0 6px}
.empty p{margin:0 auto 18px;max-width:280px;font-size:14px}
nav.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;height:calc(var(--nav-h) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:var(--card);border-top:1px solid var(--hair);display:flex}
nav.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);font-size:11px;font-weight:600;position:relative}
nav.tabbar button svg{width:24px;height:24px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round;transition:.15s}
nav.tabbar button.on{color:var(--pine)}
nav.tabbar button.on svg{stroke-width:2.3}
nav.tabbar .badge{position:absolute;top:8px;left:calc(50% + 8px);min-width:17px;height:17px;padding:0 4px;background:var(--saffron);color:#fff;border-radius:9px;font-size:10px;font-weight:800;display:grid;place-items:center}
.scrim{position:fixed;inset:0;background:rgba(34,30,26,.42);z-index:50;opacity:0;pointer-events:none;transition:.2s}
.scrim.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;background:var(--paper);border-radius:22px 22px 0 0;max-width:640px;margin:0 auto;max-height:92vh;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .26s cubic-bezier(.2,.8,.2,1);box-shadow:var(--shadow-lg);padding-bottom:env(safe-area-inset-bottom)}
.sheet.show{transform:none}
.sheet .grab{width:38px;height:4px;border-radius:2px;background:var(--hair);margin:10px auto 4px}
.sheet header{display:flex;align-items:center;padding:6px 16px 12px;gap:10px}
.sheet header h2{font-family:var(--ff-display);font-size:20px;margin:0;flex:1}
.sheet .close{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:var(--muted)}
.sheet .close:active{background:#eee6d8}
.sheet .close svg{width:20px;height:20px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round}
.sheet .content{overflow-y:auto;padding:2px 16px 18px;-webkit-overflow-scrolling:touch}
.field{margin-bottom:14px}
.field label{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:6px}
.field input,.field textarea{width:100%;border:1.5px solid var(--hair);background:var(--card);border-radius:12px;padding:12px 13px;outline:none;transition:.15s}
.field input:focus,.field textarea:focus{border-color:var(--pine-l);box-shadow:0 0 0 3px rgba(47,107,88,.12)}
.field textarea{min-height:96px;resize:vertical;line-height:1.5}
.hint{font-size:12px;color:var(--muted);margin-top:6px}
.hint a{color:var(--pine)}
.ing-line{display:flex;gap:8px;margin-bottom:8px;align-items:center}
.ing-line input.q{width:64px;text-align:center}
.ing-line input.u{width:92px}
.ing-line input.n{flex:1}
.ing-line .rm{flex:none;width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--muted)}
.ing-line .rm:active{background:#eee6d8;color:var(--tomato)}
.ing-line .rm svg{width:18px;height:18px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round}
.pickrow{display:flex;align-items:center;gap:12px;padding:12px 6px;border-bottom:1px solid var(--hair)}
.pickrow:last-child{border-bottom:none}
.pickrow .thumb{flex:none;width:40px;height:40px;border-radius:10px;background:var(--pine);color:#fff;display:grid;place-items:center;font-family:var(--ff-display);font-weight:700;background-size:cover;background-position:center}
.pickrow .t{flex:1;font-weight:600}
.pickrow .go{color:var(--pine)}
.steps{counter-reset:s;margin:0;padding:0;list-style:none}
.steps li{position:relative;padding:0 0 14px 34px;counter-increment:s;font-size:14.5px;color:#40382e}
.steps li::before{content:counter(s);position:absolute;left:0;top:-1px;width:24px;height:24px;border-radius:50%;background:var(--pine);color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center}
.det-ings{list-style:none;margin:0 0 4px;padding:0}
.det-ings li{display:flex;justify-content:space-between;gap:12px;padding:9px 2px;border-bottom:1px dashed var(--hair);font-size:14.5px}
.det-ings li .q{color:var(--pine);font-weight:700;font-variant-numeric:tabular-nums;flex:none}
.stepper{display:inline-flex;align-items:center;border:1.5px solid var(--hair);border-radius:12px;overflow:hidden;background:var(--card)}
.stepper button{width:42px;height:42px;font-size:22px;color:var(--pine);display:grid;place-items:center}
.stepper button:active{background:#eef3ef}
.stepper input{width:54px;text-align:center;border:none;outline:none;font-weight:700;background:none}
.toast{position:fixed;left:50%;transform:translateX(-50%) translateY(20px);bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 16px);z-index:70;background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;font-weight:600;font-size:14px;box-shadow:var(--shadow-lg);opacity:0;pointer-events:none;transition:.25s;max-width:88%;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.spin{width:18px;height:18px;border:2.5px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;display:inline-block;vertical-align:-3px}
@keyframes sp{to{transform:rotate(360deg)}}
.prog{height:6px;background:var(--hair);border-radius:3px;overflow:hidden;margin-top:12px}
.prog i{display:block;height:100%;width:0%;background:var(--saffron);transition:width .3s}
.preview{width:100%;max-height:190px;object-fit:contain;border-radius:12px;background:#000;margin-bottom:12px;display:none}
.opt{display:flex;align-items:center;gap:13px;padding:15px;background:var(--card);border-radius:var(--r-sm);box-shadow:var(--shadow);margin-bottom:10px;width:100%;text-align:left}
.opt .ic{flex:none;width:42px;height:42px;border-radius:11px;background:#eef3ef;color:var(--pine);display:grid;place-items:center}
.opt .ic svg{width:21px;height:21px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.opt .tx{flex:1}
.opt .tx b{display:block;font-size:15px}
.opt .tx span{font-size:12.5px;color:var(--muted)}
/* --- stock --- */
.stq{flex:none;font-variant-numeric:tabular-nums;font-weight:700;color:var(--pine);font-size:14px;background:#eef3ef;padding:3px 9px;border-radius:8px}
.stq.unk{background:#f2ede2;color:var(--muted);font-weight:600}
.planbox{background:var(--card);border-radius:var(--r-sm);box-shadow:var(--shadow);padding:14px;margin-bottom:14px}
.planbox h4{margin:0 0 4px;font-family:var(--ff-display);font-size:16px}
.planbox p{margin:0;font-size:13px;color:var(--muted);line-height:1.45}
.planline{display:flex;justify-content:space-between;gap:12px;padding:8px 2px;border-bottom:1px dashed var(--hair);font-size:14px}
.planline:last-child{border-bottom:none}
.planline .q{flex:none;font-variant-numeric:tabular-nums;font-weight:700;color:var(--pine)}
.planline.cov{color:var(--muted)}
.planline.cov .q{color:var(--leaf)}
.mcard.planned{opacity:.94;border-left:4px solid var(--hair)}
.pill{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:6px;background:#f2ede2;color:var(--muted);margin-top:5px}
/* --- échéances de péremption --- */
.mcard{position:relative}
.mcard.late{border-left:4px solid var(--tomato)}
.mcard.soon{border-left:4px solid var(--saffron)}
.mcard.warn{border-left:4px solid #d9b64a}
.dl{display:inline-flex;align-items:center;gap:5px;margin-top:5px;padding:3px 9px;border-radius:8px;font-size:11.5px;font-weight:700;line-height:1.35}
.dl.late{background:#fbe6e2;color:#a33827}
.dl.soon{background:#fdeede;color:var(--saffron-d)}
.dl.warn{background:#fbf3dc;color:#8a6d1f}
.dl.ok{background:#eef3ef;color:var(--pine)}
.dl-why{font-size:11px;color:var(--muted);margin-top:3px}
.alertbox{display:flex;gap:11px;align-items:flex-start;padding:13px 14px;border-radius:var(--r-sm);background:#fbe6e2;color:#8f3226;margin-bottom:14px;font-size:13.5px;line-height:1.4}
.alertbox.soon{background:#fdeede;color:#8a5714}
.alertbox .ic{flex:none;font-size:19px;line-height:1.1}
/* --- barre de filtres --- */
.fbar{margin-top:14px;margin-bottom:6px}
.fsearch{position:relative;margin-bottom:9px}
.fsearch input{width:100%;border:1.5px solid var(--hair);background:var(--card);border-radius:12px;padding:12px 40px 12px 38px;outline:none;transition:.15s}
.fsearch input:focus{border-color:var(--pine-l);box-shadow:0 0 0 3px rgba(47,107,88,.12)}
.fsearch .mag{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:17px;height:17px;stroke:var(--muted);fill:none;stroke-width:2;stroke-linecap:round;pointer-events:none}
.fsearch .clr{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:30px;height:30px;border-radius:8px;display:none;place-items:center;color:var(--muted)}
.fsearch .clr svg{width:16px;height:16px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round}
.fsearch.filled .clr{display:grid}
.fchips{display:flex;gap:7px;overflow-x:auto;padding:2px 2px 4px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.fchips::-webkit-scrollbar{display:none}
.fchip{flex:none;display:inline-flex;align-items:center;gap:5px;padding:7px 12px;border-radius:999px;background:var(--card);color:var(--ink);font-size:13px;font-weight:600;box-shadow:var(--shadow);border:1.5px solid transparent;white-space:nowrap;transition:.12s}
.fchip:active{transform:scale(.96)}
.fchip.on{background:var(--pine);color:#fff;border-color:var(--pine)}
.fchip.more{color:var(--pine)}
.fadv{background:var(--card);border-radius:var(--r-sm);box-shadow:var(--shadow);padding:12px 13px;margin-top:9px;display:none}
.fadv.show{display:block}
.fadv .field{margin-bottom:10px}
.fadv .field:last-child{margin-bottom:0}
.fcount{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);margin:12px 4px 2px}
.fcount button{color:var(--tomato);font-weight:700;font-size:12.5px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div class="appbar">
  <h1><span class="leafmark"></span><span id="bar-title">Courses</span></h1>
  <button class="iconbtn" id="btn-settings" aria-label="Réglages">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
  </button>
</div>

<main>
  <section class="tab active" id="tab-courses">
    <div class="quickadd">
      <input id="qa-input" type="text" enterkeyhint="done" placeholder="Ajouter un article…" autocomplete="off" />
      <button class="btn-add" id="qa-btn" aria-label="Ajouter"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
    </div>
    <div id="courses-body"></div>
  </section>

  <section class="tab" id="tab-repas"><div id="repas-body"></div></section>

  <section class="tab" id="tab-stock">
    <div class="quickadd">
      <input id="st-input" type="text" enterkeyhint="done" placeholder="ex. 500 g de semoule…" autocomplete="off" />
      <button class="btn-add" id="st-btn" aria-label="Ajouter"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
    </div>
    <div id="stock-body"></div>
  </section>

  <section class="tab" id="tab-recettes">
    <div class="btn-row" style="margin-top:2px">
      <button class="btn btn-primary btn-block" id="btn-import"><svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg>Importer</button>
      <button class="btn btn-ghost btn-block" id="btn-new"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Nouvelle</button>
    </div>
    <div id="recettes-body"></div>
  </section>

<script>
"use strict";
/* ======================================================================
   Panier — repas & courses.  Données 100% locales (IndexedDB).
   Import : lien (Marmiton JSON-LD / API Jow) ou photo (OCR Tesseract).
   ====================================================================== */

/* ---------- IndexedDB ---------- */
const DB_NAME='panierDB',DB_VER=2,STORES=['recipes','meals','shopping','settings','stock'];let _db=null;
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open(DB_NAME,DB_VER);r.onupgradeneeded=e=>{const db=e.target.result;for(const s of STORES){if(!db.objectStoreNames.contains(s))db.createObjectStore(s,{keyPath:'id'});}};r.onsuccess=e=>{_db=e.target.result;res(_db);};r.onerror=()=>rej(r.error);});}
function tx(s,m='readonly'){return _db.transaction(s,m).objectStore(s);}
function dbGetAll(s){return new Promise((res,rej)=>{const r=tx(s).getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error);});}
function dbGet(s,id){return new Promise((res,rej)=>{const r=tx(s).get(id);r.onsuccess=()=>res(r.result||null);r.onerror=()=>rej(r.error);});}
function dbPut(s,o){return new Promise((res,rej)=>{const r=tx(s,'readwrite').put(o);r.onsuccess=()=>res(o);r.onerror=()=>rej(r.error);});}
function dbDel(s,id){return new Promise((res,rej)=>{const r=tx(s,'readwrite').delete(id);r.onsuccess=()=>res();r.onerror=()=>rej(r.error);});}
function dbClear(s){return new Promise((res,rej)=>{const r=tx(s,'readwrite').clear();r.onsuccess=()=>res();r.onerror=()=>rej(r.error);});}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);

/* --- Horodatage et suppressions douces (indispensables à la synchro) ---
   Chaque enregistrement porte un updatedAt. Une suppression laisse une "pierre tombale"
   {id, deleted:true, updatedAt} : sans elle, l'autre téléphone re-pousserait l'objet effacé. */
const SYNCED_STORES=['recipes','meals','shopping','stock'];
async function save(store,obj){obj.updatedAt=Date.now();await dbPut(store,obj);syncSoon();return obj;}
async function softDelete(store,id){
  const t={id,deleted:true,updatedAt:Date.now()};
  await dbPut(store,t);
  syncSoon();
  return t;
}
async function tombstoneAll(store){
  const all=await dbGetAll(store);
  for(const r of all){ if(!r.deleted) await dbPut(store,{id:r.id,deleted:true,updatedAt:Date.now()}); }
}
// Purge des pierres tombales anciennes (au-delà de 90 j, tous les appareils ont convergé).
async function purgeTombstones(){
  const cutoff=Date.now()-90*24*3600*1000;
  for(const st of SYNCED_STORES){
    for(const r of await dbGetAll(st)){
      if(r.deleted&&(r.updatedAt||0)<cutoff)await dbDel(st,r.id);
    }
  }
}

/* ---------- Unités & parsing ---------- */
const UNITS=[['kg','kg'],['kilogramme','kg'],['kilogrammes','kg'],['kilo','kg'],['kilos','kg'],['g','g'],['gr','g'],['gramme','g'],['grammes','g'],['mg','mg'],['l','l'],['litre','l'],['litres','l'],['dl','dl'],['cl','cl'],['ml','ml'],['millilitre','ml'],['millilitres','ml'],['càs','c. à soupe'],['cas','c. à soupe'],['cuillère à soupe','c. à soupe'],['cuillères à soupe','c. à soupe'],['cuillere à soupe','c. à soupe'],['cuilleres à soupe','c. à soupe'],['c. à soupe','c. à soupe'],['c à soupe','c. à soupe'],['cs','c. à soupe'],['càc','c. à café'],['cac','c. à café'],['cuillère à café','c. à café'],['cuillères à café','c. à café'],['cuillere à café','c. à café'],['cuilleres à café','c. à café'],['c. à café','c. à café'],['c à café','c. à café'],['cc','c. à café'],['pincée','pincée'],['pincées','pincée'],['gousse','gousse'],['gousses','gousse'],['tranche','tranche'],['tranches','tranche'],['sachet','sachet'],['sachets','sachet'],['boîte','boîte'],['boîtes','boîte'],['boite','boîte'],['boites','boîte'],['botte','botte'],['bottes','botte'],['brin','brin'],['brins','brin'],['feuille','feuille'],['feuilles','feuille'],['verre','verre'],['verres','verre'],['tasse','tasse'],['tasses','tasse'],['pot','pot'],['pots','pot'],['bouquet','bouquet'],['bouquets','bouquet'],['morceau','morceau'],['morceaux','morceau'],['boule','boule'],['boules','boule'],['cup','tasse'],['cups','tasse'],['tbsp','c. à soupe'],['tablespoon','c. à soupe'],['tablespoons','c. à soupe'],['tsp','c. à café'],['teaspoon','c. à café'],['teaspoons','c. à café'],['slice','tranche'],['slices','tranche'],['clove','gousse'],['cloves','gousse'],['pinch','pincée'],['oz','oz'],['lb','lb']];
const UNIT_MAP=UNITS.slice().sort((a,b)=>b[0].length-a[0].length);
const WORD_NUM={un:1,une:1,deux:2,trois:3,quatre:4,cinq:5,six:6,sept:7,huit:8,neuf:9,dix:10,demi:0.5,demie:0.5};
const FRAC={'½':0.5,'⅓':1/3,'⅔':2/3,'¼':0.25,'¾':0.75,'⅕':0.2,'⅛':0.125};
const stripAccents=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'');
function numTok(tok){tok=tok.trim();if(FRAC[tok]!==undefined)return FRAC[tok];const mm=tok.match(/^(\d+)\s+(\d+)\s*\/\s*(\d+)$/);if(mm)return +mm[1]+(+mm[2]/+mm[3]);if(/^\d+\s*\/\s*\d+$/.test(tok)){const[a,b]=tok.split('/');return parseInt(a)/parseInt(b);}const t=tok.replace(',','.');if(/^\d*\.?\d+$/.test(t))return parseFloat(t);const w=WORD_NUM[stripAccents(tok.toLowerCase())];return w!==undefined?w:null;}
function parseIngredient(raw){
  let s=(raw||'').trim().replace(/\s+/g,' ');if(!s)return null;
  const original=s;let qty=null,unit=null;
  let m=s.match(/^((?:\d+\s+)?\d+\s*\/\s*\d+|[½⅓⅔¼¾⅕⅛]|\d+[.,]?\d*|un(?:e)?|deux|trois|quatre|cinq|six|sept|huit|neuf|dix|demie?)\s*/i);
  if(m){const q=numTok(m[1]);if(q!==null){qty=q;s=s.slice(m[0].length).trim();}}
  if(qty!==null){const m2=s.match(/^[½⅓⅔¼¾⅕⅛]\s*/);if(m2){qty+=FRAC[m2[0].trim()];s=s.slice(m2[0].length).trim();}}
  const low=s.toLowerCase();
  for(const[k,v]of UNIT_MAP){const re=new RegExp('^'+k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'(?=\\s|$|\\.)','i');if(re.test(low)){unit=v;s=s.slice(k.length).replace(/^\.\s*/,'').trim();break;}}
  s=s.replace(/^(de\s+la\s+|de\s+l['’]\s*|d['’]\s*|de\s+|du\s+|des\s+)/i,'').trim();
  let name=s.replace(/\s+/g,' ').replace(/^[-–,\s]+|[-–,\s]+$/g,'');
  if(!name)name=original;
  return{qty,unit,name,raw:original};
}
const MASS={g:1,kg:1000,mg:0.001},VOL={ml:1,cl:10,dl:100,l:1000};
function unitClass(u){if(!u)return'none';if(MASS[u])return'mass';if(VOL[u])return'vol';return'disc';}
function toBase(qty,u){const c=unitClass(u);if(qty==null)return null;if(c==='mass')return qty*MASS[u];if(c==='vol')return qty*VOL[u];return qty;}
function aggKey(name,u){const n=stripAccents((name||'').toLowerCase()).replace(/[^a-z0-9 ]/g,'').replace(/s\b/g,'').trim();const c=unitClass(u);return n+'#'+(c==='disc'?('d:'+u):c);}
function fmtQty(baseQty,cls,unit){if(baseQty==null)return'';const r=v=>{const x=Math.round(v*100)/100;return (Number.isInteger(x)?x:x.toFixed(2).replace(/0+$/,'').replace(/\.$/,'')).toString().replace('.',',');};if(cls==='mass')return baseQty>=1000?r(baseQty/1000)+' kg':r(baseQty)+' g';if(cls==='vol')return baseQty>=1000?r(baseQty/1000)+' l':r(baseQty)+' ml';return r(baseQty)+(unit?(' '+unit):'');}

/* ---------- Rayons ---------- */
const RAYONS=[['fruits','🥕','Fruits & légumes',['tomate','oignon','ail','echalote','carotte','courgette','poivron','aubergine','salade','laitue','epinard','pomme de terre','patate','pomme','poire','banane','citron','orange','fraise','champignon','brocoli','chou','haricot','petit pois','mais','concombre','radis','betterave','poireau','celeri','navet','potiron','courge','avocat','ananas','mangue','raisin','peche','abricot','cerise','framboise','myrtille','persil','basilic','coriandre','menthe','ciboulette','thym','romarin','laurier','gingembre','herbe','fenouil','endive','artichaut','asperge','clementine','pamplemousse','melon','pasteque']],['viande','🥩','Viandes & poissons',['poulet','boeuf','bœuf','porc','veau','agneau','dinde','canard','jambon','lardon','bacon','saucisse','merguez','steak','escalope','cuisse','filet','saumon','thon','cabillaud','colin','truite','crevette','moule','poisson','viande','chorizo','magret','gigot','boudin','andouille','haché','sardine','maquereau','dorade','calamar','noix de saint','rôti']],['cremerie','🧀','Crémerie & œufs',['lait','beurre','creme','fromage','yaourt','oeuf','œuf','parmesan','mozzarella','gruyere','emmental','comte','chevre','feta','ricotta','mascarpone','cheddar','camembert','brie','fromage blanc','margarine','faisselle']],['boulangerie','🥖','Boulangerie',['pain','baguette','brioche','pain de mie','tortilla','wrap','pate feuilletee','pate brisee','pate sablee','pate a pizza','biscotte','croissant']],['epicerie','🥫','Épicerie salée',['farine','riz','pate','pates','semoule','quinoa','lentille','pois chiche','huile','vinaigre','sel','poivre','moutarde','ketchup','mayonnaise','sauce soja','bouillon','concentre','concasse','tomates pelees','conserve','epice','curry','curcuma','paprika','cumin','muscade','olive','cornichon','chapelure','levure chimique','maizena','fecule','coulis','coco','boulgour','couscous','gnocchi']],['sucree','🍫','Épicerie sucrée',['sucre','chocolat','miel','confiture','cacao','vanille','levure','pepite','biscuit','cereale','compote','sirop','pralin','amande','noisette','noix','sucre glace','speculoos','pate a tartiner','gateau']],['boissons','🧃','Boissons',['eau','vin','biere','bière','jus','soda','cidre','lait de coco','cafe','café','the','thé','limonade','champagne']],['surgeles','❄️','Surgelés',['surgele','surgelé','glace','congele','congelé','glacon']],['entretien','🧽','Entretien & maison',['liquide vaisselle','lessive','eponge','éponge','sopalin','papier toilette','sac poubelle','essuie-tout','film alimentaire','aluminium','cure-dent']]];
function categorize(name){const n=stripAccents((name||'').toLowerCase());for(const[id,ic,label,keys]of RAYONS){for(const k of keys){if(n.includes(stripAccents(k)))return id;}}return'autres';}
function rayonMeta(id){const r=RAYONS.find(x=>x[0]===id);return r?{id,icon:r[1],label:r[2]}:{id:'autres',icon:'🧺',label:'Autres'};}
const rayonOrder=id=>{const i=RAYONS.findIndex(x=>x[0]===id);return i<0?RAYONS.length:i;};

/* ======================================================================
   Stock (placard, frigo, congélateur)
   ----------------------------------------------------------------------
   Un article de stock : {id, name, key, unit, cls, base, category}
     base = quantité en unité canonique (g / ml / compte), ou null.
     base === null signifie « présent, quantité inconnue » : on considère alors que le
     besoin est couvert. C'est le cas courant du placard (« j'ai de la semoule ») et le
     seul résultat honnête d'une reconnaissance photo, qui ne sait pas peser.

   Les repas sont d'abord PLANIFIÉS, puis VALIDÉS. La validation déduit le stock et ne met
   dans la liste de courses que le manque réel.
   ====================================================================== */

// Clé de rapprochement : le NOM seul, sans la classe d'unité. Le stock « farine, 500 g »
// doit pouvoir couvrir un besoin exprimé en tasses.
function stockKey(name){
  return stripAccents((name||'').toLowerCase()).replace(/[^a-z0-9 ]/g,'').replace(/s\b/g,'').trim();
}
function findStock(name){const k=stockKey(name);return stock.find(x=>x.key===k)||null;}

async function stockSet(name,qty,unit){
  const k=stockKey(name);
  if(!k)return null;
  const cls=unitClass(unit);
  const base=qty!=null?toBase(qty,unit):null;
  let it=stock.find(x=>x.key===k);
  if(it){
    // Quantité inconnue + quantité inconnue = toujours inconnue.
    if(base==null||it.base==null){it.base=null;it.unit=unit||it.unit;it.cls=unitClass(unit||it.unit);}
    else if(it.cls===cls){it.base+=base;}
    else {it.base=base;it.unit=unit;it.cls=cls;}   // unités incompatibles : la dernière fait foi
  }else{
    it={id:uid(),key:k,name,unit:unit||null,cls,base,category:categorize(name)};
    stock.push(it);
  }
  await save('stock',it);
  return it;
}
async function stockRemove(id){
  stock=stock.filter(x=>x.id!==id);
  await softDelete('stock',id);
}
/* Retire une quantité du stock. Renvoie ce qui a effectivement été consommé,
   afin de pouvoir le restituer si le repas est annulé. */
async function stockConsume(name,base,cls){
  const it=findStock(name);
  if(!it)return null;
  if(it.base==null)return{key:it.key,base:null};          // quantité inconnue : rien à décompter
  if(base==null||it.cls!==cls)return{key:it.key,base:null};
  const used=Math.min(it.base,base);
  it.base-=used;
  if(it.base<=0.0001){await stockRemove(it.id);}
  else{await save('stock',it);}
  return{key:it.key,base:used,cls:it.cls,unit:it.unit,name:it.name};
}
async function stockRestore(entries){
  for(const e of (entries||[])){
    if(!e||e.base==null)continue;
    const ex=stock.find(x=>x.key===e.key);
    if(ex){ if(ex.base!=null)ex.base+=e.base; await save('stock',ex); }
    else{
      const it={id:uid(),key:e.key,name:e.name||e.key,unit:e.unit||null,cls:e.cls||'none',base:e.base,category:categorize(e.name||e.key)};
      stock.push(it);await save('stock',it);
    }
  }
}

/* ---------- Statut des repas ----------
   Les repas créés avant cette version n'ont pas de statut : ils ont déjà alimenté la liste
   de courses, on les considère donc comme validés. */
const mealStatus=m=>m.status||'validated';
const plannedMeals=()=>meals.filter(m=>mealStatus(m)==='planned');

/* Calcule, pour un ensemble de repas planifiés, ce qui est couvert par le stock
   et ce qu'il reste à acheter. Fonction pure : ne modifie rien. */
function planNeeds(list){
  const needs=new Map();   // clé nom+classe -> agrégat
  for(const m of list){
    const r=recipes.find(x=>x.id===m.recipeId);
    if(!r)continue;
    const scale=m.base?(m.servings/m.base):1;
    for(const ing of (r.ingredients||[])){
      const cls=unitClass(ing.unit);
      const k=stockKey(ing.name)+'#'+cls;
      let n=needs.get(k);
      if(!n){n={name:ing.name,unit:ing.unit||null,cls,base:null,meals:[]};needs.set(k,n);}
      const b=ing.qty!=null?toBase(ing.qty*scale,ing.unit):null;
      if(b!=null)n.base=(n.base||0)+b;
      n.meals.push({mealId:m.id,recipeName:r.name,base:b});
    }
  }
  const covered=[],toBuy=[];
  // Copie de travail du stock : plusieurs besoins peuvent puiser dans le même article.
  const avail=new Map();
  for(const it of stock)avail.set(it.key,{base:it.base,cls:it.cls,name:it.name,unit:it.unit});
  for(const n of needs.values()){
    const sk=stockKey(n.name);
    const a=avail.get(sk);
    if(!a){toBuy.push(Object.assign({},n,{from:null}));continue;}
    if(a.base==null||a.cls!==n.cls||n.base==null){
      // Quantité inconnue, ou unités non comparables : on considère le besoin couvert.
      covered.push(Object.assign({},n,{stockName:a.name,exact:false}));
      continue;
    }
    if(a.base>=n.base){
      a.base-=n.base;
      covered.push(Object.assign({},n,{stockName:a.name,exact:true,used:n.base}));
    }else{
      const missing=n.base-a.base;
      covered.push(Object.assign({},n,{stockName:a.name,exact:true,used:a.base,partial:true}));
      toBuy.push(Object.assign({},n,{base:missing,from:sk}));
      a.base=0;
    }
  }
  return{covered,toBuy};
}

/* Valide les repas planifiés : déduit le stock, alimente la liste de courses. */
async function validatePlan(list){
  const {toBuy}=planNeeds(list);
  // 1. Déduire le stock, en mémorisant ce qui a été pris (pour pouvoir l'annuler).
  for(const m of list){
    const r=recipes.find(x=>x.id===m.recipeId);
    if(!r)continue;
    const scale=m.base?(m.servings/m.base):1;
    const consumed=[];
    for(const ing of (r.ingredients||[])){
      const cls=unitClass(ing.unit);
      const need=ing.qty!=null?toBase(ing.qty*scale,ing.unit):null;
      const c=await stockConsume(ing.name,need,cls);
      if(c&&c.base!=null&&c.base>0)consumed.push(c);
    }
    m.consumed=consumed;
    m.status='validated';
    m.validatedAt=Date.now();
    await save('meals',m);
  }
  // 2. Ne mettre dans les courses que le manque réel.
  let n=0;
  for(const b of toBuy){
    for(const src of b.meals){
      await addIngredientToShopping(
        {name:b.name,unit:b.unit,qty:null},1,src.mealId,src.recipeName);
    }
    // La quantité agrégée est portée par l'article, une seule fois.
    const it=findItemByKey(aggKey(b.name,b.unit));
    if(it){
      it.sources=it.sources.map(sx=>Object.assign({},sx,{base:null}));
      it.manual=true;it.manualBase=b.base;
      await save('shopping',it);
    }
    n++;
  }
  return n;
}

/* ======================================================================
   Péremption et priorité des repas
   ----------------------------------------------------------------------
   Le compte à rebours démarre quand l'article est COCHÉ dans la liste de courses
   (= acheté). L'échéance d'un repas est celle de son ingrédient le plus fragile.

   Les durées visent la date de péremption réelle d'un produit FERMÉ, à partir de son achat —
   pas sa fragilité une fois entamé. C'est cohérent avec le départ du compte à rebours : au
   moment où l'article est coché, il vient d'être acheté, donc encore scellé. Un yaourt, une
   mozzarella ou des raviolis sous emballage tiennent ainsi des semaines, même s'ils deviennent
   fragiles en quelques jours une fois ouverts — à surveiller une fois le produit entamé, ce que
   l'app ne peut pas savoir. Les valeurs restent volontairement PRUDENTES : mieux vaut alerter
   trop tôt que trop tard. Elles ne remplacent ni la date sur l'emballage, ni le bon sens.
   ====================================================================== */
const DAY_MS=86400000;

// [mot-clé, jours] — null = non périssable. Le mot-clé le plus long l'emporte,
// ce qui permet à « lait frais » (7 jours, cas marginal) de primer sur « lait » seul
// (non périssable : par défaut on suppose du lait longue conservation UHT, largement majoritaire).
const SHELF_LIFE=[
  // --- non périssables : priorité aux libellés longs ---
  // « lait » sans précision = UHT par défaut, très largement majoritaire en France, et se garde
  // des mois tant qu'il n'est pas ouvert.
  ['lait',null],
  ['lait de coco',null],['lait concentre',null],['lait en poudre',null],['creme de coco',null],
  ['tomates pelees',null],['tomate concassee',null],['tomates concassees',null],['concentre de tomate',null],
  ['haricot sec',null],['pois casse',null],['sauce soja',null],['sauce tomate',null],
  ['farine',null],['riz',null],['pate',null],['pates',null],['semoule',null],['quinoa',null],['boulgour',null],
  ['lentille',null],['pois chiche',null],['conserve',null],['bocal',null],['huile',null],['vinaigre',null],
  ['sel',null],['poivre',null],['epice',null],['curry',null],['curcuma',null],['paprika',null],['cumin',null],
  ['muscade',null],['cannelle',null],['herbes de provence',null],['laurier',null],['thym seche',null],
  ['sucre',null],['miel',null],['chocolat',null],['cacao',null],['cafe',null],['the',null],['bouillon',null],

const SHELF_MAP=SHELF_LIFE.slice().sort((a,b)=>b[0].length-a[0].length);

/* Durée de conservation d'un ingrédient, en jours. null = non périssable ou inconnu.
   Les valeurs par défaut (SHELF_LIFE) sont modifiables par l'utilisateur, réglage par réglage,
   dans Réglages → Modifier les durées de péremption. La liste des mots-clés (SHELF_MAP, donc
   l'ordre de correspondance) ne change pas : seule la durée associée peut être personnalisée. */
function shelfLifeDays(name){
  const n=normIng(name);
  if(!n)return null;
  // On teste aussi une forme dépluralisée : « pommes de terre » doit correspondre à
  // « pomme de terre » (30 j) et non à « pomme » (14 j), qui en est un sous-ensemble.
  const sing=n.replace(/s\b/g,'').replace(/\s+/g,' ').trim();
  const ov=settings.shelfOverrides||{};
  for(const [k,d] of SHELF_MAP){
    if(n.includes(k)||sing.includes(k))return ov.hasOwnProperty(k)?ov[k]:d;
  }
  return null;
}

/* Jours calendaires entre aujourd'hui et une échéance (0 = aujourd'hui, négatif = dépassé). */
function daysUntil(ts){
  const a=new Date();a.setHours(0,0,0,0);
  const b=new Date(ts);b.setHours(0,0,0,0);
  return Math.round((b-a)/DAY_MS);
}

/* Échéance d'un repas : celle de son ingrédient acheté le plus fragile.
   Un ingrédient pas encore acheté n'impose rien — le compte à rebours n'a pas commencé. */
function mealDeadline(meal){
  let best=null;
  for(const it of shopping){
    if(!it.checked||!it.checkedAt)continue;
    if(!(it.sources||[]).some(s=>s.mealId===meal.id))continue;
    const d=shelfLifeDays(it.name);
    if(d==null)continue;
    const ts=it.checkedAt+d*DAY_MS;
    if(!best||ts<best.ts)best={ts,days:d,ingredient:it.name};
  }
  return best;
}

/* Libellé et niveau d'urgence. */
function deadlineLabel(n){
  if(n<0)return n===-1?'En retard d’un jour':('En retard de '+(-n)+' jours');
  if(n===0)return 'À faire aujourd’hui';
  if(n===1)return 'À faire demain';
  if(n<=3)return 'À faire sous '+n+' jours';
  const d=new Date(Date.now()+n*DAY_MS);
  return 'Avant le '+d.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});
}
function urgencyLevel(n){
  if(n<0)return 'late';
  if(n<=1)return 'soon';
  if(n<=3)return 'warn';
  return 'ok';
}
/* Tri : le plus urgent d'abord, puis les repas sans contrainte, puis les plus récents. */
function sortMealsByPriority(list){
  return list.slice().sort((a,b)=>{
    const da=mealDeadline(a),db=mealDeadline(b);
    if(da&&db)return da.ts-db.ts;
    if(da)return -1;
    if(db)return 1;
    return b.createdAt-a.createdAt;
  });
}

function hasAny(name,list){for(const k of list){if(name.includes(k))return true;}return false;}

/* Renvoie les régimes compatibles d'une recette. */
function dietFlags(r){
  const names=(r.ingredients||[]).map(i=>normIng(i.name));
  let meat=false,dairy=false,eggs=false,honey=false,pork=false,gluten=false;
  for(const n of names){
    const plant=hasAny(n,PLANT_OVERRIDES);
    if(!plant){
      if(hasAny(n,MEAT_FISH))meat=true;
      if(hasAny(n,DAIRY))dairy=true;
      if(hasAny(n,PORK))pork=true;
    }
    if(hasAny(n,EGGS))eggs=true;
    if(hasAny(n,HONEY))honey=true;
    if(!hasAny(n,GLUTEN_FREE_OVERRIDES)&&hasAny(n,GLUTEN))gluten=true;
  }
  return{
    vege:!meat,
    vegan:!meat&&!dairy&&!eggs&&!honey,
    sansPorc:!pork,
    sansLactose:!dairy,
    sansGluten:!gluten
  };
}

/* Le texte cherché porte à la fois sur le nom et sur les ingrédients :
   « poulet » trouve la recette qui s'appelle Poulet basquaise comme celle qui en contient. */
function recipeMatchesText(r,q){
  const n=normIng(q);
  if(!n)return true;
  if(normIng(r.name).includes(n))return true;
  return (r.ingredients||[]).some(i=>normIng(i.name).includes(n));
}
function recipeHasIngredient(r,q){
  const n=normIng(q);
  if(!n)return false;
  return (r.ingredients||[]).some(i=>normIng(i.name).includes(n));
}

function filterRecipes(list){
  return list.filter(r=>{
    if(rFilter.q&&!recipeMatchesText(r,rFilter.q))return false;
    if(rFilter.excl&&recipeHasIngredient(r,rFilter.excl))return false;
    if(rFilter.src&&(r.sourceType||'manual')!==rFilter.src)return false;
    if(rFilter.tags.size){
      const d=dietFlags(r);
      for(const t of rFilter.tags){
        if(t==='rapide'){ if((r.ingredients||[]).length>5)return false; }
        else if(t==='nouveau'){ if(meals.some(m=>m.recipeId===r.id))return false; }
        else if(!d[t])return false;
      }
    }
    return true;
  });
}

function findItemByKey(key){return shopping.find(i=>i.key===key&&!i.checked);}
function itemEffectiveBase(it){let sum=it.manual?(it.manualBase||0):0,has=it.manual&&it.manualBase!=null;for(const s of it.sources){if(s.base!=null){sum+=s.base;has=true;}}return has?sum:null;}
async function addIngredientToShopping(ing,scale,mealId,recipeName){
  const name=ing.name,unit=ing.unit||null,cls=unitClass(unit);
  const base=ing.qty!=null?toBase(ing.qty*scale,unit):null;
  const key=aggKey(name,unit);let it=findItemByKey(key);
  if(!it){it={id:uid(),key,name,unit,cls,category:categorize(name),checked:false,manual:false,manualBase:null,sources:[]};shopping.push(it);}
  it.sources.push({mealId,recipeName,base});await save('shopping',it);
}
async function removeMealContributions(mealId){
  for(const it of shopping.slice()){
    const before=it.sources.length;
    it.sources=it.sources.filter(s=>s.mealId!==mealId);
    if(it.sources.length===before)continue;
    if(it.sources.length===0&&!it.manual){shopping=shopping.filter(x=>x.id!==it.id);await softDelete('shopping',it.id);}
    else await save('shopping',it);

}
/* Un repas est d'abord PLANIFIÉ : rien ne part dans les courses tant que la semaine n'est
   pas validée, puisque le stock peut déjà couvrir une partie des besoins. */
async function addMeal(recipe,servings){
  const meal={id:uid(),recipeId:recipe.id,recipeName:recipe.name,servings,
    base:recipe.servings||servings,createdAt:Date.now(),status:'planned'};
  meals.push(meal);await save('meals',meal);
  return (recipe.ingredients||[]).length;
}
async function removeMeal(mealId){
  const m=meals.find(x=>x.id===mealId);
  // Repas validé : ce qui avait été prélevé dans le stock y retourne.
  if(m&&m.consumed&&m.consumed.length)await stockRestore(m.consumed);
  meals=meals.filter(x=>x.id!==mealId);
  await softDelete('meals',mealId);
  await removeMealContributions(mealId);
}

function iso8601ToMin(d){if(!d||typeof d!=='string')return null;const m=d.match(/PT(?:(\d+)H)?(?:(\d+)M)?/);if(!m)return null;return (parseInt(m[1]||0)*60)+parseInt(m[2]||0);}
function firstStr(v){if(typeof v==='string')return v;if(Array.isArray(v))return firstStr(v[0]);if(v&&typeof v==='object')return v.url||v.name||v['@id']||null;return null;}
function yieldToNum(v){const s=firstStr(v);if(!s)return null;const m=(''+s).match(/\d+/);return m?parseInt(m[0]):null;}
function instrToSteps(v){const out=[];const walk=x=>{if(!x)return;if(typeof x==='string'){x.split(/\r?\n/).forEach(t=>{t=t.trim();if(t)out.push(t);});return;}if(Array.isArray(x)){x.forEach(walk);return;}if(typeof x==='object'){if(x['@type']==='HowToSection'&&(x.itemListElement||x.steps)){walk(x.itemListElement||x.steps);return;}const t=(x.text||x.name||'').toString().trim();if(t)out.push(t);}};walk(v);return out.map(s=>s.replace(/\s+/g,' ').trim()).filter(Boolean);}
function findRecipeNode(data){const seen=[];const isR=o=>o&&typeof o==='object'&&(o['@type']==='Recipe'||(Array.isArray(o['@type'])&&o['@type'].includes('Recipe')));const walk=o=>{if(!o||typeof o!=='object')return;if(isR(o)){seen.push(o);return;}if(Array.isArray(o)){o.forEach(walk);return;}if(o['@graph'])walk(o['@graph']);for(const k in o){if(k!=='@graph'&&typeof o[k]==='object')walk(o[k]);}};walk(data);return seen[0]||null;}
function extractRecipeFromHTML(html){
  const doc=new DOMParser().parseFromString(html,'text/html');
  const scripts=[...doc.querySelectorAll('script[type="application/ld+json"]')];
  let node=null;
  for(const sc of scripts){
    let data;try{data=JSON.parse(sc.textContent);}catch(e){try{data=JSON.parse(sc.textContent.replace(/[\u0000-\u001F]+/g,' '));}catch(e2){continue;}}
    node=findRecipeNode(data);if(node)break;
  }
  if(!node){
    const t=(doc.querySelector('meta[property="og:title"]')||{}).content||doc.title||'Recette';
    return{name:t.trim(),image:(doc.querySelector('meta[property="og:image"]')||{}).content||'',servings:null,ingredients:[],steps:[],partial:true};
  }
  const raw=Array.isArray(node.recipeIngredient)?node.recipeIngredient:(node.recipeIngredient?[node.recipeIngredient]:[]);
  const ingredients=raw.map(x=>parseIngredient(typeof x==='string'?x:firstStr(x))).filter(Boolean);
  return{name:(firstStr(node.name)||'Recette').trim(),image:firstStr(node.image)||'',servings:yieldToNum(node.recipeYield),prep:iso8601ToMin(node.prepTime),cook:iso8601ToMin(node.cookTime),ingredients,steps:instrToSteps(node.recipeInstructions),partial:ingredients.length===0};
}
function sourceType(url){const u=(url||'').toLowerCase();if(u.includes('marmiton'))return'marmiton';if(u.includes('jow'))return'jow';if(u.includes('cuisineaz'))return'cuisineaz';if(u.includes('750g'))return'750g';return'web';}
function isJowUrl(url){try{return /(^|\.)jow\.(fr|com)$/i.test(new URL(url).hostname);}catch(e){return false;}}
/* Les identifiants Jow ont deux formats : l'ancien ObjectId (24 caractères hexadécimaux) et le
   nouveau suffixe de slug alphanumérique (ex. 8o4qf9a96uxg2zdj104r). L'ancienne expression
   régulière ne reconnaissait que le premier, donc les liens jow.fr/recipes/... n'étaient jamais
   routés vers le parseur Jow. */
function extractJowId(url){
  try{
    const u=new URL(url);
    if(!isJowUrl(url))return null;
    const q=u.searchParams.get('recipeId');if(q)return q;
    const hex=u.pathname.match(/[a-f0-9]{24}/i);if(hex)return hex[0];
    const m=u.pathname.match(/\/recipes\/(.+)$/i);
    if(m){
      const last=m[1].replace(/\/+$/,'').split('-').pop();
      if(last&&last.length>=12&&/^[a-z0-9]+$/i.test(last))return last;
    }
  }catch(e){}
  return null;
}

/* --- Normalisation d'une recette Jow ---
   Structure réelle de l'API : la quantité est dans constituents[].ingredient.quantityPerCover,
   le nombre de couverts est roundedCoversCount, et l'unité se résout en croisant unit.id
   avec naturalUnit ou alternativeUnits de l'ingrédient. */
function normalizeUnitName(u){
  if(u==null)return null;
  const raw=String(u).trim();if(!raw)return null;
  if(PIECE.test(raw))return null;
  const low=raw.toLowerCase();
  for(const[k,v]of UNIT_MAP){if(k===low)return v;}
  const sing=low.replace(/\(s\)$/,'').replace(/s$/,'');
  if(PIECE.test(sing))return null;
  for(const[k,v]of UNIT_MAP){if(k===sing)return v;}
  return raw;
}
function jowUnit(c){
  const uid=c.unit&&(c.unit.id||c.unit._id);
  const ing=c.ingredient||{};
  const nat=ing.naturalUnit;
  if(nat&&uid&&(nat._id===uid||nat.id===uid))return normalizeUnitName(nat.name);
  for(const a of (ing.alternativeUnits||[])){
    const u=a.unit||a;
    if(u&&uid&&(u._id===uid||u.id===uid))return normalizeUnitName(u.name);
  }
  if(c.unit&&c.unit.name)return normalizeUnitName(c.unit.name);
  if(nat&&nat.name)return normalizeUnitName(nat.name);
  return null;
}
function jowQty(c){
  const ing=c.ingredient||{};
  for(const v of [ing.quantityPerCover,c.quantityPerCover,c.quantity]){
    if(typeof v==='number'&&isFinite(v))return v;
  }
  return null;
}
function normalizeJowRecipe(d){
  if(!d||typeof d!=='object')throw new Error('Réponse Jow inattendue.');
  const covers=d.roundedCoversCount||d.coversCount||d.covers||2;
  const cons=Array.isArray(d.constituents)?d.constituents:[];
  const ingredients=cons.map(c=>{
    const ing=c.ingredient||{};
    const name=(ing.name||c.name||'').trim();
    const per=jowQty(c);
    return{qty:per!=null?Math.round(per*covers*100)/100:null,unit:jowUnit(c),name};
  }).filter(i=>i.name);
  let img=d.imageUrl||'';
  if(img&&!/^https?:/i.test(img))img='https://static.jow.fr/'+String(img).replace(/^\/+/,'');
  return{name:(d.title||d.name||'Recette Jow').trim(),image:img,servings:covers,
    cook:d.cookingTime||null,prep:d.preparationTime||null,ingredients,steps:[],
    partial:ingredients.length===0};
}
function unwrapJow(d){
  if(Array.isArray(d))return d[0];
  if(d&&d.data)return Array.isArray(d.data)?d.data[0]:d.data;
  if(d&&d.recipe)return d.recipe;
  return d;
}

/* --- Recherche Jow (endpoint vérifié : POST /public/recipe/quicksearch) --- */
const JOW_SEARCH='https://api.jow.fr/public/recipe/quicksearch';
async function jowSearch(query,limit){
  const qs='?start=0&availabilityZoneId=FR&limit='+(limit||20)+'&query='+encodeURIComponent(query);
  const target=JOW_SEARCH+qs;
  const res=await fetch(viaProxy(target),{
    method:'POST',
    headers:{'Accept':'application/json','Content-Type':'application/json','Accept-Language':'fr','x-jow-withmeta':'1'},
    body:'{}'
  });
  if(!res.ok)throw new Error(await errMsg(res));
  const j=await res.json();
  return Array.isArray(j.data)?j.data:(Array.isArray(j)?j:[]);
}
/* Relais par défaut, intégré au code : l'app fonctionne sans configuration.
   Un réglage saisi à la main reste prioritaire. */
const DEFAULT_RELAY='https://panier-relay.bocquet-remi98.workers.dev';
// Relais et synchro sont le même Worker : si un seul champ est rempli, on réutilise l'autre.
function relayBase(){
  const v=(settings.proxy||'').trim()||(settings.syncUrl||'').trim()||DEFAULT_RELAY;
  return v.replace(/\/+$/,'');
}
function viaProxy(t){
  const b=relayBase();
  return b?b+'?url='+encodeURIComponent(t):t;
}

/* --- Lecture d'une page recette jow.com ---
   Les pages /recipes/<slug>-<id> sont rendues côté serveur : titre, ingrédients, quantités et
   étapes sont dans le HTML. C'est bien plus fiable que l'API (dont le domaine a changé).
   Chaque ancre d'ingrédient a un textContent NOM+QUANTITÉ+NOM : on isole la quantité en
   cherchant le plus long préfixe qui soit aussi suffixe. */
function splitJowAnchor(t){
  t=(t||'').replace(/\s+/g,' ').trim();
  if(!t)return null;
  for(let len=Math.floor(t.length/2);len>=1;len--){
    const p=t.slice(0,len);
    if(t.endsWith(p)){
      const mid=t.slice(len,t.length-len).trim();
      if(mid)return{name:p.trim(),qty:mid};
    }
  }
  return{name:t,qty:''};
}
function parseJowPage(html,url){
  const doc=new DOMParser().parseFromString(html,'text/html');
  const meta=n=>{const e=doc.querySelector('meta[property="'+n+'"]');return e?e.content:'';};
  let name=meta('og:title')||doc.title||'';
  name=name.replace(/^\s*(recipe|recette)\s*:\s*/i,'').replace(/\s*[|—-]\s*Jow\s*$/i,'').trim();

  const seen=new Set(),ingredients=[];
  doc.querySelectorAll('a[href*="/ingredients/"]').forEach(a=>{
    const part=splitJowAnchor(a.textContent||'');
    if(!part||!part.name)return;
    const k=stripAccents(part.name.toLowerCase());
    if(seen.has(k))return;seen.add(k);
    const parsed=parseIngredient(part.qty?(part.qty+' '+part.name):part.name);
    if(parsed)ingredients.push({qty:parsed.qty,unit:parsed.unit,name:part.name});
  });

  let servings=null;
  try{const c=new URL(url).searchParams.get('coversCount');if(c)servings=parseInt(c)||null;}catch(e){}
  if(!servings){
    const m=(doc.body?doc.body.textContent:'').match(/pour\s+(\d+)\s+personne/i);
    if(m)servings=parseInt(m[1]);
  }

  // Étapes : blocs "Step N" / "Étape N"
  const steps=[];
  doc.querySelectorAll('p,li,div').forEach(el=>{
    const t=(el.textContent||'').replace(/\s+/g,' ').trim();
    if(!t||t.length<12||t.length>400)return;
    if(/^(step|étape)\s*\d+\s*[:.]?\s*$/i.test(t))return;
    const m=t.match(/^(?:step|étape)\s*\d+\s*[:.]?\s*(.+)$/i);
    if(m&&m[1].length>10&&steps.length<25&&!steps.includes(m[1]))steps.push(m[1]);
  });

  return{name:name||'Recette Jow',image:meta('og:image')||'',servings:servings||null,
    ingredients,steps,partial:ingredients.length===0};
}

/* Récupération d'une recette Jow depuis un lien de partage.
   Aucun endpoint public "GET par identifiant" n'est documenté : on tente les candidats
   plausibles, puis on retombe sur la recherche par titre (endpoint vérifié). */
async function fetchJowPage(target){
  const r=await fetch(viaProxy(target),{headers:{'Accept':'text/html'}});
  if(!r.ok)throw new Error(await errMsg(r));
  return parseJowPage(await r.text(),target);
}
async function fetchJowById(id,url){
  // 1. La page publique Jow : source la plus fiable.
  const pages=[];
  if(/\/recipes\//i.test(url))pages.push(url);
  if(id&&!/\/recipes\//i.test(url))pages.push('https://jow.com/recipes/'+encodeURIComponent(id));
  for(const pg of pages){
    try{const rec=await fetchJowPage(pg);if(rec.ingredients.length)return rec;}catch(e){}
  }
  // 2. Anciennes API (conservées au cas où, mais le domaine a changé).
  for(const ep of ['https://api.jow.fr/public/recipe/'+encodeURIComponent(id),
                   'https://api.jow.fr/public/recipes/'+encodeURIComponent(id)]){
    try{
      const r=await fetch(viaProxy(ep),{headers:{'Accept':'application/json'}});
      if(!r.ok)continue;
      const rec=normalizeJowRecipe(unwrapJow(await r.json()));
      if(rec.ingredients.length)return rec;
    }catch(e){}
  }
  // Repli : lire le titre de la page partagée, puis chercher ce titre sur Jow.
  let title=null;
  try{
    const r=await fetch(viaProxy(url),{headers:{'Accept':'text/html'}});
    if(r.ok){
      const doc=new DOMParser().parseFromString(await r.text(),'text/html');
      const og=doc.querySelector('meta[property="og:title"]');
      title=(og&&og.content)||doc.title||null;
      if(title)title=title.replace(/\s*[|·—-]\s*Jow.*$/i,'').trim();
    }
  }catch(e){}
  if(title){
    try{
      const hits=await jowSearch(title,20);
      const exact=hits.find(h=>h._id===id||h.id===id);
      const chosen=exact||hits[0];
      if(chosen){
        const rec=normalizeJowRecipe(chosen);
        if(rec.ingredients.length){rec.approx=!exact;return rec;}
      }
    }catch(e){}
  }
  if(!relayBase()){
    const e2=new Error('Aucun relais configuré : Jow et Marmiton sont inaccessibles directement depuis le navigateur (CORS). Renseigne l’URL de ton Worker dans Réglages.');
    e2.noRelay=true;throw e2;
  }
  const err=new Error('Jow ne renvoie pas cette recette par lien. Ouvre la recette sur jow.com et copie le lien de la page (jow.com/recipes/…).');
  err.jowFallback=title||'';
  throw err;
}

async function fetchRecipe(url){
  // Sans relais, le navigateur ne peut joindre ni Jow ni Marmiton (CORS) : l'échec serait un
  // « Failed to fetch » opaque. On le dit clairement avant même de tenter la requête.
  if(!relayBase()){
    const e=new Error('Aucun relais disponible. Vérifie Réglages → Relais d’import (laisse le champ vide pour rétablir le relais par défaut).');
    e.noRelay=true;throw e;
  }
  if(isJowUrl(url))return fetchJowById(extractJowId(url),url);
  const res=await fetch(viaProxy(url),{headers:{'Accept':'text/html'}});
  if(!res.ok)throw new Error(await errMsg(res));
  return extractRecipeFromHTML(await res.text());
}
async function errMsg(res){let m='Erreur '+res.status;try{const j=await res.json();if(j&&j.error)m=j.error;}catch(e){}return m;}

/* ======================================================================
   Import par photo (OCR)
   ====================================================================== */
const TESS_SRC='https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';
let _tessLoading=null;
function loadTesseract(){
  if(window.Tesseract)return Promise.resolve(window.Tesseract);
  if(_tessLoading)return _tessLoading;
  _tessLoading=new Promise((res,rej)=>{
    const s=document.createElement('script');
    s.src=TESS_SRC;
    s.onload=()=>window.Tesseract?res(window.Tesseract):rej(new Error('Tesseract non chargé'));
    s.onerror=()=>rej(new Error('Impossible de charger le moteur OCR (connexion requise au 1er usage).'));
    document.head.appendChild(s);
  });
  return _tessLoading;
}
// Prétraitement : redimensionner + niveaux de gris + contraste => OCR nettement meilleur.
function preprocessImage(file){
  return new Promise((res,rej)=>{
    const img=new Image();
    img.onload=()=>{
      const MAXW=1600,MINW=1000;
      let w=img.naturalWidth,h=img.naturalHeight;
      let scale=1;
      if(w>MAXW)scale=MAXW/w; else if(w<MINW)scale=Math.min(2,MINW/w);
      w=Math.round(w*scale);h=Math.round(h*scale);
      const cv=document.createElement('canvas');cv.width=w;cv.height=h;
      const ctx=cv.getContext('2d',{willReadFrequently:true});
      ctx.drawImage(img,0,0,w,h);
      const d=ctx.getImageData(0,0,w,h),p=d.data;
      // gris + contraste doux (évite d'écraser le texte clair sur fond coloré)
      for(let i=0;i<p.length;i+=4){
        let g=0.299*p[i]+0.587*p[i+1]+0.114*p[i+2];
        g=(g-128)*1.35+128;
        g=g<0?0:g>255?255:g;
        p[i]=p[i+1]=p[i+2]=g;
      }
      ctx.putImageData(d,0,0);
      URL.revokeObjectURL(img.src);
      cv.toBlob(b=>b?res(b):rej(new Error('Échec du traitement image')),'image/png');
    };
    img.onerror=()=>rej(new Error('Image illisible'));
    img.src=URL.createObjectURL(file);
  });
}
async function ocrImage(file,onProgress){
  const T=await loadTesseract();
  const blob=await preprocessImage(file);
  const worker=await T.createWorker('fra',1,{
    logger:m=>{ if(m.status==='recognizing text'&&onProgress)onProgress(0.35+0.65*(m.progress||0)); }
  });
  try{
    if(onProgress)onProgress(0.35);
    const {data}=await worker.recognize(blob);
    return data.text||'';
  } finally { await worker.terminate(); }
}

/* --- Nettoyage du texte OCR --- */
const OCR_NOISE=/^(ingr[ée]dients?|pr[ée]paration|pr[ée]parations?|recette|[ée]tapes?|instructions?|ustensiles?|mat[ée]riel|nombre de personnes|personnes?|portions?|difficult[ée]|co[ûu]t|budget|calories|note|avis|commentaires?|partager|imprimer|ajouter|voir la recette|publicit[ée]|abonnez|newsletter|connexion|menu|accueil|rechercher|favoris|panier)\b/i;
const OCR_META=/^(pr[ée]p\.?|cuisson|repos|total|temps de|\d+\s*(min|h|heures?|minutes?)\b|pour\s+\d+\s+personnes?|\d+\s*pers)/i;
const HDR_START=/^ingr[ée]dients?\b/i;
const HDR_END=/^(pr[ée]paration|[ée]tapes?|instructions?|r[ée]alisation|ustensiles?|mat[ée]riel)\b/i;
const PIECE=/^(pi[eè]ces?|pce|pcs|unit[ée]s?)$/i;

function cleanOcrLine(line){
  let s=(line||'')
    .replace(/[|¦]/g,' ')
    .replace(/^[\s•·\-–—*>▪●○◦□■✓\u2022]+/,'')
    .replace(/\s+/g,' ').trim();
  s=s.replace(/(\d)\s*[gq]\b/gi,'$1 g')
     .replace(/(\d)\s*mi\b/gi,'$1 ml')
     .replace(/(\d)\s*ci\b/gi,'$1 cl')
     .replace(/\bO(\d)/g,'0$1')
     .replace(/(\d)[.](\d)/g,'$1,$2');
  return s.trim();
}
function isPlausibleIngredient(s){
  if(!s)return false;const t=s.trim();
  if(t.length<2||t.length>90)return false;
  if(OCR_NOISE.test(t)||OCR_META.test(t))return false;
  if(!/[a-zA-ZÀ-ÿ]/.test(t))return false;
  const letters=(t.match(/[a-zA-ZÀ-ÿ]/g)||[]).length;
  if(letters/t.length<0.4)return false;
  if(/^[\d\s.,:%€/-]+$/.test(t))return false;
  const words=t.split(/\s+/).length;
  if(words>12)return false;
  if(/^(m[ée]langer|verser|ajouter|cuire|faire|pr[ée]chauffer|battre|incorporer|laisser|d[ée]poser|couper|[ée]plucher|servir|enfourner|remuer|saler|poivrer)\b/i.test(t)&&words>4)return false;
  return true;
}
// Si un en-tête "Ingrédients" existe, ne garder que sa section.
function scopeToIngredients(lines){
  let start=-1;
  for(let i=0;i<lines.length;i++){if(HDR_START.test(lines[i].trim())){start=i+1;break;}}
  if(start<0)return lines;
  let end=lines.length;
  for(let i=start;i<lines.length;i++){if(HDR_END.test(lines[i].trim())){end=i;break;}}
  const sl=lines.slice(start,end);
  return sl.length?sl:lines;
}
// Ligne ne contenant qu'une quantité (mise en page Jow : nom puis quantité dessous).
function pureQuantity(line){
  const s=(line||'').trim();if(!s)return null;
  const m=s.match(/^((?:\d+\s+)?\d+\s*\/\s*\d+|[½⅓⅔¼¾⅕⅛]|\d+[.,]?\d*)\s*(.*)$/);
  if(!m)return null;
  const qty=numTok(m[1]);if(qty===null)return null;
  let rest=(m[2]||'').trim();
  if(!rest)return{qty,unit:null};
  if(PIECE.test(rest))return{qty,unit:null};
  for(const[k,v]of UNIT_MAP){if(rest.toLowerCase()===k)return{qty,unit:v};}
  return null;
}
function parseOcrText(text){
  const raw=(text||'').split(/\r?\n/).map(cleanOcrLine);
  const kept=scopeToIngredients(raw).filter(l=>pureQuantity(l)||isPlausibleIngredient(l));
  const merged=[];
  for(const cur of kept){
    const q=pureQuantity(cur);
    if(q){const prev=merged[merged.length-1];if(prev&&prev.qty==null){prev.qty=q.qty;prev.unit=q.unit;}continue;}
    const p=parseIngredient(cur);
    if(!p||!p.name)continue;
    if(p.unit&&PIECE.test(p.unit))p.unit=null;
    merged.push(p);
  }
  let title=null;
  if(merged.length>1&&merged[0].qty==null&&merged.some(x=>x.qty!=null)){
    const first=merged[0].name;
    if(/\s/.test(first)&&!/^(sel|poivre|huile|beurre|sucre|farine)\b/i.test(first)){title=first;merged.shift();}
  }
  const out=[];const seen=new Set();
  for(const p of merged){
    const k=stripAccents(p.name.toLowerCase())+'|'+(p.unit||'')+'|'+(p.qty??'');
    if(seen.has(k))continue;seen.add(k);out.push(p);
  }
  return{title,ingredients:out};
}

/* ======================================================================
   Synchronisation entre appareils (optionnelle, désactivée par défaut)

   Principe : un "code de partage" secret est saisi sur chaque téléphone. De ce code on dérive
   DEUX choses distinctes, par PBKDF2 avec des sels différents :
     - un identifiant de salon (envoyé au serveur) ;
     - une clé AES-GCM qui ne quitte JAMAIS le téléphone.
   Le serveur ne stocke que des identifiants, des horodatages et du chiffré : il ne peut pas
   lire tes recettes, et un autre utilisateur sans le code ne peut rien en tirer.

   Fusion : dernier écrivain gagne, enregistrement par enregistrement (pas en bloc), pour que
   deux téléphones qui ajoutent chacun un article ne s'écrasent pas mutuellement.
   ====================================================================== */
const SYNC_ITER=150000;
const b64=u8=>btoa(String.fromCharCode.apply(null,u8));
const unb64=str=>Uint8Array.from(atob(str),c=>c.charCodeAt(0));

async function deriveSync(secret){
  const enc=new TextEncoder();
  const base=await crypto.subtle.importKey('raw',enc.encode(secret),'PBKDF2',false,['deriveBits','deriveKey']);
  const key=await crypto.subtle.deriveKey(
    {name:'PBKDF2',salt:enc.encode('panier-cle-v1'),iterations:SYNC_ITER,hash:'SHA-256'},
    base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
  const bits=await crypto.subtle.deriveBits(
    {name:'PBKDF2',salt:enc.encode('panier-salon-v1'),iterations:SYNC_ITER,hash:'SHA-256'},base,256);
  const room=[...new Uint8Array(bits)].map(b=>b.toString(16).padStart(2,'0')).join('').slice(0,32);
  return{key,room};
}
async function encJSON(key,obj){
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(JSON.stringify(obj)));
  return b64(iv)+'.'+b64(new Uint8Array(ct));
}
async function decJSON(key,str){
  const [a,b]=String(str).split('.');
  if(!a||!b)throw new Error('format');
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(a)},key,unb64(b));
  return JSON.parse(new TextDecoder().decode(pt));
}

let _sync={key:null,room:null,busy:false,timer:null};
function syncEnabled(){return !!(relayBase()&&settings.syncSecret);}
async function syncPrepare(){
  if(_sync.key&&_sync.secretUsed===settings.syncSecret)return _sync;
  const d=await deriveSync(settings.syncSecret);
  _sync.key=d.key;_sync.room=d.room;_sync.secretUsed=settings.syncSecret;
  return _sync;
}
function syncEndpoint(){
  return relayBase()+'/sync';
}

/* Applique les enregistrements distants : on n'écrase que si l'horodatage distant est
   strictement plus récent, donc une modification locale postérieure est préservée. */
async function syncApplyRemote(items,key){
  let applied=0;
  for(const it of items){
    if(!it||!it.id||!SYNCED_STORES.includes(it.store))continue;
    const local=await dbGet(it.store,it.id);
    if(local&&(local.updatedAt||0)>=it.updatedAt)continue;
    let rec;
    if(it.deleted){rec={id:it.id,deleted:true,updatedAt:it.updatedAt};}
    else{
      try{rec=await decJSON(key,it.payload);}catch(e){continue;} // code différent : on ignore
      rec.id=it.id;rec.updatedAt=it.updatedAt;delete rec.deleted;
    }
    await dbPut(it.store,rec);
    applied++;
  }
  return applied;
}

async function syncRun(manual){
  if(!syncEnabled()){if(manual)toast('Synchro non configurée');return;}
  if(_sync.busy)return;
  _sync.busy=true;
  try{
    const {key,room}=await syncPrepare();
    const url=syncEndpoint();

    // 1. Récupérer ce qui a changé sur le serveur depuis notre dernier passage.
    // Tirage paginé : le serveur plafonne chaque réponse, on boucle tant qu'il reste des pages.
    let since=settings.syncCursor||0,applied=0,cursor=since,guard=0;
    while(guard++<20){
      const pull=await fetch(url+'?room='+room+'&since='+cursor,{headers:{'Accept':'application/json'}});
      if(!pull.ok)throw new Error(await errMsg(pull));
      const remote=await pull.json();
      applied+=await syncApplyRemote(remote.items||[],key);
      const next=remote.now||cursor;
      if(!remote.more||next===cursor)  {cursor=next;break;}
      cursor=next;
    }

    // 2. Envoyer nos modifications locales postérieures au dernier envoi.
    // Borne d'envoi : on repart du plus grand horodatage réellement envoyé, et la comparaison
    // est STRICTE. Avec un <= et l'heure murale, tout enregistrement écrit dans la même
    // milliseconde qu'une synchro terminée n'était jamais envoyé — donc perdu pour l'autre
    // appareil. Réémettre l'enregistrement de la borne est sans effet (le serveur ignore les
    // horodatages non strictement supérieurs).
    const lastPush=settings.syncPushedAt||0;
    const out=[];let maxTs=lastPush;
    for(const store of SYNCED_STORES){
      for(const r of await dbGetAll(store)){
        const ts=r.updatedAt||0;
        if(ts<lastPush)continue;
        if(ts>maxTs)maxTs=ts;
        const it={id:r.id,store,updatedAt:ts,deleted:!!r.deleted};
        if(!r.deleted){const c=Object.assign({},r);delete c.updatedAt;it.payload=await encJSON(key,c);}
        out.push(it);
      }
    }
    const pushedAt=maxTs;
    if(out.length){
      const res=await fetch(url+'?room='+room,{
        method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({items:out})});
      if(!res.ok)throw new Error(await errMsg(res));
    }

    settings.syncCursor=cursor;
    settings.syncPushedAt=pushedAt;
    settings.syncLastOk=Date.now();
    settings.id='app';await dbPut('settings',settings);

    if(applied){await loadAll();renderAll();}
    if(manual)toast(applied?(applied+' élément'+(applied>1?'s':'')+' reçu'+(applied>1?'s':'')):'Déjà à jour'+(out.length?' — '+out.length+' envoyé'+(out.length>1?'s':''):''));
  }catch(e){
    if(manual)toast('Échec de synchro : '+e.message);
  }finally{_sync.busy=false;}
}

// Déclenchement groupé : évite d'appeler le serveur à chaque case cochée.
function syncSoon(){
  if(!syncEnabled())return;
  clearTimeout(_sync.timer);
  _sync.timer=setTimeout(()=>syncRun(false),4000);
}

/* --- Diagnostic du relais ---
   Distingue les trois échecs possibles : URL absente, Worker injoignable, Worker joignable mais
   refusant le domaine. Sans ça, tout se ressemble : « Failed to fetch ». */
async function testRelay(){
  const base=relayBase();
  if(!base)return{ok:false,msg:'Aucune URL de relais renseignée.'};
  let u;try{u=new URL(base);}catch(e){return{ok:false,msg:'URL invalide : '+base};}
  if(u.protocol!=='https:')return{ok:false,msg:'L’URL doit commencer par https://'};
  const target='https://www.marmiton.org/recettes/recette_quiche-lorraine_30283.aspx';
  try{
    const res=await fetch(base+'?url='+encodeURIComponent(target),{headers:{'Accept':'text/html'}});
    if(!res.ok){
      let d='';try{const j=await res.json();if(j&&j.error)d=' — '+j.error;}catch(e){}
      return{ok:false,msg:'Le relais répond mais renvoie une erreur '+res.status+d};
    }
    const txt=await res.text();
    if(/recipeIngredient|application\/ld\+json/i.test(txt))
      return{ok:true,msg:'Relais fonctionnel : page Marmiton reçue ('+Math.round(txt.length/1024)+' ko).'};
    return{ok:false,msg:'Le relais répond, mais le contenu reçu ne ressemble pas à une recette.'};
  }catch(e){
    return{ok:false,msg:'Impossible de joindre le relais. Vérifie l’URL et que le Worker est déployé. ('+e.message+')'};
  }
}

  const planned=meals.filter(m=>mealStatus(m)==='planned');
  const done=meals.filter(m=>mealStatus(m)!=='planned');
  const sorted=sortMealsByPriority(done);
  const withDl=[],without=[];
  for(const m of sorted){const d=mealDeadline(m);(d?withDl:without).push({m,d});}

  if(planned.length){
    const res=planNeeds(planned);
    const box=el('div','planbox');
    box.innerHTML='<h4>'+planned.length+' repas à valider</h4><p>'
      +(res.covered.length?'<b>'+res.covered.length+'</b> ingrédient'+(res.covered.length>1?'s':'')+' déjà dans ton stock · ':'')
      +'<b>'+res.toBuy.length+'</b> à acheter</p>';

        ? 'À cuisiner sans attendre : '+withDl[0].m.recipeName+' ('+withDl[0].d.ingredient+' acheté il y a plus de '+withDl[0].d.days+' jours).'
        : (n===0?'À cuisiner aujourd’hui : ':'À cuisiner demain : ')+withDl[0].m.recipeName+' — '+withDl[0].d.ingredient+'.';
      box.innerHTML='<span class="ic">'+(n<0?'⚠️':'⏰')+'</span><span>'+esc(txt)+'</span>';
      body.appendChild(box);

  if(withDl.length){
    const eb=el('div','section-eyebrow');

    body.appendChild(eb);

  clr.onclick=()=>{inp.value='';rFilter.q='';se.classList.remove('filled');refreshRecipeList();inp.focus();};
  const syncFilled=()=>se.classList.toggle('filled',!!inp.value);
  inp.oninput=()=>{rFilter.q=inp.value;syncFilled();refreshRecipeList();};
  syncFilled();
  se.appendChild(inp);se.appendChild(clr);bar.appendChild(se);

  const chips=el('div','fchips');

  FILTER_TAGS.forEach(t=>{

    chipEls[t.id]=b;chips.appendChild(b);

  const adv=el('div','fadv');

  const exI=el('input');exI.type='search';exI.placeholder='ex. champignon';exI.value=rFilter.excl;exI.autocomplete='off';
  exI.oninput=()=>{rFilter.excl=exI.value;refreshRecipeList();};
  ex.appendChild(exI);adv.appendChild(ex);
  const sf=el('div','field');sf.innerHTML='<label>Provenance</label>';
  const sel=el('select');
  [['','Toutes'],['marmiton','Marmiton'],['jow','Jow'],['cuisineaz','CuisineAZ'],['750g','750g'],['photo','Photo (OCR)'],['manual','Saisie manuelle'],['web','Autre site']]
    .forEach(([v,l])=>{const o=el('option',null,l);o.value=v;if(rFilter.src===v)o.selected=true;sel.appendChild(o);});
  sel.onchange=()=>{rFilter.src=sel.value;refreshRecipeList();};
  sf.appendChild(sel);adv.appendChild(sf);

    inp.value='';exI.value='';sel.value='';syncFilled();
    Object.values(chipEls).forEach(b=>b.classList.remove('on'));

  return bar;

/* ---------- Remplissage par photo ----------
   La lecture brute d'une \u00e9tag\u00e8re produit un texte tr\u00e8s bruit\u00e9. On ne fait donc pas confiance
   \u00e0 l'OCR seul : chaque ligne est rapproch\u00e9e d'un VOCABULAIRE connu (rayons, ingr\u00e9dients de tes
   recettes, stock existant, table de conservation). Ce qui ne correspond \u00e0 rien est ignor\u00e9,
   et rien n'est ajout\u00e9 sans confirmation. */
function stockVocabulary(){
  const v=new Map();
  const add=n=>{const k=normIng(n);if(k.length>=3&&!v.has(k))v.set(k,n);};
  for(const grp of RAYONS)grp[3].forEach(add);
  for(const r of recipes)for(const i of (r.ingredients||[]))add(i.name);
  for(const it of stock)add(it.name);
  for(const pair of SHELF_MAP)if(pair[0])add(pair[0]);
  return [...v.entries()].sort((a,b)=>b[0].length-a[0].length);
}
/* Rapprochement mot à mot, et non par sous-chaîne : sans cela « LAIT DEMI ECREME »
   serait reconnu comme « crème », puisque « creme » est contenu dans « ecreme ».
   On teste aussi une forme dépluralisée (« pois chiches » → « pois chiche »), et on
   privilégie la correspondance la plus À GAUCHE : une étiquette commence par le produit
   (« SEMOULE COUSCOUS 500G » désigne d'abord de la semoule). */
function matchVocab(n,vocab){
  const sing=n.replace(/s\b/g,'').replace(/\s+/g,' ').trim();
  let best=null;
  for(const pair of vocab){
    const k=pair[0];
    const re=new RegExp('(?:^|\\s)'+k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'(?:\\s|$)');
    let pos=-1;
    const m1=n.match(re);if(m1)pos=m1.index;
    if(pos<0){const m2=sing.match(re);if(m2)pos=m2.index;}
    if(pos<0)continue;
    if(!best||pos<best.pos||(pos===best.pos&&k.length>best.k.length))best={k,label:pair[1],pos};
  }
  return best;
}
const RECEIPT_NOISE=/^(total|sous total|tva|carte|cb |especes|monnaie|rendu|merci|ticket|caisse|siret|magasin|client|remise|avantage|fidelite|qte|prix|eur)/i;

function extractStockCandidates(text){
  const vocab=stockVocabulary();
  const out=[];const seen=new Set();
  for(const raw of String(text||'').split(/\r?\n/)){
    let line=cleanOcrLine(raw);
    if(!line)continue;
    if(RECEIPT_NOISE.test(normIng(line)))continue;
    line=line.replace(/\b\d+[.,]\d{2}\s*(\u20ac|eur)\b/gi,' ').replace(/\bx\s*\d+\b/gi,' ').replace(/\s+/g,' ').trim();
    const n=normIng(line);
    if(n.length<3)continue;
    const hit=matchVocab(n,vocab);
    if(!hit)continue;
    if(seen.has(hit.k))continue;
    seen.add(hit.k);
    let qty=null,unit=null;
    const m=line.match(/(\d+[.,]?\d*)\s*(kg|g|ml|cl|dl|l)\b/i);
    if(m){qty=parseFloat(m[1].replace(',','.'));unit=m[2].toLowerCase();}
    out.push({name:hit.label,qty,unit,line});
  }
  return out;
}

function openStockPhoto(){

    cam.innerHTML='<svg viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg> Prendre une photo';
    const fiCam=el('input');fiCam.type='file';fiCam.accept='image/*';fiCam.capture='environment';fiCam.style.display='none';
    cam.appendChild(fiCam);c.appendChild(cam);

    const pick=el('label','btn btn-ghost btn-block');
    pick.innerHTML='<svg viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg> Choisir une image';
    const fi=el('input');fi.type='file';fi.accept='image/*';fi.style.display='none';
    pick.appendChild(fi);c.appendChild(pick);

    const prog=el('div','prog');prog.style.display='none';const bar=el('i');prog.appendChild(bar);c.appendChild(prog);
    const status=el('div','hint');c.appendChild(status);
    const buttons=[cam,pick];
    const handle=async file=>{
      if(!file)return;
      prev.src=URL.createObjectURL(file);prev.style.display='block';
      buttons.forEach(b=>b.style.display='none');prog.style.display='block';
      status.textContent='Chargement du moteur OCR\u2026';bar.style.width='8%';
      try{
        const text=await ocrImage(file,pr=>{bar.style.width=Math.round(pr*100)+'%';if(pr>.34)status.textContent='Lecture du texte\u2026';});
        const cands=extractStockCandidates(text);
        if(!cands.length){
          status.innerHTML='\u274c Aucun produit reconnu.<br>Essaie une photo plus nette et plus rapproch\u00e9e, ou un ticket de caisse.';
          buttons.forEach(b=>b.style.display='');prog.style.display='none';fiCam.value='';fi.value='';return;
        }
        closeSheet();openStockConfirm(cands);

        status.innerHTML='\u274c '+esc(err.message);
        buttons.forEach(b=>b.style.display='');prog.style.display='none';fiCam.value='';fi.value='';
      }
    };
    fiCam.onchange=()=>handle(fiCam.files&&fiCam.files[0]);
    fi.onchange=()=>handle(fi.files&&fi.files[0]);
  });
}

function openStockConfirm(cands){
  const chosen=new Set(cands.map((_,i)=>i));
  openSheet('Produits d\u00e9tect\u00e9s',c=>{
    const h=el('div','hint','D\u00e9coche ce qui est faux, puis ajoute au stock. Sans quantit\u00e9 lue, l\u2019ingr\u00e9dient compte comme disponible.');
    h.style.marginBottom='12px';c.appendChild(h);
    cands.forEach((cd,i)=>{
      const row=el('div','item');
      const chk=el('button','check');chk.innerHTML='<svg viewBox="0 0 24 24"><path d="M5 12l5 5L19 7"/></svg>';
      const setOn=on=>{
        row.classList.toggle('done',!on);
        chk.style.background=on?'var(--leaf)':'';
        chk.style.borderColor=on?'var(--leaf)':'';
        const sv=chk.querySelector('svg');sv.style.opacity=on?'1':'0';sv.style.transform=on?'none':'scale(.4)';
      };
      chk.onclick=()=>{if(chosen.has(i))chosen.delete(i);else chosen.add(i);setOn(chosen.has(i));};
      const b=el('div','body');
      b.appendChild(el('div','name',cd.name));
      b.appendChild(el('div','sub','lu : '+cd.line));
      row.appendChild(chk);row.appendChild(b);
      if(cd.qty!=null)row.appendChild(el('span','qty',fmtQty(toBase(cd.qty,cd.unit),unitClass(cd.unit),cd.unit)));
      c.appendChild(row);setOn(true);
    });
    const add=el('button','btn btn-primary btn-block');add.style.marginTop='14px';
    add.textContent='Ajouter au stock';
    add.onclick=async()=>{
      let n=0;
      for(let i=0;i<cands.length;i++){
        if(!chosen.has(i))continue;
        await stockSet(cands[i].name,cands[i].qty,cands[i].unit);n++;
      }
      closeSheet();setTab('stock');renderStock();
      toast(n+' produit'+(n>1?'s':'')+' ajout\u00e9'+(n>1?'s':'')+' au stock');
    };
    c.appendChild(add);
  });
}

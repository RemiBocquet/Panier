  openSheet('Valider la semaine',c=>{
    const box=el('div','planbox');
    box.innerHTML='<h4>'+list.length+' repas \u00e0 valider</h4><p>'
      +(covered.length?covered.length+' ingr\u00e9dient'+(covered.length>1?'s':'')+' d\u00e9j\u00e0 en stock \u00b7 ':'')
      +toBuy.length+' \u00e0 acheter</p>';

      c.appendChild(sectionEyebrow('D\u00e9j\u00e0 en stock',covered.length));

        const l=el('div','planline cov');

        l.appendChild(el('span','q',(x.exact&&x.used!=null)?fmtQty(x.used,x.cls,x.unit):'\u2713'));
        w.appendChild(l);
      });
      c.appendChild(w);

    const w2=el('div','planbox');
    if(!toBuy.length)w2.appendChild(el('div','hint','Rien \u00e0 acheter : ton stock couvre toute la semaine.'));
    toBuy.forEach(x=>{
      const l=el('div','planline');
      l.appendChild(el('span',null,x.name));
      l.appendChild(el('span','q',x.base!=null?fmtQty(x.base,x.cls,x.unit):''));
      w2.appendChild(l);

    const btn=el('button','btn btn-accent btn-block');btn.style.marginTop='14px';
    btn.innerHTML='<svg viewBox="0 0 24 24"><path d="M9 11l3 3 8-8"/><path d="M20 12v6a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h9"/></svg>Valider et g\u00e9n\u00e9rer les courses';

function openServingsStep(recipe){
  const base=recipe.servings||2;
  const dflt=settings.household||base;
  openSheet(recipe.name,c=>{
    const f=el('div','field');f.innerHTML='<label>Nombre de personnes</label>';
    const st=el('div','stepper');
    const minus=el('button',null,'−');const val=el('input');val.type='text';val.inputMode='numeric';val.value=dflt;const plus=el('button',null,'+');
    const clamp=()=>{let n=parseInt(val.value)||1;val.value=Math.max(1,Math.min(50,n));};
    minus.onclick=()=>{val.value=Math.max(1,(parseInt(val.value)||1)-1);};
    plus.onclick=()=>{val.value=Math.min(50,(parseInt(val.value)||1)+1);};
    val.onblur=clamp;
    st.appendChild(minus);st.appendChild(val);st.appendChild(plus);f.appendChild(st);
    if(recipe.servings)f.appendChild(el('div','hint','Recette prévue pour '+recipe.servings+' pers. — les quantités sont ajustées automatiquement.'));
    c.appendChild(f);
    const info=el('div','hint','Les '+(recipe.ingredients?recipe.ingredients.length:0)+' ingrédients rejoindront la liste de courses à la validation de la semaine.');
    info.style.marginBottom='14px';c.appendChild(info);
    const btn=el('button','btn btn-accent btn-block');
    btn.innerHTML='<svg viewBox="0 0 24 24"><path d="M9 11l3 3 8-8"/><path d="M20 12v6a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h9"/></svg>Ajouter aux repas';
    btn.onclick=async()=>{clamp();await addMeal(recipe,parseInt(val.value)||dflt);closeSheet();renderCourses();renderRepas();renderRecettes();updateBadges();toast('Ajouté aux repas de la semaine');};
    c.appendChild(btn);
  });
}
function openRecipeDetail(r){
  openSheet(r.name,c=>{
    if(r.image){const im=el('div');im.style.cssText='height:150px;border-radius:14px;background:#eee center/cover no-repeat;margin-bottom:14px;box-shadow:var(--shadow)';im.style.backgroundImage="url('"+r.image+"')";c.appendChild(im);}
    const meta=el('div','hint');const bits=['<span class="tagsrc '+esc(r.sourceType||'manual')+'">'+esc(r.sourceType||'manuel')+'</span>'];
    if(r.servings)bits.push(r.servings+' pers.');if(r.cook)bits.push('cuisson '+r.cook+' min');
    const df=dietFlags(r);
    const tags=[];
    if(df.vegan)tags.push('🌿 végan');else if(df.vege)tags.push('🌱 végétarien');
    if(df.sansGluten)tags.push('🌾 sans gluten');
    if(df.sansLactose)tags.push('🥛 sans lactose');
    if(tags.length)bits.push(tags.join(' &nbsp;·&nbsp; '));
    meta.innerHTML=bits.join(' &nbsp;·&nbsp; ');meta.style.marginBottom='14px';c.appendChild(meta);
    const add=el('button','btn btn-accent btn-block');
    add.innerHTML='<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Ajouter aux repas';
    add.onclick=()=>{closeSheet();openServingsStep(r);};c.appendChild(add);
    c.appendChild(sectionEyebrow('Ingrédients',(r.ingredients||[]).length));
    const ul=el('ul','det-ings');
    (r.ingredients||[]).forEach(ing=>{
      const li=el('li');li.appendChild(el('span',null,ing.name));
      li.appendChild(el('span','q',ing.qty!=null?fmtQty(toBase(ing.qty,ing.unit),unitClass(ing.unit),ing.unit):''));
      ul.appendChild(li);
    });
    if((r.ingredients||[]).length===0)ul.appendChild(el('div','hint','Aucun ingrédient. Modifie la recette pour en ajouter.'));
    c.appendChild(ul);
    if((r.steps||[]).length){c.appendChild(sectionEyebrow('Préparation',r.steps.length));const ol=el('ol','steps');r.steps.forEach(s=>ol.appendChild(el('li',null,s)));c.appendChild(ol);}
    const row=el('div','btn-row');
    const edit=el('button','btn btn-ghost btn-block','Modifier');edit.onclick=()=>openRecipeForm(r);row.appendChild(edit);
    if(r.source){const link=el('a','btn btn-ghost btn-block','Ouvrir la source');link.href=r.source;link.target='_blank';link.rel='noopener';row.appendChild(link);}
    c.appendChild(row);
    const del=el('button','btn btn-danger btn-block','Supprimer la recette');del.style.marginTop='2px';
    del.onclick=async()=>{if(!confirm('Supprimer « '+r.name+' » ?'))return;recipes=recipes.filter(x=>x.id!==r.id);await softDelete('recipes',r.id);closeSheet();renderRecettes();};
    c.appendChild(del);
  });
}

        if(err.jowFallback!==undefined){
          // Lien Jow non résolu : bascule vers la recherche par nom, pré-remplie si connue.
          closeSheet();openJowSearch(err.jowFallback||'');
          toast('Lien Jow non résolu — recherche par nom');
          return;
        }
        let extra='Astuce : essaie l’import par photo si le site bloque.';
        if(/failed to fetch|networkerror|load failed/i.test(err.message))

function openJowSearch(prefill){
  openSheet('Rechercher sur Jow',c=>{
    const f=el('div','field');f.innerHTML='<label>Nom de la recette</label>';
    const inp=el('input');inp.type='search';inp.placeholder='quiche lorraine, poulet curry…';
    inp.autocomplete='off';inp.enterKeyHint='search';
    if(prefill)inp.value=prefill;
    f.appendChild(inp);c.appendChild(f);
    const btn=el('button','btn btn-primary btn-block');
    const lbl='<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>Rechercher';
    btn.innerHTML=lbl;
    const status=el('div','hint');status.style.marginTop='10px';
    const results=el('div');results.style.marginTop='6px';
    async function run(){
      const q=inp.value.trim();
      if(!q){status.textContent='Saisis un nom de recette.';return;}
      btn.disabled=true;btn.innerHTML='<span class="spin"></span> Recherche…';
      status.textContent='';results.innerHTML='';
      try{
        const hits=await jowSearch(q,20);
        if(!hits.length){status.textContent='Aucun résultat pour « '+q+' ».';}
        else{
          results.appendChild(sectionEyebrow('Résultats',hits.length));
          hits.forEach(h=>{
            let rec;try{rec=normalizeJowRecipe(h);}catch(e){return;}
            const row=el('div','pickrow');
            const th=el('div','thumb');
            if(rec.image)th.style.backgroundImage="url('"+rec.image+"')";
            else th.textContent=rec.name.charAt(0).toUpperCase();

/* ---------- Recherche d'images libres de droits (Openverse) ----------
   Openverse agrège des images sous licence Creative Commons / domaine public (Flickr,
   Wikimedia, musées...). Pas de clé API à gérer : recherche publique, directement depuis
   le navigateur. Certaines licences (CC-BY) demandent de créditer l'auteur en cas de
   republication — on l'affiche sur chaque vignette, sans le stocker (l'app ne garde que
   l'URL de l'image, comme pour une image importée depuis une recette web). */
async function openverseSearch(query){
  const qs='?q='+encodeURIComponent(query)+'&page_size=24&mature=false';
  const r=await fetch('https://api.openverse.org/v1/images/'+qs,{headers:{'Accept':'application/json'}});
  if(!r.ok)throw new Error('Openverse indisponible ('+r.status+').');
  const d=await r.json();
  return (d.results||[]).filter(x=>x&&x.url).map(x=>({
    url:x.url,
    thumb:x.thumbnail||x.url,
    creator:x.creator||''
  }));
}
function openImagePicker(initialQuery,onPick){
  openSheet('Choisir une image',c=>{
    const se=el('div','fsearch');se.style.marginBottom='10px';
    se.innerHTML='<svg class="mag" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>';
    const inp=el('input');inp.type='search';inp.placeholder='ex. poulet basquaise';inp.autocomplete='off';
    inp.value=initialQuery||'';
    se.appendChild(inp);c.appendChild(se);

    const hint=el('div','hint');
    hint.innerHTML='Images sous licence libre (Creative Commons / domaine public), via <b>Openverse</b>. Certaines demandent de créditer l’auteur affiché sous la vignette si tu republies la recette ailleurs.';
    hint.style.marginBottom='10px';c.appendChild(hint);

    const status=el('div','hint');status.style.margin='0 2px 8px';c.appendChild(status);
    const grid=el('div');grid.style.cssText='display:grid;grid-template-columns:repeat(3,1fr);gap:8px';
    c.appendChild(grid);

    let seq=0;
    async function run(q){
      const my=++seq;
      grid.innerHTML='';
      if(!q.trim()){status.textContent='';return;}
      status.textContent='Recherche…';
      try{
        const results=await openverseSearch(q.trim());
        if(my!==seq)return;
        status.textContent=results.length?'':'Aucun résultat — essaie un autre mot-clé.';
        results.forEach(r=>{
          const cell=el('button');
          cell.style.cssText='padding:0;border:none;border-radius:10px;overflow:hidden;aspect-ratio:1;background:#eee;cursor:pointer;position:relative';
          const img=el('img');img.src=r.thumb;img.loading='lazy';img.alt='';
          img.style.cssText='width:100%;height:100%;object-fit:cover;display:block';
          cell.appendChild(img);
          if(r.creator){
            const cr=el('div',null,r.creator);
            cr.style.cssText='position:absolute;left:0;right:0;bottom:0;font-size:9.5px;color:#fff;background:rgba(0,0,0,.55);padding:2px 4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap';
            cell.appendChild(cr);
          }
          cell.onclick=()=>{onPick(r.url);closeSheet();};
          grid.appendChild(cell);
        });
      }catch(e){
        if(my!==seq)return;
        status.textContent='❌ '+e.message;
      }
    }
    let deb;
    inp.oninput=()=>{clearTimeout(deb);deb=setTimeout(()=>run(inp.value),400);};
    if(inp.value)run(inp.value);
  });
}

function openRecipeForm(recipe){

  openSheet(isNew?'Nouvelle recette':'Modifier la recette',c=>{
    if(data.sourceType==='photo'){
      const w=el('div','hint');

    const findImg=el('button','btn btn-ghost btn-block');findImg.style.marginBottom='14px';

    const ebIng=sectionEyebrow('Ingrédients',data.ingredients.length);c.appendChild(ebIng);
    const ingWrap=el('div');c.appendChild(ingWrap);
    function drawIngs(){
      ingWrap.innerHTML='';
      ebIng.innerHTML='Ingrédients <span class="count">· '+data.ingredients.length+'</span>';
      data.ingredients.forEach((ing,idx)=>{
        const line=el('div','ing-line');
        const q=el('input','q');q.value=ing.qty!=null?String(ing.qty).replace('.',','):'';q.placeholder='qté';q.inputMode='decimal';
        const u=el('input','u');u.value=ing.unit||'';u.placeholder='unité';
        const n=el('input','n');n.value=ing.name||'';n.placeholder='ingrédient';
        q.oninput=()=>{const v=q.value.trim().replace(',','.');const p=v===''?null:parseFloat(v);ing.qty=(p==null||isNaN(p))?null:p;};
        u.oninput=()=>{ing.unit=u.value.trim()||null;};
        n.oninput=()=>{ing.name=n.value;};
        const rm=el('button','rm');rm.innerHTML='<svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg>';
        rm.onclick=()=>{data.ingredients.splice(idx,1);drawIngs();};
        line.appendChild(q);line.appendChild(u);line.appendChild(n);line.appendChild(rm);
        ingWrap.appendChild(line);
      });
    }
    drawIngs();
    const addIng=el('button','btn btn-ghost btn-block','+ Ajouter un ingrédient');addIng.style.marginTop='4px';
    addIng.onclick=()=>{data.ingredients.push({qty:null,unit:null,name:''});drawIngs();};
    c.appendChild(addIng);

    const pasteF=el('div','field');pasteF.style.marginTop='14px';
    pasteF.innerHTML='<label>Coller une liste (une ligne = un ingrédient)</label>';
    const ta=el('textarea');ta.placeholder='200 g de farine\n2 œufs\n1 pincée de sel';
    pasteF.appendChild(ta);
    const pb=el('button','btn btn-ghost btn-block','Analyser et ajouter');pb.style.marginTop='8px';
    pb.onclick=()=>{
      const {ingredients}=parseOcrText(ta.value);
      let add=ingredients;
      if(add.length===0){add=ta.value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean).map(parseIngredient).filter(Boolean);}
      add.forEach(p=>data.ingredients.push({qty:p.qty,unit:p.unit,name:p.name}));
      ta.value='';drawIngs();
      if(add.length)toast(add.length+' ingrédient'+(add.length>1?'s':'')+' ajouté'+(add.length>1?'s':''));
    };
    pasteF.appendChild(pb);c.appendChild(pasteF);

    const stepsF=el('div','field');stepsF.innerHTML='<label>Préparation (une étape par ligne)</label>';
    const sta=el('textarea');sta.value=data.steps.join('\n');sta.style.minHeight='120px';
    stepsF.appendChild(sta);c.appendChild(stepsF);

    // NB : ne pas nommer cette variable « save » — elle masquerait la fonction globale save().
    const btnSave=el('button','btn btn-primary btn-block');btnSave.style.marginTop='4px';
    btnSave.innerHTML='<svg viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><path d="M17 21v-8H7v8M7 3v5h8"/></svg>Enregistrer la recette';
    btnSave.onclick=async()=>{
      data.name=nameF.input.value.trim();
      if(!data.name){toast('Donne un nom à la recette');nameF.input.focus();return;}
      data.image=imgF.input.value.trim();
      data.servings=servF.input.value?parseInt(servF.input.value):null;
      data.ingredients=data.ingredients.filter(i=>(i.name||'').trim()).map(i=>({qty:i.qty,unit:i.unit,name:i.name.trim()}));
      data.steps=sta.value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
      await save('recipes',data);
      const ix=recipes.findIndex(x=>x.id===data.id);
      if(ix>=0)recipes[ix]=data;else recipes.push(data);
      closeSheet();setTab('recettes');renderRecettes();
      toast(isNew?'Recette enregistrée':'Recette mise à jour');
    };
    c.appendChild(btnSave);
  });
}
function field(label,value,type){
  const wrap=el('div','field');wrap.appendChild(el('label',null,label));

  wrap.appendChild(input);return{wrap,input};
}

/* ---------- Durées de péremption (personnalisables) ---------- */
function openShelfLifeSettings(){
  const pending=Object.assign({},settings.shelfOverrides||{});
  openSheet('Durées de péremption',c=>{
    const intro=el('div','hint');
    intro.innerHTML='Nombre de jours avant péremption à partir de l’achat, utilisé pour calculer les échéances des repas. Laisse le champ vide pour « ne périme jamais ». Réglage propre à cet appareil.';
    intro.style.marginBottom='12px';c.appendChild(intro);

    const se=el('div','fsearch');se.style.marginBottom='10px';
    se.innerHTML='<svg class="mag" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>';
    const sInp=el('input');sInp.type='search';sInp.placeholder='Rechercher un ingrédient…';sInp.autocomplete='off';
    se.appendChild(sInp);c.appendChild(se);

    const resetAll=el('button','btn btn-ghost btn-block','Réinitialiser toutes les valeurs par défaut');
    resetAll.style.marginBottom='10px';
    resetAll.onclick=()=>{Object.keys(pending).forEach(k=>delete pending[k]);draw();};
    c.appendChild(resetAll);

    const count=el('div','hint');count.style.margin='0 2px 8px';c.appendChild(count);
    const list=el('div');c.appendChild(list);

    function rowFor(k,def){
      const row=el('div','planline');
      const left=el('div');left.style.cssText='display:flex;align-items:center;gap:6px;min-width:0;overflow:hidden';
      const nameEl=el('span',null,k.charAt(0).toUpperCase()+k.slice(1));
      nameEl.style.cssText='overflow:hidden;text-overflow:ellipsis;white-space:nowrap';
      const tag=el('span','pill','modifié');tag.style.display='none';tag.style.flex='none';
      left.appendChild(nameEl);left.appendChild(tag);

      const right=el('div');right.style.cssText='display:flex;align-items:center;gap:6px;flex:none';
      const inp=el('input');inp.type='text';inp.inputMode='numeric';inp.placeholder='jamais';
      inp.style.cssText='width:56px;text-align:center;border:1.5px solid var(--hair);border-radius:8px;padding:6px 2px';
      const rst=el('button',null,'↺');rst.title='Réinitialiser';
      rst.style.cssText='width:30px;height:30px;border-radius:8px;color:var(--muted);flex:none';
      right.appendChild(inp);right.appendChild(rst);

      const sync=()=>{
        const overridden=pending.hasOwnProperty(k);
        const eff=overridden?pending[k]:def;
        inp.value=eff==null?'':String(eff);
        tag.style.display=overridden?'':'none';
      };
      inp.oninput=()=>{
        const v=inp.value.trim();
        if(v==='')pending[k]=null;
        else{const n=parseInt(v);if(!isNaN(n))pending[k]=Math.max(0,Math.min(365,n));}
        tag.style.display=pending.hasOwnProperty(k)?'':'none';
      };
      rst.onclick=()=>{delete pending[k];sync();};
      sync();
      row.appendChild(left);row.appendChild(right);
      return row;
    }

    function draw(){
      list.innerHTML='';
      const q=normIng(sInp.value);
      const items=SHELF_LIFE.filter(([k])=>!q||normIng(k).includes(q));
      count.textContent=items.length+' ingrédient'+(items.length>1?'s':'');
      items.forEach(([k,def])=>list.appendChild(rowFor(k,def)));
      if(!items.length)list.appendChild(el('div','hint','Aucun ingrédient ne correspond.'));
    }
    sInp.oninput=draw;
    draw();

    const save=el('button','btn btn-primary btn-block','Enregistrer');
    save.style.marginTop='14px';
    save.onclick=async()=>{
      settings.shelfOverrides=pending;settings.id='app';
      await dbPut('settings',settings);
      closeSheet();renderRepas();updateBadges();
      toast('Durées de péremption enregistrées');
    };
    c.appendChild(save);
  });
}

    sk.appendChild(gen);
    const skh=el('div','hint');
    skh.innerHTML='Ce code chiffre tes données <b>avant</b> l’envoi : le serveur ne peut pas les lire, et personne ne peut y accéder sans lui. Saisis exactement le même sur ton second téléphone. Si tu le perds, les données déjà envoyées deviennent illisibles.';
    sk.appendChild(skh);c.appendChild(sk);

    const sSave=el('button','btn btn-primary btn-block','Enregistrer et synchroniser');
    sSave.style.marginBottom='8px';
    sSave.onclick=async()=>{
      const changedSecret=(settings.syncSecret||'')!==skI.value.trim();
      settings.syncUrl=suI.value.trim();
      settings.syncSecret=skI.value.trim();
      if(changedSecret){settings.syncCursor=0;settings.syncPushedAt=0;_sync.key=null;}
      settings.id='app';await dbPut('settings',settings);
      closeSheet();
      if(syncEnabled())syncRun(true);else toast('Synchro désactivée');
    };
    c.appendChild(sSave);
    if(syncEnabled()){
      const now=el('button','btn btn-ghost btn-block','Synchroniser maintenant');
      now.style.marginBottom='8px';
      now.onclick=()=>{closeSheet();syncRun(true);};
      c.appendChild(now);
      const last=el('div','hint');
      last.textContent=settings.syncLastOk?('Dernière synchro réussie : '+new Date(settings.syncLastOk).toLocaleString('fr-FR')):'Jamais synchronisé.';
      last.style.marginBottom='4px';c.appendChild(last);
    }

    c.appendChild(sectionEyebrow('Application','v'+APP_VERSION));
    const upd=el('button','btn btn-ghost btn-block','Rechercher une mise à jour');
    upd.style.marginBottom='8px';
    upd.onclick=()=>{closeSheet();checkForUpdate(true);};
    c.appendChild(upd);
    const uh=el('div','hint');
    uh.textContent='L’app se met à jour toute seule au lancement quand tu es connecté. Ce bouton force la vérification.';
    uh.style.marginBottom='4px';
    c.appendChild(uh);

    c.appendChild(sectionEyebrow('Données',recipes.length+meals.length+shopping.length));
    const stat=el('div','hint');
    stat.textContent=recipes.length+' recettes · '+meals.length+' repas · '+shopping.length+' articles. Tout est stocké sur cet appareil.';
    stat.style.marginBottom='12px';c.appendChild(stat);

    const exp=el('button','btn btn-ghost btn-block','Exporter (sauvegarde JSON)');exp.style.marginBottom='8px';
    exp.onclick=()=>{
      const dump={recipes,meals,shopping,settings,_v:1,_date:new Date().toISOString()};
      const blob=new Blob([JSON.stringify(dump,null,2)],{type:'application/json'});
      const a=el('a');a.href=URL.createObjectURL(blob);a.download='panier-sauvegarde.json';a.click();
    };
    c.appendChild(exp);

    const impLbl=el('label','btn btn-ghost btn-block');impLbl.textContent='Importer une sauvegarde';impLbl.style.marginBottom='8px';
    const fi=el('input');fi.type='file';fi.accept='application/json';fi.style.display='none';
    fi.onchange=async()=>{
      const file=fi.files&&fi.files[0];if(!file)return;
      try{
        const d=JSON.parse(await file.text());
        if(!d||typeof d!=='object')throw new Error('structure');
        if(!confirm('Remplacer les données actuelles par la sauvegarde ?'))return;
        // On écrit D'ABORD, on retire ensuite : à aucun moment les données ne sont
        // détruites avant que la sauvegarde ne soit effectivement en place.
        const keep={recipes:new Set(),meals:new Set(),shopping:new Set()};
        for(const st of SYNCED_STORES){
          for(const rec of (d[st]||[])){
            if(!rec||!rec.id)continue;
            keep[st].add(rec.id);
            await save(st,rec);
          }
        }
        for(const st of SYNCED_STORES){
          for(const rec of await dbGetAll(st)){
            if(!rec.deleted&&!keep[st].has(rec.id))await softDelete(st,rec.id);
          }
        }
        if(d.settings){d.settings.id='app';await dbPut('settings',d.settings);}
        await loadAll();closeSheet();renderAll();toast('Sauvegarde importée');
      }catch(e){toast('Fichier invalide');}
    };
    impLbl.appendChild(fi);c.appendChild(impLbl);

    const clr=el('button','btn btn-danger btn-block','Tout effacer');
    clr.onclick=async()=>{
      if(!confirm('Effacer toutes les recettes, repas et courses ? Action irréversible.'))return;
      for(const st of SYNCED_STORES)await tombstoneAll(st);
      recipes=[];meals=[];shopping=[];closeSheet();renderAll();toast('Données effacées');
    };
    c.appendChild(clr);
  });
}

/* ---------- Câblage ---------- */
function renderAll(){renderCourses();renderRepas();renderStock();renderRecettes();updateBadges();}
document.querySelectorAll('nav.tabbar button').forEach(b=>{b.onclick=()=>setTab(b.dataset.tab);});
$('#qa-btn').onclick=quickAdd;
const _stb=$('#st-btn');if(_stb)_stb.onclick=stockQuickAdd;
const _sti=$('#st-input');if(_sti)_sti.addEventListener('keydown',e=>{if(e.key==='Enter')stockQuickAdd();});
$('#qa-input').addEventListener('keydown',e=>{if(e.key==='Enter')quickAdd();});
$('#btn-settings').onclick=openSettings;
$('#btn-import').onclick=()=>openImport();
$('#btn-new').onclick=()=>openRecipeForm({});

/* ---------- Mises à jour de l'application ----------
   Le service worker sert la coquille en réseau d'abord : un simple relancement de l'app
   suffit à récupérer la dernière version. Ce bloc gère en plus le cas où le service worker
   lui-même a changé : on propose alors un rechargement en un geste. */
const APP_VERSION='1.8.5';
let _swReg=null,_reloading=false;

function showUpdateBanner(worker){
  const t=$('#toast');
  t.textContent='Nouvelle version — appuyer pour recharger';
  t.style.pointerEvents='auto';
  t.classList.add('show');
  clearTimeout(toast._t);
  t.onclick=()=>{
    t.onclick=null;t.style.pointerEvents='';t.classList.remove('show');
    if(worker)worker.postMessage('SKIP_WAITING');
    setTimeout(()=>{if(!_reloading){_reloading=true;location.reload();}},400);
  };
  // Le bandeau reste 12 s, puis s'efface : la mise à jour s'appliquera au prochain lancement.
  toast._t=setTimeout(()=>{t.onclick=null;t.style.pointerEvents='';t.classList.remove('show');},12000);
}

function watchForUpdate(reg){
  if(!reg)return;
  if(reg.waiting)showUpdateBanner(reg.waiting);
  reg.addEventListener('updatefound',()=>{
    const nw=reg.installing;
    if(!nw)return;
    nw.addEventListener('statechange',()=>{
      // "installed" avec un contrôleur déjà en place = mise à jour en attente
      if(nw.state==='installed'&&navigator.serviceWorker.controller)showUpdateBanner(nw);
    });
  });
}

async function checkForUpdate(manual){
  if(!('serviceWorker'in navigator)){if(manual)toast('Non pris en charge par ce navigateur');return;}
  try{
    const reg=_swReg||await navigator.serviceWorker.getRegistration();
    if(!reg){if(manual)toast('Application non installée en local');return;}
    await reg.update();
    if(manual){
      if(reg.waiting)showUpdateBanner(reg.waiting);
      else toast('Tu es déjà à jour (v'+APP_VERSION+')');
    }
  }catch(e){ if(manual)toast('Vérification impossible — hors-ligne ?'); }
}

function initServiceWorker(){
  if(!('serviceWorker'in navigator))return;
  // updateViaCache:'none' => sw.js n'est jamais servi depuis le cache HTTP,
  // sans quoi le navigateur peut garder l'ancien pendant des heures.
  navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(reg=>{
    _swReg=reg;
    watchForUpdate(reg);
    // Vérification au lancement, puis toutes les heures si l'app reste ouverte.
    checkForUpdate(false);
    setInterval(()=>checkForUpdate(false),60*60*1000);
  }).catch(()=>{});
  // Quand l'app revient au premier plan, on revérifie.
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkForUpdate(false);});
  navigator.serviceWorker.addEventListener('controllerchange',()=>{
    if(_reloading)return;_reloading=true;location.reload();
  });
}

async function boot(){
  await openDB();await loadAll();renderAll();
  const q=new URLSearchParams(location.search);
  const t=q.get('tab');if(t&&TITLES[t])setTab(t);
  // Partage entrant (share_target) : une URL partagée ouvre l'import pré-rempli.
  const shared=q.get('shared')||q.get('text')||'';
  const m=shared.match(/https?:\/\/\S+/);
  if(m){setTab('recettes');openImportLink(m[0]);}
  else if(q.get('action')==='import'){setTab('recettes');openImport();}
  initServiceWorker();
  purgeTombstones().catch(()=>{});
  if(syncEnabled()){
    syncRun(false);
    document.addEventListener('visibilitychange',()=>{if(!document.hidden)syncRun(false);});
    setInterval(()=>syncRun(false),5*60*1000);
  }
}
boot();
